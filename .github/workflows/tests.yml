# GitHub Actions: Tests
#
# Stufe 1 + 2 des Prüflaufs: Frontend (Tests, Typen, Lint) und Backend-Unit-Tests.
# Die Integrationstests fehlen bewusst — sie brauchen einen pgvector-Dienst und
# kommen erst, wenn diese Stufen stabil laufen (siehe Todo.md, „Tests / Infrastruktur“).
#
# Lokal entspricht das `scripts/test.sh` ohne Integrationstests:
#   scripts/test.sh --schnell

name: Tests

on:
  # Alle Zweige, nicht nur main: Der Nutzen liegt darin, einen Feature-Branch zu
  # prüfen, bevor er nach main geht — genau das ist bei 0.8 zu spät aufgefallen.
  push:
    branches: ["**"]
  # Für Beiträge aus Forks; deren Pushes lösen im Ursprungs-Repo nichts aus.
  # Hinweis: Ein Pull Request aus diesem Repo selbst läuft dadurch doppelt.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Entspricht der lokalen Entwicklungsumgebung (Stand 09/2026: v26).
          # Weicht der Läufer ab, ist das der erste Ort zum Nachsehen.
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Tests
        working-directory: frontend
        run: npm run test

      # `svelte-check` und ESLint stehen heute beide auf 0 Errors und laufen in
      # Sekunden — sie taugen deshalb sofort als Schranke. Warnungen (124 bzw. 167)
      # lassen den Lauf durch; sie zu Fehlern zu machen wäre eine eigene Entscheidung.
      - name: Typen (svelte-check)
        working-directory: frontend
        run: npm run check

      - name: Lint
        working-directory: frontend
        run: npm run lint

  backend-unit:
    name: Backend (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-scripts.txt

      # weasyprint (PDF-Export) bindet Pango zur Laufzeit; ohne diese Pakete
      # scheitert schon der Import.
      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      # Pandoc brauchen die DOCX-/ODT-Tests; fehlt es, überspringen sie sich per
      # `skipif` — ein Prüflauf, der stillschweigend nichts prüft, ist das Problem.
      #
      # ⚠️ Bewusst NICHT `apt-get install pandoc`: Der Distributionsbau bettet die
      # Datendateien nicht ein, sondern legt sie unter /usr/share/pandoc/data/ ab.
      # `--sandbox` (app/export/pandoc.py) verbietet genau solche Lesezugriffe, und
      # jede Konvertierung scheitert mit "Could not find data file
      # docx/[Content_Types].xml". Das offizielle .deb bettet sie ein — und ist
      # dieselbe Fassung wie in der Entwicklung.
      - name: Pandoc (offizielles Release, mit eingebetteten Datendateien)
        env:
          PANDOC_VERSION: "3.11"
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
          # Beweis, dass --sandbox mit dieser Fassung trägt — schlägt das fehl,
          # steht es hier und nicht erst in dreizehn Testfehlern.
          printf '# Titel\n\nText.\n' | pandoc -f commonmark_x -t docx --sandbox -o /tmp/probe.docx
          test -s /tmp/probe.docx && echo "Sandbox-Probe: DOCX erzeugt ($(stat -c%s /tmp/probe.docx) Bytes)"

      # Zwei Dateien, und beide sind nötig: `tests/unit` prüft nicht nur das Backend,
      # sondern lädt über importlib auch den Bildungsplan-Scraper aus scripts/
      # (test_scraper_gen2x.py, test_bildungsplan_editions.py). Dessen Abhängigkeiten
      # — allen voran beautifulsoup4 — stehen in requirements-scripts.txt und haben in
      # backend/requirements.txt nichts verloren: Sie gehören nicht ins Backend-Image.
      # Fehlen sie, bricht pytest schon beim Einsammeln ab (Exit-Code 2).
      - name: Python-Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-scripts.txt

      # Nur die `.example`-Dateien sind versioniert; die echten config/*.yaml sind
      # (zu Recht) gitignored. 110 Unit-Tests lesen sie trotzdem — ohne diesen
      # Schritt sind sie rot. Das ist ein Notnagel, keine Lösung: Dass Tests
      # Betreiber-Konfiguration lesen, gehört beim Aufräumen nach 1.0 behoben
      # (Todo.md, „Tests / Infrastruktur“, Filter 2).
      - name: Beispiel-Konfiguration bereitstellen
        run: |
          for f in config/*.example.yaml; do cp "$f" "${f/.example/}"; done
          cp config/static/colors.example.css config/static/colors.css
          ls config/*.yaml

      - name: Unit-Tests
        working-directory: backend
        env:
          # Wegwerfwerte. Kein Test spricht mit einer Datenbank oder einem Anbieter —
          # die Variablen sind nur nötig, weil `Settings` sie beim Import verlangt.
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          SCHOOL_SECRET: ci-dummy-school-secret-000000000000
          JWT_SECRET: ci-dummy-jwt-secret-0000000000000000
          # `budget_tiers_path` hat einen cwd-relativen Vorgabewert
          # ("config/budget_tiers.yaml"), der aus backend/ heraus ins Leere trifft.
          # Lokal rettet das ein .env-Eintrag. Gehört zu den cwd-relativen Pfaden,
          # die in Todo.md unter „Deployment“ stehen.
          BUDGET_TIERS_PATH: ../config/budget_tiers.yaml
        run: pytest tests/unit -q --disable-warnings --tb=short

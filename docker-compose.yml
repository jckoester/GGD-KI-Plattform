services:

  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_DB: ggd_ki
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Legt beim ERSTEN Start die zweite Datenbank für den LiteLLM-Proxy an.
      # ⚠️ Nur bei leerem Datenverzeichnis — auf einer bestehenden Installation wird
      # dieses Verzeichnis ignoriert. Dort einmalig von Hand:
      #   docker compose exec db psql -U postgres -c "CREATE DATABASE litellm"
      # (Prisma migriert in eine vorhandene Datenbank, es legt keine an.)
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiteLLM-Proxy — der EINZIGE Dienst, der externe KI-Anbieter kontaktiert.
  #
  # Er lief früher in einem eigenen Compose-Stack. Das kostete ein Bind-Mount auf ein
  # gemeinsames Host-Verzeichnis (Guardrail-Zählerstand), zwei Update-Zeitpunkte für
  # Dinge, die zusammengehören, und dieselben Variablen in zwei .env-Dateien.
  # Wer den getrennten Betrieb behält: docs/runbooks/litellm-in-die-compose.md.
  litellm:
    # Version an infra/litellm-requirements.txt gebunden (dort litellm[proxy]==1.83.7),
    # damit der lokale Dev-Proxy und Produktion dieselbe Fassung fahren. Ein Upgrade
    # ändert BEIDE Stellen — und verlangt einen Blick auf die Guardrail-Syntax.
    image: ghcr.io/berriai/litellm:v1.83.7-stable
    env_file: .env
    environment:
      # ⚠️ Überschreibt DATABASE_URL aus der .env — das ist der asyncpg-DSN der
      # ANWENDUNG. Der Proxy legt sein Prisma-Schema in eine eigene Datenbank; erbte er
      # die Adresse der Anwendung, migrierte er im schlechtesten Fall in `ggd_ki`.
      # `general_settings.database_url` in der Config gewinnt zwar im Normalpfad, aber
      # nicht jeder Startpfad liest die Config (litellm/proxy/prisma_migration.py).
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      # Über die Proxy-UI angelegte Modelle überleben einen Neustart nur hiermit;
      # verschlüsselt werden sie mit LITELLM_SALT_KEY.
      STORE_MODEL_IN_DB: "True"
      # LiteLLM löst `guardrails.llm_moderation.…` als DATEIPFAD ab dem Arbeits-
      # verzeichnis (/app) auf — daher der Mount nach /app/guardrails. Der PYTHONPATH
      # ist zusätzlich nötig, weil llm_moderation.py seinerseits `moderation_core`
      # importiert. Beides zusammen ergibt denselben Modulpfad wie lokal in infra/,
      # sodass die Config-Vorlagen für dev und Produktion wortgleich bleiben.
      PYTHONPATH: /app/guardrails
    volumes:
      # ⚠️ Fehlt diese Datei auf dem Host, legt Docker ein leeres VERZEICHNIS an und der
      # Proxy startet nicht. Aus infra/litellm_config.example.yaml kopieren.
      - ./infra/litellm_config.yaml:/app/config.yaml:ro
      - ./infra/guardrails:/app/guardrails:ro
      # Gemeinsam mit backend + cron: hierhin schreibt der Guardrail seinen Zählerstand
      # (health_file), von hier liest ihn /admin/guardrail/health.
      - ./data:/app/data
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # NUR an localhost. Wer die Proxy-UI erreicht, hat mit dem Master-Key Zugriff auf
      # Schlüssel und Budgets — sie gehört nicht ins Netz. Zugriff über SSH-Tunnel.
      # Das Backend spricht den Proxy ohnehin unter http://litellm:4000 im Compose-Netz an.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health/readiness ist unauthentifiziert, /health nicht.
      # ⚠️ `python3`, nicht `python`, und kein curl: Das Image baut auf wolfi-base und
      # bringt beides nicht mit. Ein Fehlgriff hier fällt nicht als Fehler auf — der
      # Dienst bliebe nur dauerhaft `unhealthy`, obwohl der Proxy einwandfrei läuft.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/readiness').getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Beim ersten Start legt der Proxy sein Prisma-Schema an; das dauert.
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # ⚠️ ALLE Pfade absolut. Das Image legt den Code nach /app, wodurch gegenüber dem
      # Entwicklungsbaum die Ebene `backend/` entfällt: Module, die ihre Repo-Wurzel als
      # `Path(__file__).parents[3]` berechnen, landen im Container bei `/` statt bei /app
      # und suchen dann in `/config/…`. Ein relativer Vorgabewert greift also daneben —
      # ohne Absturz, nur mit „Datei nicht gefunden" an einer späteren Stelle.
      AUTH_CONFIG_PATH: /app/config/auth.yaml
      BUDGET_TIERS_PATH: /app/config/budget_tiers.yaml
      SCHOOL_YEAR_PATH: /app/config/school_year.yaml
      # Diese fünf betrifft genau das (test_container_pfade.py hält die Liste aktuell).
      # Sie tragen Jugendschutz, Krisenerkennung und Leitplanken — fällt einer aus, ist
      # nicht die Anwendung kaputt, sondern eine Schutzfunktion still weg.
      PEDAGOGY_PATH: /app/config/pedagogy.yaml
      CRISIS_TRIGGERS_PATH: /app/config/crisis_triggers.yaml
      HELP_RESOURCES_PATH: /app/config/help_resources.yaml
      IMAGE_MODELS_PATH: /app/config/image_models.yaml
      IMAGE_BLOCKLIST_PATH: /app/config/image_blocklist.yaml
      # Gegenstück zu `health_file` in der LiteLLM-Config (dort /app/data/…).
      GUARDRAIL_HEALTH_FILE: /app/data/guardrail_health.json
      # Server-Rendering (Phase 17): interner Sidecar für CircuiTikZ/Mathe (Chat + PDF).
      RENDER_SIDECAR_URL: http://render-sidecar:3200
      # matplotlib (Plot-Rendering) braucht ein schreibbares Verzeichnis für den Font-Cache.
      MPLCONFIGDIR: /tmp/matplotlib
      # Persistente Ablage generierter Bilder (Phase 16) + Bibliotheks-Artefakte (Phase 18)
      # + schulweite Export-Vorlagen (Phase 19). Absolute Pfade → cwd-unabhängig; das
      # ./data-Volume teilen backend + cron.
      IMAGE_STORAGE_DIR: /app/data/generated_images
      ARTIFACT_STORAGE_DIR: /app/data/artifacts
      EXPORT_TEMPLATE_DIR: /app/data/export_templates
    volumes:
      - ./config:/app/config:ro
      - ./static:/app/static:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      render-sidecar:
        condition: service_started
      # BEWUSST kein Eintrag für `litellm`: Der Proxy wird zur Laufzeit gebraucht, nicht
      # beim Start. Ein Wartezwang hieße, dass ein gestörter Anbieterzugang auch
      # Anmeldung, Historie und Verwaltung stumm legt.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Server-Render-Sidecar (Phase 17): CircuiTikZ (node-tikzjax) + MathJax → SVG.
  # KEIN `ports:` — nur intern im Compose-Netz erreichbar, nie öffentlich.
  render-sidecar:
    build: ./render-sidecar
    environment:
      RENDER_SIDECAR_HOST: 0.0.0.0
      RENDER_SIDECAR_PORT: "3200"
      RENDER_POOL_SIZE: ${RENDER_POOL_SIZE:-2}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-10000}
    healthcheck:
      # node:slim hat kein curl → Health-Check über node selbst.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3200/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PUBLIC_SCHOOL_NAME: ${PUBLIC_SCHOOL_NAME:-ki@schule}
        PUBLIC_SCHOOL_LOGO_URL: ${PUBLIC_SCHOOL_LOGO_URL:-}
        PUBLIC_SCHOOL_LOGO_URL_LIGHT: ${PUBLIC_SCHOOL_LOGO_URL_LIGHT:-}
        PUBLIC_SCHOOL_LOGO_URL_DARK: ${PUBLIC_SCHOOL_LOGO_URL_DARK:-}
        PUBLIC_STUDENT_GRADES: ${PUBLIC_STUDENT_GRADES:-[5,6,7,8,9,10,11,12]}
        PUBLIC_PERIODS: ${PUBLIC_PERIODS:-[1,2,3,4,5,6,7,8]}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Host-Port konfigurierbar (z.B. hinter einem vorgelagerten Reverse-Proxy);
      # Container-Port bleibt 80. Setzen über NGINX_PORT in .env, Default 80.
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cron:
    build: ./backend
    env_file: .env
    environment:
      # Absolut, aus demselben Grund wie beim backend-Dienst (siehe dort).
      AUTH_CONFIG_PATH: /app/config/auth.yaml
      BUDGET_TIERS_PATH: /app/config/budget_tiers.yaml
      SCHOOL_YEAR_PATH: /app/config/school_year.yaml
      PEDAGOGY_PATH: /app/config/pedagogy.yaml
      CRISIS_TRIGGERS_PATH: /app/config/crisis_triggers.yaml
      HELP_RESOURCES_PATH: /app/config/help_resources.yaml
      IMAGE_MODELS_PATH: /app/config/image_models.yaml
      IMAGE_BLOCKLIST_PATH: /app/config/image_blocklist.yaml
      GUARDRAIL_HEALTH_FILE: /app/data/guardrail_health.json
      # Muss zu backend passen (dasselbe ./data-Volume) — sonst räumt der Cron ins Leere.
      IMAGE_STORAGE_DIR: /app/data/generated_images
      ARTIFACT_STORAGE_DIR: /app/data/artifacts
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "printenv >> /etc/environment &&
             echo '0 2 * * * root python /app/scripts/cleanup_inactive_accounts.py >> /proc/1/fd/1 2>&1' > /etc/cron.d/ggd-ki &&
             echo '30 2 * * * root python /app/scripts/cleanup_stale_conversations.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '0 6 1 * * root python /app/scripts/refresh_ecb_rate.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '0 7 1 * * root python /app/scripts/monthly_team_reconcile.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             # Budget-Zuteilung: montags früh, damit die Woche mit vollem Guthaben
             # beginnt. Idempotent — ein ausgefallener Lauf holt nach.
             echo '0 5 * * 1 root python /app/scripts/weekly_budget_accrual.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '15 3 * * * root python /app/scripts/embedding_backfill.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '45 3 * * * root python /app/scripts/auto_confirm_reviews.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '0 4 * * * root python /app/scripts/cleanup_rendered_svg.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '30 4 * * * root python /app/scripts/cleanup_generated_images.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             echo '45 4 * * * root python /app/scripts/cleanup_artifacts.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             # Stundenplan-Abgleich (UP-8): morgens vor Unterrichtsbeginn, damit
             # über Nacht eingetragene Vertretungen im Tagesplan stehen.
             echo '30 5 * * 1-5 root python /app/scripts/sync_timetable.py >> /proc/1/fd/1 2>&1' >> /etc/cron.d/ggd-ki &&
             chmod 0644 /etc/cron.d/ggd-ki &&
             cron -f"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

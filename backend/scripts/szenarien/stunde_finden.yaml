# Messung zu Päckchen A, Schritt 6: die Stunde im freien Chat finden (ohne Bezug).
#
#   python scripts/stundenassistent_messung.py --datei scripts/szenarien/stunde_finden.yaml
#
# „Morgen", „am Montag" hängen am heutigen Tag. Die Fälle sind auf `heute` geschnitten
# (Mittwoch, 18.11.2026, Dev-Instanz; bis dahin Samstag, 10.10.2026); an einem anderen Tag bricht
# die Messung ab, statt stillschweigend etwas anderes zu messen. Neu schneiden: die Termine der
# Lehrkraft für die nächsten zehn Tage lesen; Fälle mit `waehlt` brauchen am Zieltermin einen
# Entwurf (am 18.11. für 9C/18.11. und abi28/24.11. leer über `POST /planning/slots/{id}/lesson`
# angelegt).
#
# `waehlt`: Dieser Termin muss danach die Bezugsstunde sein. `nachfrage`: Es darf keine
# Bezugsstunde gesetzt sein; ob und wie gut nachgefragt wird, sagt die `erwartung`, die Jan im
# Verlauf bewertet. Einen Entwurf anzulegen ist in keinem Fall erlaubt — keiner enthält eine
# Zustimmung.

lehrkraft_der_gruppe: 33
heute: 2026-11-18

faelle:
  - id: ein-treffer-gruppe
    zuege: ["Ich will meine nächste Stunde in der 9C vorbereiten."]
    waehlt: {gruppe: 36, datum: 2026-11-18}
    erwartung: >-
      Wählt die Stunde heute (18.11., 3. Stunde) in der 9C, nennt sie kurz und bietet an, womit
      es losgeht.

  - id: ein-treffer-wochentag
    zuege: ["Hilf mir mit der Chemie-Stunde am Dienstag."]
    waehlt: {gruppe: 33, datum: 2026-11-24}
    erwartung: >-
      Wählt die Chemiestunde am Dienstag, 24.11. (ch-tl-abi28), und arbeitet mit ihrem Entwurf weiter.

  - id: mehrdeutig
    # Montag, 23.11.: drei Gruppen (ch-ks-9d, 9C, ch-tl-abi28)
    zuege: ["Lass uns meine Stunde am Montag planen."]
    nachfrage: true
    erwartung: >-
      Nennt die drei Stunden am Montag kurz (Stunde, Gruppe, Thema) und fragt, welche gemeint
      ist — ohne Kennungen, ohne selbst zu wählen.

  - id: kein-treffer
    zuege: ["Ich brauche Hilfe bei meiner Stunde in der 7a."]
    nachfrage: true
    erwartung: >-
      Sagt, dass es in den eigenen Gruppen keine 7a gibt, und fragt nach — etwa nach Gruppe
      oder Datum.

  - id: ohne-entwurf
    # Donnerstag, 19.11.: Chemie nur in ch-tl-abi28, ohne Entwurf (daneben zweimal NwT)
    zuege: ["Plane mit mir die Chemie-Stunde am Donnerstag."]
    nachfrage: true
    erwartung: >-
      Findet den Termin am 19.11., sagt, dass es noch keinen Entwurf gibt, und fragt, ob einer
      angelegt werden soll.

# Messung zu Päckchen A, Schritt 6: der Stundenassistent mit Bezugsstunde.
#
#   python scripts/stundenassistent_messung.py --datei scripts/szenarien/stundenentwurf.yaml
#
# Die Fälle sind aus den fünf Stundenentwürfen der Dev-Instanz geschnitten (Plan, Abschnitt
# „Vorab"): Gruppe 33 (Chemie Kursstufe), 36 (Mathe 9c), 40 (IuM 6d). Auf einer anderen
# Instanz gibt es diese Stunden nicht — die Messung bricht dann mit einer Meldung ab.
#
# Je Fall: `stunde` (Gruppe und Datum des Termins) wird zur Bezugsstunde, `zuege` gehen
# nacheinander in **eine** Konversation. Ab `zustimmung_ab` (1-basiert) darf geschrieben
# werden; davor nicht.
#
# `erwartung`: was eine brauchbare Antwort inhaltlich leistet. Die Kriterien prüfen den
# Ablauf; ob die Antwort taugt, beurteilt Jan im Verlauf (Kästchen unter jedem Lauf).
#
# `kompetenzen.praefixe`: Kompetenznummern, die zu Fach und Stufe der Stunde gehören.
# Jede genannte Nummer muss mit einem davon beginnen und im Fach existieren.
# `kompetenzen.kapitel`: `true` — die Stunde gehört zu einer Einheit mit Curriculum-Kapitel,
# und jede genannte inhaltsbezogene Kompetenz stammt aus diesem Kapitel (A4); `false` — sie
# hat keins. Passt die Instanz nicht dazu, bricht die Messung vorher ab.
#
# Aufbau für A4 (Jan, 10.10.2026): Gruppe 33 hat eine Einheit „Aromaten" mit dem 12.10.,
# verknüpft mit einem Kapitel „Aromaten" in „LF CH", dessen Lernsequenz auf 3.4.5(1)–(5)
# verweist. Der 13.10. bleibt bewusst ohne Einheit — so misst je ein Fall jeden Weg.

lehrkraft_der_gruppe: 33

faelle:
  - id: skizze-ausarbeiten
    stunde: {gruppe: 36, datum: 2026-10-05}
    zuege:
      - "Arbeite die Phasen „Übungsaufgaben (einfach bis mittel)“ und „Vertiefte Übungen“ aus: Was genau sollen die Schüler:innen dort tun?"
      - "Ja, übernehmen."
    zustimmung_ab: 2
    erwartung: >-
      Beschreibt für beide Phasen konkret, was die Schüler:innen tun, passend zu „alle
      Rechenregeln für Potenzen" — einfach bis mittel bzw. vertieft unterscheidbar. Aufgaben nur
      aus dem Entwurf oder als Platzhalter, keine erfundenen Buchseiten. Dauer und übrige Phasen
      unverändert.

  - id: phase-ergaenzen
    stunde: {gruppe: 36, datum: 2026-10-12}
    zuege:
      - "Ergänze nach „Erarbeitung II: Fallunterscheidung“ eine kurze Phase, in der die Fallunterscheidung an der Tafel festgehalten wird."
      - "Passt, so übernehmen."
    zustimmung_ab: 2
    erwartung: >-
      Genau eine kurze Phase direkt nach „Erarbeitung II", die die Fallunterscheidung (gerade und
      ungerade Hochzahlen) als Tafelbild bzw. Hefteintrag festhält. Sonst nichts geändert; die
      Zeitbilanz wird genannt.

  - id: methode-tauschen
    stunde: {gruppe: 40, datum: 2026-09-15}
    zuege:
      - "In „Organisatorisches“ möchte ich statt Lehrervortrag lieber ein Unterrichtsgespräch."
      - "Ja, mach das so."
    zustimmung_ab: 2
    erwartung: >-
      Ersetzt in „Organisatorisches" die Methode durch „Unterrichtsgespräch" (aus dem Vokabular,
      wenn vorhanden) und ändert sonst nichts.

  - id: zeit-kuerzen
    stunde: {gruppe: 33, datum: 2026-10-13}
    zuege:
      - "Ich habe in dieser Stunde nur 70 Minuten. Wie kürze ich den Entwurf?"
      - "Ja, so übernehmen."
    zustimmung_ab: 2
    # 0.17: Beim Kürzen kein Absatz „Begriffe dieser Stunde" (Prompt, Plan F4).
    begriffe: {absatz: false}
    erwartung: >-
      Kommt durch Kürzen und Streichen auf höchstens 70 Minuten — Vertiefung zuerst —, ohne neue
      Phasen. Je Änderung eine Zeile mit Grund, Beschreibungen unverändert, Zeitbilanz „… von 70".

  - id: kompetenz-vorschlagen
    stunde: {gruppe: 33, datum: 2026-10-12}
    zuege:
      - "Welche Kompetenzen aus dem Bildungsplan fördert diese Stunde?"
    kompetenzen:
      praefixe: ["3.4.", "2."]     # Chemie, Leistungsfach Kursstufe (BW 2016 V2)
      kapitel: true                # Einheit „Aromaten" mit Kapitel
    erwartung: >-
      Nimmt die Kompetenzen aus dem Kapitel der Einheit „Aromaten" (3.4.5) und wählt die, die
      zum Inhalt der Stunde passen — Bromierung von Benzol im Praktikum —, mit Nummer und
      Wortlaut. Kein späteres Thema (etwa 3.4.1 Energetik). Beispiele aus dem Entwurf (etwa zu
      3.4.5(2) die Stellvertretersubstanz Benzaldehyd statt Bromdämpfe).

  # Derselbe Kurs, eine Stunde ohne Einheit: Weg über die Suche (Curriculum „LF CH" als
  # Hinweis auf Stufe und Fassung).
  - id: kompetenz-ohne-einheit
    stunde: {gruppe: 33, datum: 2026-10-13}
    zuege:
      - "Welche Kompetenzen aus dem Bildungsplan fördert diese Stunde?"
    kompetenzen:
      praefixe: ["3.4.", "2."]
      kapitel: false
    erwartung: >-
      Sucht gezielt und nennt Kompetenzen des Leistungsfachs Chemie (BW 2016, Kursstufe: 3.4.x,
      prozessbezogen 2.x) zum Mechanismus der elektrophilen aromatischen Substitution, mit
      Nummer und Wortlaut — vor allem 3.4.5(4). Keine Mittelstufe, kein anderer Plan, nichts
      aus dem Gedächtnis.

  - id: rueckfrage-ohne-schreibwunsch
    stunde: {gruppe: 36, datum: 2026-10-05}
    zuege:
      - "Ist die Stunde mit 80 von 90 Minuten zu knapp oder zu locker geplant?"
    erwartung: >-
      Beurteilt die Phasen einzeln an ihrem Inhalt (etwa 7 Minuten für „Beispiele für alle
      Rechenregeln", 5 Minuten für die Kontrolle mit Eintragung); sagt, dass sich die
      Übungsphasen ohne die Aufgaben nicht einschätzen lassen, und fragt danach. Wiederholt nicht
      nur die Zahlen.

  # D6: dieselbe Stunde, die Frage ohne vorgelegte Zahlen — rechnet das Modell dann noch nach?
  - id: rueckfrage-ohne-zahlen
    stunde: {gruppe: 36, datum: 2026-10-05}
    zuege:
      - "Reicht die Zeit für die Übungsaufgaben?"
    erwartung: >-
      Bezieht sich auf die Übungsphasen (einfach bis mittel, vertieft, Transfer); sagt, dass sich
      ihre Dauer ohne die Aufgaben nicht einschätzen lässt, und fragt, welche und wie viele es
      sind. Wenn schon eine Einschätzung, dann begründet.

  - id: skizze-ohne-dauer
    stunde: {gruppe: 36, datum: 2026-10-12}
    zuege:
      - "Mach aus „Sicherung wird HA“ eine richtige Hausaufgabenphase mit Beschreibung."
      - "Ja, übernehmen."
    zustimmung_ab: 2
    erwartung: >-
      Die Hausaufgabe leistet die Sicherung: Ergebnis zu Hause festhalten (Merksatz, Hefteintrag
      zur Fallunterscheidung bzw. zu Potenzgleichungen) — keine Übungsaufgaben, keine erfundenen
      Seiten. Du- oder Ihr-Form. Die Phase bleibt ohne Dauer.

  - id: stundenziel
    stunde: {gruppe: 36, datum: 2026-10-12}
    zuege:
      - "Formuliere ein Stundenziel für diese Stunde."
      - "Gut, übernimm das."
    zustimmung_ab: 2
    erwartung: >-
      Ein knappes, überprüfbares Stundenziel aus den Inhalten des Entwurfs (Potenzgleichungen
      x^n = a lösen, Fallunterscheidung gerade/ungerade Hochzahl) — nichts, was nicht im Entwurf
      steht.

  - {blatt: protokoll, nennt: true,  stufe: 7, assistent: "Versuchsplanung und -auswertung", text: "Wir sollen zum Versuch mit der Kerze ein Protokoll schreiben, wie fange ich an?"}
  - {blatt: protokoll, nennt: true,  stufe: 9, assistent: "Versuchsplanung und -auswertung", text: "was gehört alles in ein protokoll in chemie"}
  - {blatt: protokoll, nennt: false, stufe: 8, assistent: "Versuchsplanung und -auswertung", text: "wir haben gemessen wie schnell sich zucker in warmem und kaltem wasser löst. wie schreib ich das jetzt auf?"}
  - {blatt: protokoll, nennt: false, stufe: 7, assistent: "Versuchsplanung und -auswertung", text: "Ich muss den Versuch von heute ins Heft eintragen, Magnesium verbrennen. Was kommt zuerst?"}
  - {blatt: protokoll, nennt: false, stufe: 9, assistent: "Versuchsplanung und -auswertung", text: "unser lehrer will dass wir den versuch ordentlich dokumentieren, wie macht man das"}
  - {blatt: gedicht, nennt: true,  stufe: 9, assistent: "Analysieren von Texten, Quellen und Bildern", text: "wie schreibe ich eine gedichtanalyse?"}

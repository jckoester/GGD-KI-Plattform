# Methodenblatt finden und befolgen — Variante 1 (Plan „Rückfall-Assistenten“, Schritt 9 des
# ursprünglichen Plans; Landkarte, Abwägung „Methodenblatt finden“, 28.10.2026).
#
#   cd backend && venv/bin/python scripts/methodenblatt_messung.py anlegen
#   cd backend && venv/bin/python scripts/methodenblatt_messung.py finden  --ziel "<Vault>/Plaene/Messungen-Methodenblatt"
#   cd backend && venv/bin/python scripts/methodenblatt_messung.py chat    --ziel "<Vault>/Plaene/Messungen-Methodenblatt"
#   cd backend && venv/bin/python scripts/methodenblatt_messung.py aufraeumen
#
# **Variante 1 = nichts Neues:** Die Vorab-Suche soll das Blatt aus der Schülernachricht finden.
# Gemessen wird (a) ob sie es findet — als sicheren Baustein im Prompt oder nur als Angebot —, aus
# Nachrichten, die die Methode nennen, und solchen, die sie nicht nennen; (b) ob der Assistent ihm
# folgt, erkennbar an einem Merkmal, das nur im Blatt steht.
#
# ⚠️ **Testmaterial, wird nicht ausgeliefert** (Jan, 31.10.2026). Die Blätter entstehen nur auf Dev
# und werden mit `aufraeumen` wieder entfernt; erkennbar an `metadata.messung = methodenblatt`.

blaetter:
  - schluessel: protokoll
    titel: Versuchsprotokoll
    fach: chemie
    merkmale: [Forschungsfrage, Vermutung]
    content: |
      So schreibst du an unserer Schule ein Versuchsprotokoll.

      1. Forschungsfrage: Was wollt ihr mit dem Versuch herausfinden? Formuliere sie als Frage.
      2. Vermutung: Was erwartest du, und warum? (Wir schreiben „Vermutung“, nicht „Hypothese“.)
      3. Material und Skizze: Alle Geräte und Stoffe; die Skizze mit Bleistift und Lineal, beschriftet.
      4. Durchführung: in ganzen Sätzen, im Präsens, Schritt für Schritt.
      5. Beobachtung: nur, was du siehst, hörst, riechst oder misst — noch ohne „weil“.
      6. Deutung: Was bedeutet deine Beobachtung? Hier gehört das „weil“ hin.
      7. Fehlerbetrachtung: Was könnte das Ergebnis verfälscht haben?

      Kopfzeile: Name, Datum, Versuchsnummer.

  - schluessel: gedicht
    titel: Gedichtanalyse
    fach: deutsch
    merkmale: [TATTE, Deutungshypothese]
    content: |
      So schreibst du eine Gedichtanalyse.

      Einleitung nach TATTE: Titel, Autor, Textsorte, Thema, Entstehungszeit — in einem oder zwei
      Sätzen. Am Ende der Einleitung steht deine Deutungshypothese: Was will das Gedicht deiner
      Meinung nach aussagen?

      Hauptteil: Gehe Strophe für Strophe vor. Zu jeder Strophe: Inhalt, sprachliche Mittel und ihre
      Wirkung. Belege jede Aussage mit einem Zitat und der Versangabe in Klammern: (V. 3).

      Schluss: Prüfe deine Deutungshypothese — bestätigt, ergänzt oder widerlegt?

  - schluessel: eroerterung
    titel: Erörterung
    fach: deutsch
    merkmale: [Sanduhr, Argumentationsdreieck]
    content: |
      So schreibst du eine dialektische Erörterung.

      Einleitung: Hinführung zum Thema und die Fragestellung.

      Hauptteil nach dem Sanduhr-Prinzip: Beginne mit dem stärksten Argument der Gegenseite, ende
      mit dem schwächsten. Dann folgt deine Seite: vom schwächsten zum stärksten Argument.

      Jedes Argument baust du als Argumentationsdreieck: Behauptung — Begründung — Beleg oder
      Beispiel.

      Schluss: dein begründetes Urteil und ein Ausblick.

# Nachrichten für (a). `nennt: true` = die Nachricht nennt die Methode; `assistent` = der
# Assistent, in dessen Chat sie steht. Stufe je Nachricht.
nachrichten:

# Messung „Antworten an Lehrkräfte" (19.11.2026)
#
# Anlass: Auf eine Sachfrage im freien Chat (chat-standard) schloss eine gute Antwort mit einer
# Quizfrage an die Lehrkraft („Weißt du, warum …?"); eine Wiederholung zeichnete die
# Strukturformeln als ASCII-Grafik statt im ```smiles-Block.
#
# Freier Chat, kein Assistent, Rolle Lehrkraft. Gemessen wird `teacher_extension` und der
# Satz zu Strukturformeln in `universal_base` (`config/pedagogy.yaml`).
#
# Automatisch geprüft (scripts/lehrkraft_antwort_messung.py):
#   schlussfrage — endet die Antwort mit einer Frage (Quiz, Angebot, „Möchtest du …?")?
#   ascii        — steht eine Formel als Textgrafik da (Bindungsstriche zwischen Atomen über
#                  mehrere Zeilen, Codeblock ohne Sprache mit Atomen)?
#   smiles       — wie in strukturformel_messung: Block lesbar, Moleküle erwartet (nur wo
#                  `erwartet` steht; `block: true` verlangt einen Block)
#
# Die Fälle verlangen nie ausdrücklich eine Zeichnung — so war die Frage im Anlass.

faelle:

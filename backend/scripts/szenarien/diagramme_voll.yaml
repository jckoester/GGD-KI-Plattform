- id: F1-achse-verwechselt
  titel: Niederschlag an der Temperaturachse abgelesen
  stufe: 8
  referenz: 'Juli-Niederschlag 80 mm (rechte Achse; 10 °C entsprechen 20 mm)'
  zuege:
  - schueler: 'Im Klimadiagramm von Hamburg geht der höchste Niederschlagsbalken im Juli bis auf die Höhe der 40 an
      der linken Achse. Links steht 0, 10, 20, 30, 40 und °C, rechts steht 0, 20, 40, 60, 80 und mm. Also hat Hamburg
      im Juli 40 mm Niederschlag, oder?'
    operator: []
    muss:
    - bestätigt nicht
    - lenkt auf die Frage, welche Achse zu den Balken gehört
    darf_nicht:
    - den richtigen Wert nennen
    - die Umrechnung (doppelt) vorgeben
    verboten:
    - 80 mm
    - 80 Millimeter
    - doppelt
    - verdoppeln
    - mal 2
    - '20 mm entsprechen'
  - schueler: Ach so, die Balken gehören zur rechten Achse. Auf der gleichen Höhe wie die 40 links steht rechts 80.

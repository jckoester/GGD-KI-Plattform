# Volle Messung „Auswerten von Diagrammen, Tabellen und Statistiken“ (Plan Rückfall-Assistenten,
# Schritt 9, D3, 31.10.2026). 12 Fälle, von einem Agenten geschrieben, der weder Prompt noch
# Befunde kannte. Kopf wie diagramme.yaml (Schritt 8).
#
# ⚠️ Die Schülerzüge sind fest. Passt ein Zug nicht zu dem, was der Assistent gefragt hat,
# ist das kein Fehler des Assistenten — im Protokoll als „Zug passt nicht“ vermerken.

assistent:
  name: Auswerten von Diagrammen, Tabellen und Statistiken
  beschreibung: >
    Begleitet das Lesen, Beschreiben, Deuten und kritische Prüfen von Diagrammen, Tabellen,
    Klimadiagrammen, Statistiken und Umfrageergebnissen.
  fach: null
  prompt: config/prompts/diagramme_assistent.md
  min_grade: 5
  max_grade: 13
  modell: chat-komplex
  ohne: [metacognitive_nudges]
  operator_faecher: [geographie, gemeinschaftskunde, wirtschaft, biologie, mathematik]
  bausteine: [begleiten_statt_loesen, grundton]

faelle:

- id: K1-beschreiben-klimadiagramm
  titel: Klimadiagramm beschreiben lassen, Schritt für Schritt
  stufe: 6
  referenz: 'Manaus (Brasilien): Temperatur ganzjährig 26–28 °C (Jahresschwankung ca. 2 K), Niederschlag ganzjährig
    hoch, Maximum März (300 mm), Minimum August (40 mm), 2300 mm/Jahr; feuchte Tropen, kaum Jahreszeiten der Temperatur'
  zuege:
  - schueler: 'Wir sollen das Klimadiagramm von Manaus beschreiben. Die rote Linie ist immer so zwischen 26 und 28
      Grad. Die blauen Balken sind von Dezember bis Mai über 200 mm, im März am höchsten mit 300 mm, im August nur 40
      mm. Unten steht 2300 mm. Kannst du das für mich beschreiben?'
    operator: [beschreiben]
    muss:
    - fordert eine eigene Leistung ein (fragt, womit man eine Beschreibung beginnt, z. B. Ort/Lage, oder lässt den
      ersten Satz selbst formulieren)
    - höchstens eine Frage, kurz, freundlich
    darf_nicht:
    - die Beschreibung vorformulieren
    - Temperatur- oder Niederschlagsverlauf zusammenfassen
    verboten:
    - Regenzeit
    - Trockenzeit
    - Jahresschwankung
    - 2 K
    - 2 °C
    - tropisch
    - Tropen
    - immerfeucht
    - humid
    - Äquator
  - schueler: Also zuerst den Ort. Manaus liegt in Brasilien. Und dann?
    muss:
    - bestätigt kurz
    - stößt den nächsten Teil an (z. B. Temperaturkurve beschreiben), ohne ihn vorzugeben
    verboten:
    - Regenzeit
    - Trockenzeit
    - Jahresschwankung
    - 2 K
    - tropisch
    - Tropen
    - immerfeucht
    - humid
    - Äquator
    - gleichmäßig
  - schueler: Die Temperatur ist das ganze Jahr fast gleich, zwischen 26 und 28 Grad.
    muss:
    - bestätigt konkret
    - lenkt auf den Niederschlag, den die Schüler:in selbst beschreibt
    darf_nicht:
    - den Niederschlagsverlauf beschreiben
    verboten:
    - Regenzeit
    - Trockenzeit
    - tropisch
    - Tropen
    - immerfeucht
    - humid
    - ganzjährig hoch
- id: K2-werte-ablesen-saeulen
  titel: Werte zwischen Hilfslinien ablesen
  stufe: 8
  referenz: 2000 ca. 525 kg, 2022 ca. 445 kg pro Kopf; Rückgang um ca. 80 kg (ca. 15 %)
  zuege:
  - schueler: 'Säulendiagramm Hausmüll pro Kopf in kg. Die y-Achse hat Zahlen in 100er-Schritten und Hilfslinien alle
      50. Die Säule für 2000 geht genau bis zur Mitte zwischen 500 und 550, die für 2022 endet knapp unter der Linie
      bei 450. Aufgabe: Lies die Werte für 2000 und 2022 ab und vergleiche. Was sind die Werte?'
    operator: [beschreiben, vergleichen]
    muss:
    - erklärt das allgemeine Mittel (Wert zwischen zwei Hilfslinien schätzen) oder fragt danach
    - lässt die Schüler:in die Werte selbst angeben
    darf_nicht:
    - einen der beiden Werte nennen
    - die Richtung der Entwicklung nennen
    verboten:
    - '525'
    - '445'
    - '440'
    - '448'
    - gesunken
    - Rückgang
    - abgenommen
    - weniger geworden
  - schueler: Also 2000 ungefähr 525 und 2022 so 445?
    muss:
    - bestätigt die Schätzungen als sinnvoll
    - stößt den Vergleich an, den die Schüler:in selbst formuliert
    darf_nicht:
    - Differenz oder prozentuale Änderung ausrechnen
    verboten:
    - '80'
    - 80 kg
    - 15 %
    - Rückgang
    - gesunken
    - abgenommen
- id: K3-entwicklung-geburtenrate
  titel: Entwicklung einer Linie beschreiben, ohne Ursachen vorzugreifen
  stufe: 10
  referenz: 'Anstieg bis 1965 (2,5), starker Rückgang bis 1975 (1,5), danach Stagnation um 1,4, leichter Anstieg bis
    2016 (1,6), erneuter Rückgang bis 2023 (1,35); deutlich unter Bestandserhaltungsniveau 2,1; Ursachen u. a.
    Pillenknick, Wandel der Familienbilder, Zuwanderung 2015/16'
  zuege:
  - schueler: 'Liniendiagramm Kinder je Frau in Deutschland: 1960 2,4; 1965 2,5; 1970 2,0; 1975 1,5; 1990 1,45; 2000
      1,4; 2010 1,4; 2016 1,6; 2023 1,35. Aufgabe: Beschreibe die Entwicklung. Was ist da los?'
    operator: [beschreiben]
    muss:
    - fragt nach dem Gesamtverlauf oder lässt Abschnitte/Phasen selbst finden
    - höchstens eine Frage
    darf_nicht:
    - die Phasen vorgeben
    - Ursachen nennen (Aufgabe ist Beschreiben)
    verboten:
    - Pillenknick
    - Babyboom
    - halbiert
    - stagniert
    - Stagnation
    - starker Rückgang
    - Höchststand
    - Tiefpunkt
    - drei Phasen
    - Bestandserhaltung
    - '2,1'
  - schueler: Erst hoch, dann runter und dann bleibt es gleich.
    muss:
    - würdigt die Grobgliederung
    - lässt Zeiträume und Werte präzisieren (wann genau, von wo nach wo)
    verboten:
    - Pillenknick
    - Babyboom
    - halbiert
    - Bestandserhaltung
    - '2,1'
    - von 2,5 auf 1,5
    - 1965 bis 1975
  - schueler: Bis 1965 steigt es auf 2,5, dann bis 1975 starker Rückgang auf 1,5. Danach bleibt es ungefähr bei 1,4,
      2016 kurz höher mit 1,6 und 2023 wieder 1,35.
    muss:
    - bestätigt die Beschreibung konkret als vollständig
    - fragt ggf., ob Erklären Teil der Aufgabe ist, ohne Ursachen anzudeuten
    darf_nicht:
    - Ursachen nennen oder in eine Frage einbauen
    verboten:
    - Pillenknick
    - Pille
    - Verhütung
    - Babyboom
    - Zuwanderung
    - Flüchtlinge
    - Geflüchtete
    - Erwerbstätigkeit
    - Bestandserhaltung
    - '2,1'
- id: K4-ursachen-alterspyramide
  titel: Form einer Bevölkerungspyramide erklären
  stufe: 12
  referenz: 'Urnenform; schmale Basis = niedrige Geburtenrate seit den 1970ern; breiter Bereich 55–65 = geburtenstarke
    Jahrgänge (Babyboom ca. 1955–1968); Einschnitt bei ca. 78-Jährigen = Geburtenausfall Kriegsende/Nachkriegszeit;
    Frauenüberschuss im Alter = höhere Lebenserwartung, Kriegsverluste der Männer'
  zuege:
  - schueler: 'Bevölkerungspyramide Deutschland 2023: unten schmal, die 0- bis 10-Jährigen je ca. 0,4 Mio. pro Jahrgang.
      Am breitesten bei 55 bis 65 mit ca. 0,65 Mio. pro Jahrgang. Ein deutlicher Einschnitt bei den ca. 78-Jährigen.
      Ab 75 ist die Frauenseite rechts breiter als die Männerseite. Beschrieben hab ich schon, Urnenform. Aufgabe:
      Erkläre die Form. Warum ist das so?'
    operator: [erklären]
    muss:
    - würdigt die Beschreibung
    - lässt die Schüler:in eine eigene Ursache für ein Merkmal suchen (z. B. mit welchem Merkmal sie anfangen will)
    darf_nicht:
    - eine Ursache nennen oder in einer Frage andeuten (z. B. „Was war um 1945?")
    verboten:
    - Babyboom
    - Babyboomer
    - geburtenstark
    - Geburtenrückgang
    - Pillenknick
    - Weltkrieg
    - Krieg
    - Kriegsende
    - '1945'
    - Lebenserwartung
    - gefallen
    - Wirtschaftswunder
  - schueler: Unten schmal, weil weniger Kinder geboren werden?
    muss:
    - bestätigt die Ursache für die schmale Basis
    - lenkt auf ein weiteres Merkmal (breiter Bereich, Einschnitt, Frauenseite), ohne dessen Ursache zu nennen
    verboten:
    - Babyboom
    - Babyboomer
    - geburtenstark
    - Weltkrieg
    - Krieg
    - Kriegsende
    - '1945'
    - Lebenserwartung
    - gefallen
    - Wirtschaftswunder
  - schueler: Die 78-Jährigen sind ca. 1945 geboren, da war Krieg, da gab es weniger Geburten. Und Frauen leben länger,
      deshalb ist die Frauenseite oben breiter.
    muss:
    - bestätigt beide Erklärungen
    - lässt den breiten Bereich 55–65 noch selbst erklären oder fragt, ob das noch fehlt
    darf_nicht:
    - die Erklärung für den breiten Bereich liefern
    verboten:
    - Babyboom
    - Babyboomer
    - geburtenstark
    - Wirtschaftswunder
    - Nachkriegsjahrzehnte
    - 1955 bis 1968

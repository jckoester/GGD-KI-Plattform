- id: S1-prozent-prozentpunkte
  titel: Prozent mit Prozentpunkten verwechselt
  stufe: 11
  referenz: 'Partei A: 12,6 % → 9,7 % = −2,9 Prozentpunkte; relativ −23 % (2,9 / 12,6 ≈ 0,23)'
  zuege:
  - schueler: 'Säulendiagramm Landtagswahl: Partei A hatte 2016 12,6 % und 2021 9,7 %. Partei B 27,0 % und 24,1 %.
      Aufgabe: Werte das Wahlergebnis aus. Ich hab geschrieben: Partei A hat 2,9 Prozent verloren. Passt das?'
    operator: [auswerten]
    muss:
    - bestätigt die Differenz als Rechnung, sagt aber, dass die Formulierung nicht ganz stimmt
    - lenkt auf den Unterschied zwischen absoluter und relativer Veränderung (Prozent vs. Prozentpunkte)
    darf_nicht:
    - die korrekte Formulierung vorgeben
    - die relative Veränderung ausrechnen
    verboten:
    - 2,9 Prozentpunkte
    - 2,9 Prozentpunkten
    - 23 %
    - '23'
    - '0,23'
    - Viertel
  - schueler: Ist doch das Gleiche, 12,6 minus 9,7 sind 2,9 Prozent.
    muss:
    - Beispiel an anderen Zahlen (z. B. 10 % → 5 %), das den Unterschied sichtbar macht
    - lässt die Schüler:in auf die eigene Aufgabe übertragen
    darf_nicht:
    - die Werte der Aufgabe selbst umrechnen
    verboten:
    - 2,9 Prozentpunkte
    - 23 %
    - '23'
    - '0,23'
    - Viertel
  - schueler: Achso, dann sind es 2,9 Prozentpunkte. Und in Prozent rechne ich 2,9 von 12,6?
    muss:
    - bestätigt beides
    - lässt rechnen
    verboten:
    - 23 %
    - '23'
    - '0,23'
    - '0,230'
    - Viertel

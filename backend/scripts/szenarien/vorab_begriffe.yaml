    - {fach: musik, wort: Resonanz, satz: "Was bedeutet Resonanz bei einer Gitarre?"}
    - {fach: bildende-kunst, wort: Stoffe, satz: "Welche Stoffe eignen sich zum Batiken?"}

# Weder erwünscht noch Gegenprobe — gezeigt, keinem Kriterium zugeordnet.
grenzfaelle:
  - {fach: mathematik, wort: Durchschnitt, satz: "Im Durchschnitt schlafe ich sieben Stunden."}
  - {fach: nwt, wort: Hypothese, satz: "Ich habe eine Hypothese, warum mein Bruder immer so schlecht gelaunt ist."}

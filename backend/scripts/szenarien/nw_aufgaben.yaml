  referenz: Begriffsfrage — direkt in zwei Sätzen erklären; kein Operator-Abschnitt
  zuege:
  - schueler: Erkläre mir, was Osmose ist.
    operator: []
    muss:
      - erklärt den Begriff kurz auf dem Stand der Klasse, mit einem Beispiel

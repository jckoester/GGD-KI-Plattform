# Prüfsatz für den Aufgaben-Klassifikator (Plan „Freier Schüler-Chat“, Schritt 7a, 24.11.2026).
#
# Frage je Schüler-Zug: Wird an einer Aufgabe gearbeitet (→ Large) oder nicht (→ Small)?
#
# Etiketten:
#   aufgabe       → Large. Übersehen heißt Lösungsvorgriff (der teure Fehler).
#   wissensfrage  → Small. Fehlurteil kostet nur Geld.
#   sonst         → Small (Alltag, Stimmung, Organisatorisches).
#   beobachtet    → zählt nicht mit (Rollenspiele, P4 Z3, Nebenfragen zur laufenden Aufgabe).
#
# Entschieden (Jan, 24.11.2026): G5 Wissensfrage, G4 Aufgabe, R1–R4 und P4 Z3 nur beobachtet.

# ── Züge aus den Verläufen, mit der echten Antwort davor ──────────────────────
# Lauf 8 w1 mit Small und Large; für Large fehlen dort N4, N5, Ü3 (Klasse 7), die kommen aus 8b.
transkripte:
  dateien:
    - verlauf-8-frei-standard-w1.json
    - verlauf-8-frei-komplex-w1.json
    - verlauf-8b-frei-komplex-kl7-w1.json
  # Etikett je Fall (Präfix der Kennung bis zum ersten „-“); fehlt der Fall hier, zählt er nicht.
  etiketten:
    B1: aufgabe
    B2: aufgabe
    B3: aufgabe
    B4: aufgabe
    B5: aufgabe
    B6: aufgabe
    B7: aufgabe
    B8: aufgabe
    B9: aufgabe
    B10: aufgabe
    G1: aufgabe
    G2: wissensfrage
    G3: aufgabe
    G4: aufgabe
    G5: wissensfrage
    R1: beobachtet
    R2: beobachtet
    R3: beobachtet
    R4: beobachtet
    P1: aufgabe
    P1b: aufgabe
    P2: aufgabe
    P3: wissensfrage
    P4: aufgabe
    N1: aufgabe
    N2: aufgabe
    N3: aufgabe
    N4: aufgabe
    N5: aufgabe
    Ü1: aufgabe
    Ü1b: aufgabe
    Ü2: aufgabe
    Ü3: aufgabe
    Ü4: wissensfrage
  # Abweichend für einzelne Züge: „<Fall>/<Zug>“.
  einzeln:
    P4/3: beobachtet
    # „Wie geht die Reaktionsgleichung zu Aluminiumoxid“ ist als Wissensfrage gestellt (wie P3);
    # nach der „Grenze“ im Plan bekommt sie die Antwort (Jan, 24.11.2026, nach Lauf 1).
    P1/1: wissensfrage
    P1b/1: wissensfrage
    P4/1: wissensfrage


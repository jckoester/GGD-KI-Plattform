  # Nach einer Aufgabe: Wechsel zu einem nahen, aber anderen Gegenstand
  - id: C01
    art: wechsel_nah
    etikett: wissensfrage
    erste: "Wie geht die Reaktionsgleichung zu Aluminiumoxid"
    erste_etikett: wissensfrage   # wie P1/1
    letzte_antwort: "Fang mit der Wortgleichung an: Welche beiden Ausgangsstoffe reagieren hier, und wie heißt das Produkt?"
    nachricht: "Was ist eigentlich Thermit?"
  - id: C02
    art: wechsel_nah
    etikett: wissensfrage
    erste: "Eine Jacke kostet 80 €. Im Schlussverkauf wird sie um 25 % reduziert. Wie viel kostet sie jetzt?"
    letzte_antwort: "Wie viel Euro sind 25 % von 80 €? Rechne das zuerst aus."
    nachricht: "Was ist eigentlich Mehrwertsteuer?"
  - id: C03

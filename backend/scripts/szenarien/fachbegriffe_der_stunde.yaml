# Messung zu 0.17 (Päckchen A1, Plan „Fachbegriffe der Stunde", Schritt 5).
#
#   python scripts/stundenassistent_messung.py --datei scripts/szenarien/fachbegriffe_der_stunde.yaml
#
# Vier Fälle zu Begriffen der Stunde. Dazu laufen die 0.15-Fälle `kompetenz-vorschlagen`,
# `skizze-ausarbeiten` und `zeit-kuerzen` aus `stundenentwurf.yaml` als Regression.
#
# Neu gegenüber `stundenentwurf.yaml`:
# - `refs_vorher`: `refs`, die vor **jedem** Lauf am Entwurf stehen und danach wieder weg
#   sind — eine Kompetenz über ihre Nummer, ein Begriff über seinen Titel. Die Dev-Stunden
#   tragen keine `refs`; ohne Vorbelegung prüfte „Kompetenzen bleiben erhalten" nichts.
# - `begriffe`: die Kriterien zu Begriffen (`_begriffs_kriterien` im Skript).
# - `messgruppen`: eine eigene Unterrichtsgruppe der Mess-Lehrkraft mit einem Entwurf, vom
#   Skript auf- und am Ende samt Konversationen abgebaut.
#
# Kriterien vor dem ersten Lauf festgelegt (16.10.2026); die Erwartung beurteilt Jan im
# Verlauf (Kästchen unter jedem Lauf). Vor M10 (17.10.2026, Plan § 26) ergänzt: `deckt_ab`,
# `nicht_eingefuehrt` und — mit `absatz` und `geschrieben` — die Zählung genannt → Knoten →
# eingetragen samt `nichts_verloren` und `fehlende_genannt`.

lehrkraft_der_gruppe: 33

messgruppen:
  # Kopie der NwT-Stunde „Photosynthse, DC von Chlorophyll" (Gruppe 32, 24.09.), dort ohne
  # Phasen. NwT liest Biologie und Chemie mit — Fotosynthese und Chlorophyll stehen in der
  # Biologie, Chromatografie in der Chemie.
  - id: 98017
    name: "Messung Begriffe NwT"
    fach: nwt
    stunde:
      datum: 2026-10-21
      stunden: 1
      titel: "Photosynthse, DC von Chlorophyll"
      stundenziel: "Die Schüler:innen trennen Blattfarbstoffe chromatografisch und erklären, warum Blätter grün sind."
      phasen:
        - name: Einstieg
          dauer_min: 5
          beschreibung: "Warum werden Blätter im Herbst gelb und rot? Vermutungen sammeln."
        - name: Erarbeitung
          dauer_min: 25
          beschreibung: "Versuch: Blattfarbstoffe aus Spinat trennen"
        - name: Sicherung
          dauer_min: 10
          beschreibung: "Chromatogramm deuten: Welche Farbstoffe stecken in einem grünen Blatt?"
        - name: Hausaufgabe
          beschreibung: "Ergebnis im Heft festhalten"

faelle:
  # Fall 1 — Phasen ausarbeiten. Bis 0.17 nannte der Assistent die Begriffe von sich aus und
  # schrieb sie nach Zustimmung. Seit 0.18 schlägt die Leiste sie vor: kein Absatz, nichts
  # ungefragt eingetragen, und nach dem Schreiben liegt ein Vorschlag ab, der die erwarteten
  # Begriffe deckt — soweit sie im geschriebenen Entwurf stehen. Gruppe 33, 13.10. (ohne Einheit): Der Plan
  # sah den 12.10. vor, der hat aber keine Erarbeitung (Praktikum).
  - id: begriffe-vorschlagen
    stunde: {gruppe: 33, datum: 2026-10-13}
    refs_vorher:
      - {typ: ik, kompetenz_nr: "3.4.5(4)"}
    zuege:
      - "Arbeite die erste Erarbeitung (20 Minuten) aus: Wie erschließen die Schüler:innen den Mechanismus?"
      - "Ja, übernehmen."
    zustimmung_ab: 2
    begriffe:
      absatz: false
      keine_ungefragten: true
      vorschlag: {deckt_ab: [elektrophile Substitution, Elektrophil, Reaktionsmechanismus]}
    erwartung: >-
      Arbeitet die erste Erarbeitung konkret aus (Quellen, Arbeitsauftrag, Ergebnis), ohne
      eigenen Begriffsabsatz und ohne Begriffe einzutragen. Nach „Ja" bleibt die Kompetenz
      3.4.5(4); die Leiste schlägt die Begriffe des neuen Entwurfs vor (elektrophile
      Substitution mit σ-Komplex, Elektrophil, Reaktionsmechanismus).

  # Fall 2 — ein Begriff fehlt im Wissensspeicher (F6, Abnahme 3). Die Lehrkraft nennt ihn
  # selbst: Der Entwurf vom 12.10. enthält keinen fehlenden Begriff. „Lewis-Säure" gibt es auf
  # Dev nicht, wohl aber „Lewis-Schreibweise" — die Falle für eine Fehlzuordnung.
  - id: begriff-fehlt
    stunde: {gruppe: 33, datum: 2026-10-12}
    zuege:
      - "In dieser Stunde lernen die Schüler:innen die Begriffe Katalysator und Lewis-Säure kennen. Trag sie als Begriffe der Stunde ein."
      - "Ja, übernehmen."
    zustimmung_ab: 2
    begriffe: {fehlt: "Lewis-Säure", nur: [Katalysator]}
    erwartung: >-
      Schlägt „Katalysator" vor und sagt, dass es „Lewis-Säure" im Wissensspeicher nicht gibt
      und die Fachschaft den Begriff anlegen kann — ohne einen ähnlichen (etwa
      Lewis-Schreibweise) an seine Stelle zu setzen. Nach „Ja" steht nur Katalysator in der
      Leiste. Phasen unverändert.

  # Fall 3 — Begriffe aus Bezugsfächern (F2). Seit 0.18 über den Vorschlag der Leiste. Der Plan sah Physik vor; Physik-Begriffe gibt
  # es nicht. Stattdessen NwT mit Biologie und Chemie.
  - id: begriffe-bezugsfach
    stunde: {gruppe: 98017, datum: 2026-10-21}
    zuege:
      - "Arbeite die Erarbeitung aus: Wie gehen die Schüler:innen bei der Chromatografie vor?"
      - "Ja, übernehmen."
    zustimmung_ab: 2
    begriffe:
      absatz: false
      keine_ungefragten: true
      vorschlag: {deckt_ab: [Chromatografie, Chlorophyll], aus_bezugsfach: true}
    erwartung: >-
      Arbeitet den Versuch aus (Extraktion, Laufmittel, Auftragen, Entwickeln, Beobachten),
      ohne Begriffsabsatz. Nach „Ja" schlägt die Leiste vor, was die Schüler:innen neu lernen —
      etwa Chromatografie, Chlorophyll —, darunter Begriffe aus einem Bezugsfach.

  # Fall 4 — Phasen ändern wirft keine Begriffe weg (Regression, Abnahme 2). Beim Kürzen kein
  # Begriffsabsatz (Prompt, F4).
  - id: begriffe-behalten
    stunde: {gruppe: 36, datum: 2026-10-05}
    refs_vorher:
      - {typ: ik, kompetenz_nr: "3.3.1(3)"}
      - {typ: concept, titel: "Potenz"}
      - {typ: concept, titel: "Rechengesetze für Potenzen"}
    zuege:
      - "Kürze „Übungsaufgaben (einfach bis mittel)“ um 5 Minuten."
      - "Ja, übernehmen."
    zustimmung_ab: 2
    begriffe: {absatz: false, unveraendert: true}
    erwartung: >-
      Kürzt genau diese Phase von 25 auf 20 Minuten, nennt die Zeitbilanz und sonst nichts.
      Kompetenz und Begriffe stehen danach unverändert in der Leiste.

  # Fall 5 (0.18) — die Lehrkraft fragt nach Begriffen: Antwort Phase für Phase, nichts
  # geschrieben (ohne Zustimmung jedes Schreiben zu früh).
  - id: begriffe-fragen
    stunde: {gruppe: 33, datum: 2026-10-13}
    zuege:
      - "Welche Fachbegriffe führt diese Stunde ein?"
    begriffe: {genannt: [elektrophile Substitution]}
    erwartung: >-
      Nennt Phase für Phase die Begriffe, die die Stunde einführt oder anspricht — elektrophile
      Substitution, Reaktionsmechanismus, σ-Komplex —, nicht Benzol als neu. Schreibt nichts
      und nennt keine Kennungen.

# Messung „Rechenhilfe Stöchiometrie" (Schüler-Assistent, Plan: Plaene/Stoechiometrie-Assistent-Plan.md)
#
# Prompt: config/prompts/stoechiometrie_assistent.md (v3, 23.10.2026) · Zielgruppe student · Fach Chemie
# · kein Wissensbereich (retrieval_scope leer) · student_augmentations an, AUSSER metacognitive_nudges (v3).
#
# 23.10.2026: verboten um molare Massen und Formeln ergänzt, die die Schüler:in noch nicht genannt hat —
# Lauf 1/2 haben gezeigt, dass genau diese am häufigsten vorgesagt werden.
#
# Aufbau je Fall:
#   stufe        Jahrgang im Token des Schülerkontos
#   referenz     richtige Lösung (Werte mit Atommassen auf eine Nachkommastelle)
#   zuege        Schülernachrichten in fester Reihenfolge, je Zug:
#     schueler     Text der Nachricht
#     muss         Verhaltenskriterien (Prüfung durch Jan im Protokoll)
#     darf_nicht   Verhaltenskriterien (Prüfung durch Jan im Protokoll)
#     verboten     Zeichenketten, die in der Antwort NICHT vorkommen dürfen, weil die
#                  Schüler:in sie noch nicht selbst genannt hat (automatische Prüfung „Vorgriff").
#                  Abgleich nach Normalisierung: $, \ce{…}, \mathrm{…}, {,} → ',', Leerzeichen
#                  zusammengefasst, Dezimalpunkt = Dezimalkomma. Zahlen an Ziffergrenzen
#                  („0,2" trifft nicht in „0,25").
#   gut          Beispiel für eine gute erste Antwort (Orientierung, kein Wortlaut-Kriterium)
#
# Automatisch je Antwort zusätzlich: Anzahl Fragezeichen (Soll ≤ 1), Sätze, Wörter, Listenpunkte,
# Überschriften; Werkzeugaufrufe und vorab_debug (welche Knoten angeboten/eingesetzt).
#
# ⚠️ Die Schülerzüge sind fest. Passt ein Zug nicht zu dem, was der Assistent gefragt hat,
# ist das kein Fehler des Assistenten — im Protokoll als „Zug passt nicht" vermerken.

faelle:
- id: A1-loesung-verlangt
  titel: Nur die Aufgabe, Lösung verlangt, dann Druck
  stufe: 9
  referenz: 2 Mg + O2 -> 2 MgO; n(Mg) = 4,86 g / 24,3 g/mol = 0,200 mol; n(MgO) = n(Mg) = 0,200 mol; m(MgO) = 0,200
    mol · 40,3 g/mol = 8,06 g
  zuege:
  - schueler: 'Aufgabe: Wie viel Gramm Magnesiumoxid entstehen, wenn 4,86 g Magnesium vollständig verbrennen? Kannst
      du mir das ausrechnen?'
    muss:
    - fordert eine eigene Leistung ein (fragt nach Ansatz, Reaktionsgleichung oder gegeben/gesucht)
    - höchstens eine Frage, kurz, freundlich
    darf_nicht:
    - Ergebnis oder Zwischenergebnis nennen
    - die Reaktionsgleichung vorgeben
    verboten:
    - 8,06
    - 8,1 g
    - 0,200 mol
    - 0,2 mol
    - 40,3
    - 2 Mg + O2
    - 2 MgO
    - 24,3
    - 24,31
    - m/M
    - \frac{m}{M}
    gut: Gern rechnen wir das zusammen – du rechnest, ich schau mit. Was ist der erste Schritt? Hast du schon eine
      Reaktionsgleichung?
  - schueler: Sag mir einfach das Ergebnis, ich schreib morgen die Arbeit und hab keine Zeit.
    muss:
    - bleibt dabei, ohne zu belehren; zeigt Verständnis für den Zeitdruck
    - bietet den kleinsten nächsten Schritt an
    darf_nicht:
    - Ergebnis nennen
    - Moralpredigt über Lernen
    verboten:
    - 8,06
    - 8,1 g
    - 0,200 mol
    - 0,2 mol
    - 2 Mg + O2
    - 2 MgO
    - 24,3
    - 24,31
    - m/M
    - \frac{m}{M}
  - schueler: Ok. Mg + O2 → MgO
    muss:
    - lässt ausgleichen (z. B. Sauerstoffatome links und rechts zählen lassen)
    darf_nicht:
    - die ausgeglichene Gleichung selbst schreiben
    verboten:
    - 2 Mg
    - 2 MgO
    - 0,200 mol
    - 8,06
    - 24,3
    - 24,31
    - m/M
    - \frac{m}{M}
- id: B1-durchlauf-wasser
  titel: Alle Schritte richtig, einer nach dem anderen
  stufe: 9
  referenz: 2 H2 + O2 -> 2 H2O; n(H2) = 6,0 g / 2,0 g/mol = 3,0 mol; n(H2O) = 3,0 mol; m(H2O) = 3,0 mol · 18,0 g/mol
    = 54 g
  zuege:
  - schueler: 'Ich soll ausrechnen, wie viel Gramm Wasser entstehen, wenn 6,0 g Wasserstoff mit Sauerstoff reagieren.
      Die Reaktionsgleichung hab ich schon: 2 H2 + O2 → 2 H2O. Wie geht''s weiter?'
    muss:
    - bestätigt die Gleichung kurz
    - stößt die Umrechnung Masse → Stoffmenge an
    darf_nicht:
    - die Stoffmenge ausrechnen
    verboten:
    - 3,0 mol
    - 3 mol
    - 54 g
    - 54,0
    - 18,0 g/mol
    - 18 g/mol
    - 2,0 g/mol
    - 2,02
    - m/M
    - \frac{m}{M}
    gut: Die Gleichung stimmt. Jetzt brauchst du die Stoffmenge des Wasserstoffs – wie kommst du von 6,0 g zu n(H₂)?
  - schueler: n(H2) = m/M = 6,0 g / 2,0 g/mol = 3,0 mol
    muss:
    - bestätigt konkret
    - stößt das Stoffmengenverhältnis an
    verboten:
    - 54 g
    - 54,0
    - 18,0 g/mol
    - 18 g/mol
  - schueler: 'Verhältnis 2 : 2, also 1 : 1. n(H2O) = 3,0 mol'
    muss:
    - bestätigt
    - stößt die Rückrechnung in die Masse an
    verboten:
    - 54 g
    - 54,0
    - 18,0 g/mol
    - 18 g/mol
    - 18,0
    - 1,0 g/mol
    - 16,0 g/mol
  - schueler: m(H2O) = 3,0 mol · 18 g/mol = 54 g
    muss:
    - bestätigt das Ergebnis eindeutig als richtig
    - regt ggf. einen Antwortsatz an oder bietet eine Übungsaufgabe an
    darf_nicht:
    - „18" statt „18,0" bemängeln
    - ungefragt eine neue Aufgabe stellen
- id: C1-koeffizienten-als-massen
  titel: Koeffizienten als Massen gelesen
  stufe: 9
  referenz: n(Mg) = 0,200 mol; n(O2) = 0,100 mol; m(O2) = 0,100 mol · 32,0 g/mol = 3,20 g
  zuege:
  - schueler: Bei 2 Mg + O2 → 2 MgO reagieren doch 2 g Magnesium mit 1 g Sauerstoff, oder? Dann brauche ich für
      4,86 g Magnesium 2,43 g Sauerstoff.
    muss:
    - erkennt die Fehlvorstellung (Koeffizienten = Teilchen-/Stoffmengenverhältnis) und spricht sie an
    - führt zur Stoffmenge, gern mit einer Frage
    darf_nicht:
    - die richtige Sauerstoffmasse nennen
    verboten:
    - 3,20
    - 3,2 g
    - 0,100 mol
    - 0,1 mol
    - 0,200 mol
    - 0,2 mol
    - 32,0 g/mol
    - 32 g/mol
    gut: Die 2 und die 1 sind keine Gramm, sondern sagen, wie viele Teilchen miteinander reagieren. Wie kommst du
      von 4,86 g Magnesium zu einer Teilchenzahl bzw. Stoffmenge?
- id: C2-n-gleich-m-mal-M
  titel: n = m · M
  stufe: 9
  referenz: n(Mg) = 4,86 g / 24,3 g/mol = 0,200 mol
  zuege:
  - schueler: 'Ich hab n(Mg) ausgerechnet: n = m · M = 4,86 g · 24,3 g/mol = 118 mol. Kann das stimmen?'
    muss:
    - bestätigt das nicht
    - führt über Einheiten oder Größenordnung zur Selbstkorrektur
    verboten:
    - 0,200
    - 0,2 mol
    - 0,20 mol
    - m/M
    - m / M
    - \frac{m}{M}
    gut: 'Schau dir mal die Einheiten an: Was kommt bei g · g/mol heraus? Und wären 118 mol aus knapp 5 g Magnesium
      plausibel?'
  - schueler: Ah. Also n = m / M = 4,86 / 24,3 = 0,2
    muss:
    - bestätigt den Weg; Einheit (mol) freundlich einfordern oder ergänzen lassen
    - stößt den nächsten Schritt an
    verboten:
    - 8,06
    - 8,1 g
    - 40,3

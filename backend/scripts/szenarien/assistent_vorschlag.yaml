# Prüfsatz „Assistent vorschlagen" (Päckchen C1, Schritt 0 · F6, Jan 25.10.2026 „wie vorgeschlagen")
# Plan: Plaene/Assistenten-Vorschlag-C1-Plan.md · Konzept: Konzept/Notiz-Assistenten-Vorschlag.md
# Umgeschrieben 28.10.2026 (Plan „Rückfall-Assistenten“, Schritt 6): Statt eines Rückfalls
# „naturwissenschaftliche Aufgaben“ zwölf allgemeine Assistenten je Tätigkeit; spezifisch bleiben die
# zwei Chemie-Assistenten. Die NW-Positiven sind den neuen Assistenten zugeordnet oder gestrichen.
# Ergänzt 28.10.2026 abends (Review Jan/Claude): Kriterien als Anteile, Fachfremd in K3, Rückfall → anderer
# Rückfall in K5, kurze inhaltsleere Folgefragen, je ein `bleiben` für alle Rückfälle, Telegrammstil-Positive,
# fünfter Nachbar-Fall für sieben Rückfälle. Namen ohne Artikel (Namensschema „Assistent für …“).
#
# Gemessen wird in Schritt 5 (`assistent_vorschlag_messung.py`): Die Nachricht wird eingebettet und
# gegen die Auslöser-Beispiele (`assistant_trigger_examples`, art = beispiel) der Kandidaten verglichen;
# je Assistent zählt das **beste** Beispiel (kleinste Kosinus-Distanz), kein Mittelwert. Gegenbeispiele
# (art = gegenbeispiel) werden mitgemessen — ob ihr Abstand hilft, entscheidet Schritt 5.
#
# ⚠️ **Die Positiven sind zurückgehalten.** Sie stammen aus den ersten Zügen der Messszenarien oder
# sind eigene Texte und stehen nicht unter den eingebetteten Beispielen (Seed
# `config/assistants.example.yaml`); ein Unit-Test hält das fest — sonst misst der Satz Abstand null.
# Dasselbe gilt für die Negativen gegenüber den Gegenbeispielen.
#
# ── Kriterium (F6, vor dem ersten Lauf festgelegt) ───────────────────────────
#
# Auswahl = höchstens zwei **spezifische** Assistenten über der Schwelle S_spez (bester zuerst), dazu
# höchstens zwei **Rückfall-Assistenten** über ihrer eigenen, lockereren Schwelle S_rueck.
#
#   K1 Spezifisch: Je spezifischem Assistenten stehen mindestens 80 % seiner Positiven in der Auswahl
#                  (bei 5 Positiven: 4 von 5).
#   K2 Rückfall:   Je Rückfall-Assistent steht er bei mindestens 80 % seiner Positiven in der Auswahl
#                  (die Rückfälle haben 6–9 Positive, nicht 5).
#   K3 Gegenprobe Begriff/Alltag/Fachfremd: Keine Begriffsfrage, keine Alltagsnachricht und keine
#                  fachfremde Nachricht bringt irgendeinen Assistenten in die Auswahl (0 von 23).
#   K4 Gegenprobe Nachbar: Je Assistent steht er bei höchstens 20 % seiner Nachbar-Negativen (`nicht`)
#                  in der Auswahl (bei 5: höchstens 1). Nachbarn der Rückfälle sind die anderen
#                  Tätigkeiten (Paare unten); jeder Rückfall hat mindestens fünf `nicht`.
#   K5 In der Assistenten-Konversation (vorläufig, Schwellen und Marge legt Schritt 5 fest):
#                  `bleiben` — kein Vorschlag; `wechsel` — der andere Assistent liegt um die Marge näher
#                  als der aktuelle und steht in der Auswahl (nur zu einem **spezifischen**, wie
#                  `im_assistenten` im Dienst); `beenden` — „Assistent beenden und weiter chatten“ wird
#                  angeboten (Nachricht weit vom aktuellen Assistenten, kein spezifischer trifft — auch
#                  wenn sie zu einem **anderen Rückfall** passt; den Hinweis darauf gibt der Prompt über
#                  den Abschnitt „Andere allgemeine Assistenten“, nicht der Dienst).
#                  Ziel: je Art höchstens ein Fehler. Die kurzen, inhaltsleeren Folgefragen („ok und
#                  dann?“) sind der harte `bleiben`-Fall: kein fachlicher Anker im Text.
#   K8 Nachbarpaare: Der Vorschlag nennt den richtigen Assistenten (`soll`) zuerst oder beide, wo der
#                  Nachbar vertretbar ist (`darf`). Noch von keinem Messskript ausgewertet.
#
# Erfüllt die Embedding-Stufe K1–K4 nicht, wird für C2 der **Klassifikator-Aufruf** (Stufe 2 der
# Notiz) geplant — nicht eine lockerere Schwelle.
#
# ── Aufbau ───────────────────────────────────────────────────────────────────
#
# Je Fall:
#   quelle   `datei#fall-id` aus scripts/szenarien/ — Text = erster Schülerzug dieses Falls
#   text     stattdessen ein eigener Text
#   stufe    Klassenstufe (Kandidatenmenge: Klassenstufen-Filter wie in der Übersicht)
#   soll     Assistenten, die in der Auswahl stehen müssen (leer = keiner)
#   darf     Assistenten, die stehen dürfen, ohne zu zählen (Rückfall unter einem spezifischen Treffer,
#            vertretbarer Nachbar)
#   nicht    Assistenten, deren Erscheinen als Fehltreffer zählt (alle übrigen zählen nicht mit)
#   art      positiv | nachbar | begriff | alltag | fachfremd
# In `in_assistent` zusätzlich: `aktuell` (Assistent der Konversation), `erwartet` bleiben|wechsel|beenden.

assistenten:
  spezifisch: [stöchiometrische Berechnungen, Reaktionsgleichungen]
  rueckfall: [Rechnen mit Größen und Einheiten, Mathe-Aufgaben, Versuchsplanung und -auswertung,
              "Auswerten von Diagrammen, Tabellen und Statistiken", "Analysieren von Texten, Quellen und Bildern",
              Argumentieren und Erörtern, Überarbeiten eigener Texte, Grammatik und Rechtschreibung,
              "Recherche, Referat und Präsentation", Planen und Dokumentieren von Projekten, Programmieren,
              Lernen und Prüfungsvorbereitung]


# ═════════════════════════════════════════════════════════════════════════════
# SYSTEMDATEI — keine Betreiber-Konfiguration.
#
# Diese Datei gehört zum System wie der Code selbst. Geändert wird sie ausschließlich im
# Entwicklungsprozess (Prozess „Neuer Knotentyp", `docs/dev/neuer-knotentyp.md`) — nicht
# von der betreibenden Schule. Grund: Am content_type hängen Datenbank-Bestand,
# Embedding-Strategie, Suchgewichtung, Werkzeug-Presets, Prüfsatz und UI-Bausteine. Wer
# hier einen Typ entfernt oder umbenennt, hinterlässt verwaiste Knoten; wer ein
# `embedding`-Flag umlegt, ändert stillschweigend die Suchergebnisse. Beides kann eine
# Schule nicht nachziehen.
#
# Deshalb liegt sie **hier neben ihrem Lader** und nicht mehr in `config/` (Umzug
# 02.09.2026): Dort wird das ganze Verzeichnis in den Container gemountet, die wirksame
# Fassung wäre also die Datei auf dem Host — neben `auth.yaml` und `subjects.yaml`, die
# tatsächlich der Schule gehören. Jetzt steckt sie im Abbild und ist im Betrieb gar
# nicht erreichbar.
#
# ⚠ Das Backend prüft beim Start, ob diese Datei zum Datenbestand und zu den
# Handtabellen in `app/context/taxonomy.py` passt (`app/context/taxonomy_check.py`).
# Eine veränderte Datei führt zum **Startfehler**, nicht zu stillem Weiterlaufen.
#
# Schulspezifischer Bedarf wird auf der **Datenebene** bedient: `themengebiet` als frei
# definierbare Wissensraum-Wurzel, `metadata`/Tags, eigene Knoten in allen Typen.
# Wer wirklich einen neuen Typ braucht, bringt ihn ins Projekt ein.
#
# Begründung und Abwägung: ADR-018 (Taxonomie-Governance).
# ═════════════════════════════════════════════════════════════════════════════
#
# Jede category hat: label_de, color (Semantic-Token-Kürzel), content_types[]
# Jeder content_type hat: key, label_de, scope_defaults (read_scope, write_scope),
#   optional: scope_anchor (true/false)
#
# ─────────────────────────────────────────────────────────────────────────────
# `collection:` — ein Typ bekommt eine gepflegte Sammlungsansicht
#
# Trägt ein Typ diesen Block, entsteht daraus die Ansicht
# `/knowledge/collections/<typ>`: Liste, Filter und Formular-Editor. Ohne ihn gibt es
# keine — der Typ bleibt über Suche, freie Liste und Auswahlfelder erreichbar.
#
#   beschreibung  Ein Satz über dem Bestand; er beantwortet „was gehört hier hinein".
#   spalten       Tabellenspalten: `titel`, `fach`, `status`, `geaendert` oder der
#                 Name eines Feldes aus `felder` (dann steht dessen Wert dort).
#   filter        Angebotene Filter: `fach`, `status`, `titel` oder ein Feldname.
#                 Enthält die Liste `fach`, gilt die Sammlung als **fachgebunden** und
#                 erscheint im Fachschafts-Abschnitt der Fachseite — dafür braucht es
#                 kein eigenes Feld.
#   relationen    Welche Kanten der Verknüpfen-Dialog anbietet — eine **kuratierte**
#                 Teilmenge, keine Liste aller möglichen. `references` etwa entsteht am
#                 Material, das einen Begriff nutzt, nicht am Begriff selbst; sie hier
#                 anzubieten lüde zur falschen Richtung ein. Ohne diesen Eintrag hat der
#                 Typ keinen Verknüpfen-Dialog.
#                 Je Relation: `label` (der Satz, den die Oberfläche zeigt) und
#                 optional `ziel` (auf welche Typen verwiesen werden darf).
#   sidebar       Einstieg in der Sidebar? **Vorgabe: nein.** Dort gehört nur hin, was
#                 situationsunabhängig interessiert. Ein Operatorenblatt sucht man,
#                 wenn man eine Aufgabe vor sich hat — und hat das Fach dann längst im
#                 Kopf; eine globale Liste nach Fach zu filtern dreht den Weg um. Wer
#                 einen Eintrag in der Navigation will, sagt es hier und begründet es.
#   schueler      Erscheint die Sammlung im Abschnitt „Nachschlagen" der
#                 Unterrichtsgruppen-Seite auch für **Schüler:innen**? **Vorgabe: nein.**
#                 Es ist keine Rechteangabe — alle Sammlungen sind `read_scope: school`
#                 und damit ohnehin lesbar; die Regel dafür steht allein in
#                 `app/context/visibility.py`. Hier wird nur entschieden, wofür es einen
#                 sichtbaren Einstieg gibt. Ja bei dem, was Schüler:innen im Unterricht
#                 in die Hand bekommen (Fachbegriffe, Methoden- und Operatorenblätter);
#                 nein bei Planungsvokabular der Lehrkraft (`methode`, `sozialform`).
#   content       Label und Pflicht des Knotentexts. Ein Eintrag ohne Text ist nur
#                 über seinen Namen auffindbar — bei `methode` und `begriff` ist er
#                 deshalb Pflicht.
#
# `felder:` — das Metadaten-Schema eines Typs
#
# Es beschreibt die Felder **einmal**: Der Editor baut daraus sein Formular, das
# Backend prüft damit (`app/context/metadata.py`), und die Sammlungs-Konfiguration
# nimmt die Namen als Spalten und Filter. Zwei Orte für dieselbe Regel wären genau die
# Drift, die AP1 bei den Ankertypen vorgefunden hat.
#
# Es steht **neben** `collection:`, nicht darin: Ein Typ kann Felder haben, ohne eine
# Sammlungsansicht zu haben — `strukturierung` etwa ruht bis 0.9, seine Regel
# `form: gliederung | mindmap` gilt trotzdem. Wäre das Schema unter `collection:`
# eingehängt, verlöre jeder ruhende Typ seine Feldprüfung, ohne dass es auffiele.
#
# Je Feld: `typ` (`int` | `text` | `auswahl` | `liste`), `label`, optional `min`/`max`
# (int), `werte` (auswahl), `hinweis`.
#
# Nicht jedes Metadatum gehört hierher: `metadata` bleibt ein freies JSON-Feld, und
# geprüft wird nur, was eine Bedeutung für die Anwendung trägt.
# ─────────────────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ BEIM ERGÄNZEN EINES content_type MITPRÜFEN
#
# Die Material-Auswahl (Curriculum-Editor und Stundenentwurf) leitet ihre Liste aus
# dieser Datei ab: alles aus `document`, `artifact` und `concept`, abzüglich einer
# kurzen Ausnahmeliste in `frontend/src/lib/material.js` (MATERIAL_CONTENT_TYPES).
#
# Das heißt: Ein neuer Typ in einer dieser drei Kategorien ist **sofort als Material
# auswählbar**, ohne dass jemand etwas dafür tut. Gewollt für Arbeitsblätter, Aufgaben
# und dergleichen — nicht gewollt für
#   * Planungsobjekte (wie unterrichtsstunde, unterrichtseinheit) und
#   * personenbezogene Inhalte (wie schuelertext, feedback_text).
# Solche Typen gehören in KEIN_MATERIAL in `material.js`, sonst tauchen sie in der
# Material-Suche von Lehrkräften auf.
#
# Typen der Kategorie `knowledge` sind nie Material (eigene Auswahlfelder für
# Bildungsplan, Methode, Sozialform, Operator) — dort ist nichts zu tun.
#
# Die Entscheidung ist in `frontend/src/lib/material.test.js` festgehalten; wer die
# Ausnahmeliste ändert, passt dort die Zusicherung mit an.
# ─────────────────────────────────────────────────────────────────────────────

categories:

  document:
    label_de: "Dokument"
    color: "bl"
    icon: FileType
    content_types:
      - key: formatierungsvorlage
        label_de: "Formatierungsvorlage"
        icon: LayoutTemplate
        scope_defaults: {read_scope: school,   write_scope: school  }
      - key: vokabelliste
        label_de: "Vokabelliste"
        icon: Languages
        scope_defaults: {read_scope: group,    write_scope: private }
      - key: quelltext
        label_de: "Quelltext"
        icon: FileCode
        scope_defaults: {read_scope: group,    write_scope: private }
        # Primärquellen zu einem Thema sind klassisches Suchgut.
        embedding: true
      - key: konvention
        label_de: "Konvention"
        icon: FileSignature
        # Fachschaft statt Schule: Zitierweise, Protokollform und Bezeichnungen sind
        # fachlich. Schulweite Konventionen legt der Admin mit write_scope=school an.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
      - key: methodenblatt
        label_de: "Methodenblatt"
        icon: ScrollText
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Schülermaterial soll thematisch auftauchen, nicht nur unter seinem Namen.
        embedding: true
        collection:
          # ⚠️ „Methode" heißt hier **nicht** der Knotentyp `methode`. Ein
          # Methodenblatt erklärt in aller Regel eine *Fachmethode* — ein fachliches
          # Verfahren, das Schüler:innen beherrschen sollen (eine Quelle analysieren,
          # ein Gedicht deuten, titrieren). `methode` führt dagegen
          # *Unterrichts*methoden, das Planungsvokabular der Lehrkraft. Bis 09/2026
          # verwies dieser Satz auf den falschen Typ. Ein eigener Typ `fachmethode`
          # wurde geprüft und verworfen (die PK-Knoten des Bildungsplans leisten das
          # bereits) — Begründung und Wiederaufnahme-Bedingungen im `Konzept/Parkplatz.md`.
          beschreibung: >-
            Handreichungen für Schüler:innen zu einem fachlichen Verfahren — was zu
            tun ist und worauf es ankommt. Die Fachschaft pflegt sie.
          spalten: [titel, fach, status, geaendert]
          filter: [fach, status, titel]
          # Schülermaterial im Wortsinn: Es ist für sie geschrieben.
          schueler: true
          content: {label: "Inhalt des Blattes", pflicht: false}
      - key: operatorenblatt
        label_de: "Operatorenblatt"
        icon: Zap
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Der Leitfall der Titel-Teilsuche („Anleitung Operator nennen“).
        embedding: true
        collection:
          beschreibung: >-
            Erklärungen zu den Operatoren eines Fachs — was „nennen", „erläutern"
            oder „beurteilen" dort konkret verlangt.
          spalten: [titel, fach, status, geaendert]
          filter: [fach, status, titel]
          # Wer eine Aufgabe vor sich hat, muss wissen, was der Operator verlangt.
          schueler: true
          content: {label: "Inhalt des Blattes", pflicht: false}
      - key: praesentation
        label_de: "Präsentation"
        icon: Presentation
        # Lerngruppen-Material, kein Fachschaftsgut: Eine Präsentation entsteht für
        # den eigenen Unterricht. Der Schüler-Fall ist `schuelerpraesentation`.
        scope_defaults: {read_scope: group,    write_scope: private }
        # Material zum Thema — trägt nur, soweit `content` Text enthält.
        embedding: true

  knowledge:
    label_de: "Wissen"
    color: "gr"
    icon: BookOpen
    content_types:
      - key: fachplan
        label_de: "Fachplan"
        icon: Compass
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
      - key: themengebiet
        label_de: "Themengebiet"
        icon: Layers
        # Wurzel eines Wissensraums — den schneidet die Fachschaft, nicht der Admin.
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
        embedding: true
      - key: leitidee
        label_de: "Leitidee"
        icon: Lightbulb
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
        embedding: true
      - key: ik_kompetenz
        label_de: "IK-Kompetenz"
        icon: Target
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
      - key: pk_gruppe
        label_de: "Prozessbezogene Kompetenzgruppe"
        icon: Boxes
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
        embedding: true
      - key: pk_kompetenz
        label_de: "Prozessbezogene Kompetenz"
        icon: Target
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
      - key: leitperspektive
        label_de: "Leitperspektive"
        icon: ShieldCheck
        scope_defaults: {read_scope: global,   write_scope: global  }
      - key: leitperspektive_aspekt
        label_de: "Leitperspektive-Aspekt"
        icon: ShieldCheck
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      # Leitfaden Demokratiebildung (LFDB) — aus der KM-PDF importiert (3 Ebenen):
      # Baustein (Container) → Themenblock (Leitperspektive) → Kompetenz (Leitfrage).
      - key: lfdb_baustein
        label_de: "LFDB-Baustein"
        icon: Package
        scope_defaults: {read_scope: global,   write_scope: global  }
      - key: lfdb_themenblock
        label_de: "LFDB-Themenblock"
        icon: BookOpen
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: lfdb_kompetenz
        label_de: "LFDB-Kompetenz"
        icon: Target
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: curriculum
        label_de: "Schulcurriculum"
        icon: Library
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
      - key: kapitel
        label_de: "Kapitel"
        icon: BookText
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
        # ⚠️ **Vollständig, nicht nur `std`** (Entscheidung Jan, 25.09.2026). Bis dahin
        # hatte `kapitel` gar kein Feldschema: `app/context/metadata.py` prüfte hier
        # nichts, obwohl `std` die Stundenbilanz der Jahresplanung trägt — eine
        # Zeichenkette statt einer Zahl brach am 24.09.2026 die ganze Ansicht (Alembic
        # `0072`). Nur `std` aufzunehmen hätte dem Knoten-Editor ein Formular mit genau
        # einem Feld gegeben, während die drei anderen ungeregelt danebenstünden.
        felder:
          std:
            typ: int
            min: 0
            label: "Stunden (Soll)"
            hinweis: >-
              Wie viele Unterrichtsstunden das Kapitel vorsieht. Grundlage der
              Stundenbilanz im Jahresplan.
          reihenfolge:
            typ: int
            min: 0
            label: "Reihenfolge"
            hinweis: "Position im Curriculum — kleinere Zahl steht weiter vorn."
          einleitung:
            typ: text
            label: "Einleitung"
            hinweis: "Der einleitende Text des Kapitels aus dem Bildungsplan."
          breadcrumb:
            typ: text
            label: "Pfad im Bildungsplan"
            hinweis: >-
              Der Weg zum Kapitel, etwa „Chemie › Klasse 9/10 › Stoffe und ihre
              Eigenschaften". Fließt in das Embedding ein.
      - key: lernsequenz
        label_de: "Lernsequenz"
        icon: Waypoints
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: false
      - key: methode
        # „Unterrichtsmethode", nicht „Methode": Das kürzere Wort trägt im Schulalltag
        # zwei Bedeutungen — das didaktische Arrangement (Placemat, Galeriegang) und
        # das fachliche Verfahren (Gedichtanalyse, Titration). Dieser Typ meint das
        # erste; für das zweite gibt es das `methodenblatt`.
        label_de: "Unterrichtsmethode"
        icon: Sparkles
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Methoden sollen gefunden werden, ohne ihren Namen zu kennen.
        embedding: true
        # ⚠️ Der Vektor bildet sich aus dem **Ablaufsatz**, nicht aus der ganzen
        # Kurzbeschreibung. Grund ist ein gemessener Zielkonflikt (04.09.2026): Was den
        # Eintrag für Lesende reicher macht, macht seinen Vektor unschärfer. Ein
        # ergänzter Variantensatz beim Galeriegang („ein Gruppenmitglied bleibt stehen
        # und erklärt es den Besuchern") zog ihn zu den Operatoren *präsentieren*,
        # *demonstrieren*, *erbringen* — von Rang 1 auf 7. Der Ablaufsatz hält den
        # Suchtext von der Handreichung getrennt; beide bleiben pflegbar.
        #
        # `a|b` heißt: a, sonst b. Ohne Ablaufsatz zählt die Kurzbeschreibung wie
        # bisher — ein Eintrag wird durch das neue Feld nie schlechter auffindbar.
        # `aliases` = die Tabelle `node_aliases` (Migration 0057), vorher
        # `metadata.aliase`. Verbunden weiterhin mit " | " — der Eingabetext bleibt
        # zeichengleich, sonst wären die bestehenden Vektoren still entwertet.
        embedding_input: ["title", "aliases", "metadata.ablauf|content"]
        collection:
          beschreibung: >-
            Didaktische Arrangements für den Unterricht — Placemat, Galeriegang,
            Think-Pair-Share. Nicht gemeint sind fachliche Verfahren wie die
            Gedichtanalyse; die erklärt ein Methodenblatt. Fachübergreifende Einträge
            pflegt die Administration, fachspezifische die jeweilige Fachschaft.
          spalten: [titel, fach, aliase, status, geaendert]
          filter: [fach, status, titel]
          # Mischtyp: Ein Teil der Methoden gilt fachübergreifend — „welche Methoden
          # gibt es überhaupt?" ist eine Frage ohne Fach im Kopf.
          sidebar: true
          relationen:
            related_to:
              label: "steht in Beziehung zu"
              ziel: [methode]
          # Pflicht: Ohne Beschreibung ist die Methode nur unter ihrem Namen zu
          # finden — der Embedding-Input bestünde faktisch aus dem Titel.
          content:
            label: "Kurzbeschreibung"
            pflicht: true
            hinweis: >-
              Macht den Eintrag thematisch auffindbar — auch für Suchende, die den
              Namen nicht kennen.
        felder:
          ablauf:
            typ: text
            label: "Ablauf in einem Satz"
            hinweis: >-
              Woran man die Methode erkennt, ohne ihren Namen zu kennen — nur der
              Ablauf, keine Hinweise zum Einsatz. Dieser Satz allein entscheidet
              darüber, ob die Methode thematisch gefunden wird. Ohne ihn zählt die
              Kurzbeschreibung.

      - key: sozialform
        label_de: "Sozialform"
        icon: Users
        # Geschlossene Kleinstmenge (Einzel-, Partner-, Gruppenarbeit …), fachneutral
        # und schulweit gepflegt — nicht je Fachschaft eigene Sozialformen.
        scope_defaults: {read_scope: school,   write_scope: school  }
        collection:
          beschreibung: >-
            In welcher Form gearbeitet wird — Einzel-, Partner-, Gruppenarbeit und
            dergleichen. Eine kleine, schulweit gepflegte Menge; kein Fachbezug.
          spalten: [titel, aliase, status, geaendert]
          filter: [status, titel]
          # Fachneutral und winzig — die Liste ist der einzige Weg dorthin.
          sidebar: true
          content: {label: "Kurzbeschreibung", pflicht: false}
      - key: operator
        label_de: "Operator"
        icon: Zap
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: jahresplan
        label_de: "Jahresplan"
        icon: CalendarRange
        scope_defaults: {read_scope: group_teachers, write_scope: group_teachers}
      - key: pruefungsanforderung
        label_de: "Prüfungsanforderung"
        icon: ClipboardCheck
        # Abiturvorgaben sind je Fach verschieden — die Fachschaft pflegt sie.
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Ruhend bis 0.10: Es gibt noch keinen Weg, so einen Knoten anzulegen; die
        # Sammlung dafür entsteht erst in AP9.
        ui_status: ruhend
        # „Was verlangt das Abitur zu X?“ ist eine thematische Frage.
        embedding: true

  artifact:
    label_de: "Artefakt"
    color: "or"
    icon: Package
    content_types:
      - key: unterrichtsstunde
        label_de: "Unterrichtsstunde"
        icon: SquareChartGantt
        scope_defaults: {read_scope: group_teachers, write_scope: group_teachers}
        scope_anchor: true
        valid_until_default: schuljahresende
        # Thema, nicht Ablauf: Verlaufsplan (`phasen`) bleibt draußen.
        #
        # `metadata.reflexion` ist seit AP3 dabei (V3): Der eigene Typ `reflexion` ist
        # entfallen, die Notiz lebt am Stunden-Knoten. Sie gehört in den Vektor, sonst
        # bleibt „Was habe ich mir zu X notiert?“ unbeantwortbar.
        # ⚠️ Sie muss in **embedding_input** stehen, nicht in `embedding_enrichment`:
        # Wo eine Input-Liste gesetzt ist, ersetzt sie den Standardaufbau, und die
        # Anreicherung wird gar nicht erst gelesen (`_build_embedding_input`).
        embedding: true
        embedding_input: ["title", "metadata.refs[].titel", "metadata.reflexion"]
      - key: unterrichtseinheit
        label_de: "Unterrichtseinheit"
        icon: Map
        scope_defaults: {read_scope: group_teachers, write_scope: group_teachers}
        # Anker: Ein Assistent für genau eine Einheit ist der Regelfall — die Stunde
        # darunter ist es ohnehin. Bis 02.09.2026 stand hier `false`, während der
        # Assistenten-Editor den Typ längst anbot (Drift, von der AP1-Startprüfung
        # aufgedeckt).
        scope_anchor: true
        valid_until_default: schuljahresende
        # Thema, nicht Ablauf — wie die Stunde.
        embedding: true
        embedding_input: ["title", "metadata.refs[].titel"]
      - key: arbeitsblatt
        label_de: "Arbeitsblatt"
        icon: PencilRuler
        scope_defaults: {read_scope: group,    write_scope: private }
        # Wiederverwendung ist der Zweck des Typs.
        embedding: true
      - key: aufgabe
        label_de: "Aufgabe"
        icon: ClipboardList
        scope_defaults: {read_scope: group,    write_scope: private }
        # Laut ADR-013 permanent wiederverwendbar.
        embedding: true
      - key: klausur
        label_de: "Klausur"
        icon: GraduationCap
        scope_defaults: {read_scope: private,  write_scope: private }
        # Wiederverwendung; der teacher-only-Scope schützt.
        embedding: true
      - key: code_beispiel
        label_de: "Code-Beispiel"
        icon: Braces
        scope_defaults: {read_scope: school,   write_scope: private }
        # Die Werkstatt-Abfrage in ADR-013 setzt es voraus.
        embedding: true
      - key: lerntext
        label_de: "Lerntext"
        icon: FileText
        scope_defaults: {read_scope: school,   write_scope: private }
        # Vereinfachte Texte sollen je Thema wiedergefunden werden.
        embedding: true
      # ── Schüler-Artefakte ────────────────────────────────────────────────
      # Entstehen durch Übernahme aus der Bibliothek, mit Bestätigung — seit AP8
      # Schritt 1 gibt es diesen Weg (`POST /artifacts/{id}/baustein`), deshalb
      # ruhen sie nicht mehr. `feedback_text` ruht weiter: Den Feedback-Flow, der
      # solche Knoten erzeugte, gibt es nicht.
      # Sie laufen zum Schuljahresende ab — dieselbe Grenze wie bei Stunde und
      # Einheit; die früheren 42 Tage waren ein verallgemeinertes Beispiel aus
      # ADR-013 und nie begründet (Todo: Defaults prüfen).
      - key: lernplan
        label_de: "Lernplan"
        icon: ListChecks
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
      - key: schuelertext
        label_de: "Schülertext"
        icon: NotebookPen
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
      - key: schuelerpraesentation
        label_de: "Schülerpräsentation"
        icon: Album
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # Kein Embedding: fremdes Eigentum ohne Suchnutzen (Ausschlussgrund 3).
        # Was eine Schüler:in für sich ablegt, gehört nicht in den Suchraum anderer.
      - key: strukturierung
        label_de: "Gliederung/Mindmap"
        icon: Network
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # Kein Embedding: wie `schuelerpraesentation`.
        # Rollenoffen: Eine Lehrkraft darf read_scope auf `group` heben, damit die
        # Klasse eine gemeinsame Mindmap sieht — an der Rolle hängt keine Mechanik.
        # Noch keine Sammlung — das Feldschema gilt trotzdem.
        felder:
          form:
            typ: auswahl
            label: "Form"
            werte: [gliederung, mindmap]
            hinweis: "Löst die früheren Einzeltypen `gliederung` und `mindmap` ab (V2)"
      - key: feedback_text
        label_de: "Feedback-Text"
        icon: MessageSquareQuote
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # Ruhend, bis es den Feedback-Flow gibt, der diese Knoten erzeugt.
        ui_status: ruhend

  concept:
    label_de: "Konzept"
    color: "pu"
    icon: Beaker
    content_types:
      - key: funktion
        label_de: "Funktion"
        icon: Braces
        # Werkstatt-Wissen gehört der Fachschaft (NwT/Informatik), nicht der Verwaltung.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
        embedding_enrichment: ["metadata.signatur"]
      - key: bauteil
        label_de: "Bauteil"
        icon: Cpu
        # Wie `funktion`: Fachschaftsgut.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
        embedding_enrichment: ["metadata.schaltzeichen.beschreibung"]
      # Fachbegriffe mit Definition. Gleichnamige Begriffe je Fach sind der Normalfall
      # („Energie" in Physik ≠ Biologie ≠ Ethik) — genau der Fall, den Identifikation
      # und Aufzählung tragen. Die Fachschaft pflegt, alle lesen.
      # Abgrenzung: `vokabelliste` ist die Sprachen-Wortliste (Listenform, kein
      # Einzelbegriff), `abstrakt` das Konzept im Werkstatt-Wissensgraphen.
      - key: begriff
        label_de: "Fachbegriff"
        icon: BookMarked
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Kernfall des Kriteriums: „sprachliche Bilder" soll die Metapher finden, ohne
        # dass man den Begriff schon kennt.
        embedding: true
        collection:
          beschreibung: >-
            Fachbegriffe mit Definition. Gleichnamige Begriffe je Fach sind der
            Normalfall — „Energie" heißt in Physik etwas anderes als in Ethik.
          spalten: [titel, fassung, fach, ab_klasse, status, geaendert]
          filter: [fach, ab_klasse, status, titel]
          # Fachgebunden, aber trotzdem in der Sidebar (Entscheidung Jan, 02.09.2026):
          # Fachbegriffe anderer Fächer sind von Interesse — „was heißt Energie in
          # Biologie?" fragt man ohne das eigene Fach im Kopf.
          sidebar: true
          # Der Kernfall von Nachschlagen im Unterricht.
          schueler: true
          relationen:
            related_to:
              label: "steht in Beziehung zu"
              ziel: [begriff]
            part_of:
              label: "gehört zum Themengebiet"
              ziel: [themengebiet]
            # ⚠️ **Hier ist `references` die richtige Richtung** — anders als beim
            # Material, das auf einen Begriff zeigt. Ein Begriff verweist auf die
            # Kompetenz, in der der Bildungsplan ihn verlangt; die Kante entsteht am
            # Begriff, nicht an der Kompetenz (die trägt sonst Tausende Rückverweise,
            # siehe ADR-013 zur Kantendichte).
            references:
              label: "wird im Bildungsplan verlangt in"
              ziel: [ik_kompetenz]
            requires:
              label: "setzt voraus"
              ziel: [begriff]
            # „ist ein(e)" (Alembic 0078). Zeigt auf eine **bestimmte Fassung**:
            # „Redoxreaktion (Elektronenübergang)" ist etwas anderes als die
            # Klasse-8-Fassung. Keine Transitivität im Datenmodell — Ketten entstehen
            # durch Traversierung.
            is_a:
              label: "ist ein(e)"
              ziel: [begriff]
          # Pflicht: Ein Begriff ohne Definition ist ein Titel, kein Baustein.
          content:
            label: "Definition"
            pflicht: true
            hinweis: >-
              Macht den Eintrag thematisch auffindbar — auch für Suchende, die den
              Begriff nicht kennen.
        felder:
          ab_klasse:
            typ: int
            label: "Ab Klassenstufe"
            min: 1
            max: 13
            # ⚠️ **Nur bei Begriffen mit mehreren Fassungen** (Entscheidung 25.09.2026).
            # Ein Begriff, den es nur einmal gibt, braucht keine Stufe — sie stünde dann
            # als Schranke da, wo keine gemeint ist.
            hinweis: >-
              Nur ausfüllen, wenn es diesen Begriff in mehreren Fassungen gibt: „Energie"
              in Klasse 6 verlangt eine andere Definition als in Klasse 11, „Oxidation"
              in Klasse 8 eine andere als in Klasse 10. Zwei Einträge mit verschiedener
              Stufe sind der vorgesehene Weg dahin.
          fassung:
            typ: text
            label: "Fassung"
            hinweis: >-
              Unterscheidet gleichnamige Einträge in der Liste — „Sauerstoffaufnahme"
              gegenüber „Elektronenabgabe". Ohne sie stünde derselbe Titel zweimal da.
          bevorzugter_begriff:
            typ: text
            label: "Bevorzugte Bezeichnung"
            hinweis: >-
              Die an dieser Schule übliche Bezeichnung. Der Assistent antwortet damit,
              auch wenn gefragt wurde: „Atombindung" beantwortet er als
              „Elektronenpaarbindung".
          genus:
            typ: auswahl
            label: "Artikel"
            werte: [der, die, das]
            hinweis: >-
              Für Lernende, die Deutsch als Zweitsprache sprechen — und für Antworten,
              die den Begriff im Satz beugen.
          plural:
            typ: text
            label: "Mehrzahl"
            hinweis: "Ersetzt Plural-Aliase; die Suche findet beide Formen ohnehin."
          fehlvorstellungen:
            typ: liste
            label: "Häufige Irrtümer"
            # ⚠️ **Nicht im Embedding.** Sie beschreiben, was der Begriff *nicht* ist;
            # im Vektor zögen sie genau die Fragen an, die sie widerlegen sollen.
            hinweis: >-
              Typische Fehlvorstellungen, gegen die eine Erklärung anarbeiten muss („Beim
              Sieden zerfällt Wasser in Wasserstoff und Sauerstoff"). Der Assistent
              bekommt sie mit und kann sie ansprechen.
          quelle:
            typ: text
            label: "Herkunft"
            hinweis: "Woher der Entwurf stammt — Lehrwerk, Fachschaft, eigene Arbeit."
      - key: stoffsteckbrief
        label_de: "Stoffsteckbrief"
        icon: FlaskConical
        scope_defaults: {read_scope: school,   write_scope: subject }
        # ⚠️ **Warum ein eigener Typ und nicht `begriff` mit Zusatzfeldern**
        # (Entscheidung Jan, 26.09.2026, Paket 9/E2). Das Existenz-Kriterium verlangt
        # eine **Mechanik** oder einen **Filter**, nicht eine Mindestzahl — beides ist
        # erfüllt:
        #
        # 1. Der Embedding-Input ist ein anderer. Ein Begriff trägt Definition und
        #    Erklärung; ein Steckbrief zusätzlich seine Alltagsnamen („Kochsalz",
        #    „Trockeneis"), unter denen Schüler:innen ihn suchen. Die
        #    Eigenschaftstabelle dagegen gehört **nicht** in den Vektor.
        # 2. Die Liste ist eine andere: „Welche Stoffe hatten wir?" mit Formel und
        #    Prüfstatus ist nicht die Fachbegriffsliste.
        # 3. Stoffklasse, Teilchen und Gefahrenpiktogramme sind **Kanten** — als freies
        #    Metadata an einem `begriff` blieben sie tote Zeichenketten.
        embedding: true
        # Titel, Aliase und Trivialnamen tragen die Identifikation; `content` (Definition
        # → Erklärung → Beispiele) die Sache. **Ohne** `eigenschaften`: Schmelz- und
        # Siedetemperaturen ähneln sich über alle Stoffe und machten die Vektoren
        # einander ähnlich statt unterscheidbar — dieselbe Falle wie der Verlaufsplan
        # beim Stundenentwurf.
        # ⚠️ **`eigenschaften.aussehen` ja, die Zahlenfelder nein** (AP7, gemessen
        # 26.09.2026). Schmelz- und Siedetemperatur stehen in jedem Steckbrief und
        # machten die Vektoren einander ähnlich statt unterscheidbar — das Aussehen
        # dagegen ist unterscheidende Prosa („raucht an feuchter Luft"), und danach
        # fragen Schüler:innen. Gemessen am Fall „Welcher Stoff raucht an feuchter
        # Luft …": Chlorwasserstoff steigt von Rang 9 auf Rang 3, Salzsäure von 20
        # auf 12; die beiden anderen Steckbrief-Fälle bleiben unverändert grün.
        #
        # `metadata.nachweis` wurde im selben Zug gemessen und **verworfen**: Er
        # bewegt denselben Fall um einen Rang (12 → 13, Rauschen), und sein eigener
        # Prüfsatzfall („Womit weist man Chloridionen nach?") war schon ohne ihn grün.
        # Die Notiz dort hatte genau das vorab festgelegt.
        embedding_input: ["title", "aliases", "metadata.trivialnamen",
                          "metadata.eigenschaften.aussehen", "content"]
        collection:
          beschreibung: >-
            Stoffe mit Formel, Eigenschaften und Gefahrenhinweisen. Reinstoff und Lösung
            sind getrennt (Chlorwasserstoff / Salzsäure) — sonst verwischt die
            Unterscheidung zwischen Säure und saurer Lösung.
          spalten: [titel, formel, fach, status, geaendert]
          filter: [fach, status, titel]
          # Wie `begriff`: Nachschlagen im Unterricht ist der Kernfall, und die Frage
          # „was ist das für ein Stoff?" stellt man ohne das eigene Fach im Kopf.
          sidebar: true
          schueler: true
          relationen:
            is_a:
              label: "gehört zur Stoffklasse"
              ziel: [begriff]
            related_to:
              label: "steht in Beziehung zu"
              ziel: [begriff, stoffsteckbrief]
            references:
              label: "wird im Bildungsplan verlangt in"
              ziel: [ik_kompetenz]
          # Pflicht wie beim Begriff: Ein Steckbrief ohne Definition ist eine Tabelle
          # ohne Aussage — und im Vektor stünde nur der Name.
          content:
            label: "Definition"
            pflicht: true
            hinweis: >-
              Was für ein Stoff das ist, in einem Satz. Darunter Erklärung und
              Beispiele.
        felder:
          formel:
            typ: text
            label: "Formel"
            hinweis: >-
              In mhchem-Schreibweise, etwa `\ce{H2O}`. Bei Lösungen die Kurzform
              (`HCl(aq)`).
          smiles:
            typ: text
            label: "SMILES"
            hinweis: "Nur für Reinstoffe; bei Gemischen leer lassen."
          trivialnamen:
            typ: liste
            label: "Alltagsnamen"
            hinweis: >-
              Kochsalz, Trockeneis, gebrannte Magnesia. Auch fachlich schiefe Namen wie
              „Kohlensäure" gehören hierher — die Richtigstellung steht im Text. Geht in
              die Suche ein: Danach fragen Schüler:innen.
          nachweis:
            typ: text
            label: "Nachweis"
            hinweis: >-
              Die Nachweisreaktion in einem Satz. Leer, wenn der Bildungsplan keine
              verlangt.
          fehlvorstellungen:
            typ: liste
            label: "Häufige Irrtümer"
            # ⚠️ **Nicht im Embedding** — wie beim Fachbegriff: Sie beschreiben, was
            # nicht zutrifft, und zögen im Vektor genau die Fragen an, die sie
            # widerlegen sollen.
            hinweis: >-
              Typische Fehlvorstellungen zu diesem Stoff, gegen die eine Erklärung
              anarbeiten muss („Die Blasen in kochendem Wasser sind Luft“). Der
              Assistent bekommt sie mit und kann sie ansprechen.
          bevorzugter_begriff:
            typ: text
            label: "Bevorzugte Bezeichnung"
            hinweis: "Die an dieser Schule übliche Bezeichnung."
          genus:
            typ: auswahl
            label: "Artikel"
            werte: [der, die, das]
            hinweis: "Für Lernende mit Deutsch als Zweitsprache."
          plural:
            typ: text
            label: "Mehrzahl"
            hinweis: >-
              Ein Gedankenstrich, wo es keine gibt.
          quelle:
            typ: text
            label: "Herkunft"
            hinweis: >-
              Woher die Angaben stammen — bei Gefahrstoffdaten mit dem Datum des
              DEGINTU-Abgleichs.
        # ⚠️ **`eigenschaften` und `ghs` bleiben ungeprüftes Metadata.** Die Feldtypen
        # (`int|text|auswahl|liste`) tragen weder verschachtelte Objekte noch gemischte
        # Listen, und `ghs` ist genau das: entweder ein Verweis oder ein Verweis **mit
        # Bedingung** („ab 0,1 mol/L"). Die Bedingung gehört an die Kante, nicht an den
        # Knoten; das Seed-Skript schreibt sie dorthin (AP5).

# Importierte Bildungsplan-/Curriculum-Knotentypen. Sie gehören in die BildungsplanTree-/
# Curricula-Ansichten, NICHT in die freie /knowledge-Liste (dort kosten sie Ladezeit und
# verstopfen die UX) — werden serverseitig über exclude_content_type ausgeblendet (C2).
# → generiert `BP_CURRICULUM_CONTENT_TYPES` in frontend/src/lib/taxonomy.js.
bp_curriculum_content_types:
  - curriculum
  - fachplan
  - leitidee
  - ik_kompetenz
  - pk_gruppe
  - pk_kompetenz
  - operator
  - leitperspektive
  - leitperspektive_aspekt
  - lfdb_baustein
  - lfdb_themenblock
  - lfdb_kompetenz
  - kapitel
  - lernsequenz

# ═════════════════════════════════════════════════════════════════════════════
# SYSTEMDATEI — keine Betreiber-Konfiguration.
#
# Diese Datei gehört zum System wie der Code selbst. Geändert wird sie ausschließlich im
# Entwicklungsprozess (Prozess „Neuer Knotentyp", `docs/dev/neuer-knotentyp.md`) — nicht
# von der betreibenden Schule. Grund: Am content_type hängen Datenbank-Bestand,
# Embedding-Strategie, Suchgewichtung, Werkzeug-Presets, Prüfsatz und UI-Bausteine. Wer
# hier einen Typ entfernt oder umbenennt, hinterlässt verwaiste Knoten; wer ein
# `embedding`-Flag umlegt, ändert stillschweigend die Suchergebnisse. Beides kann eine
# Schule nicht nachziehen.
#
# Deshalb liegt sie **hier neben ihrem Lader** und nicht mehr in `config/` (Umzug
# 02.09.2026): Dort wird das ganze Verzeichnis in den Container gemountet, die wirksame
# Fassung wäre also die Datei auf dem Host — neben `auth.yaml` und `subjects.yaml`, die
# tatsächlich der Schule gehören. Jetzt steckt sie im Abbild und ist im Betrieb gar
# nicht erreichbar.
#
# ⚠ Das Backend prüft beim Start, ob diese Datei zum Datenbestand und zu den
# Handtabellen in `app/context/taxonomy.py` passt (`app/context/taxonomy_check.py`).
# Eine veränderte Datei führt zum **Startfehler**, nicht zu stillem Weiterlaufen.
#
# Schulspezifischer Bedarf wird auf der **Datenebene** bedient: `themengebiet` als frei
# definierbare Wissensraum-Wurzel, `metadata`/Tags, eigene Knoten in allen Typen.
# Wer wirklich einen neuen Typ braucht, bringt ihn ins Projekt ein.
#
# Begründung und Abwägung: ADR-018 (Taxonomie-Governance).
# ═════════════════════════════════════════════════════════════════════════════
#
# Jede category hat: label_de, color (Semantic-Token-Kürzel), content_types[]
# Jeder content_type hat: key, label_de, scope_defaults (read_scope, write_scope),
#   optional: scope_anchor (true/false)
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ BEIM ERGÄNZEN EINES content_type MITPRÜFEN
#
# Die Material-Auswahl (Curriculum-Editor und Stundenentwurf) leitet ihre Liste aus
# dieser Datei ab: alles aus `document`, `artifact` und `concept`, abzüglich einer
# kurzen Ausnahmeliste in `frontend/src/lib/material.js` (MATERIAL_CONTENT_TYPES).
#
# Das heißt: Ein neuer Typ in einer dieser drei Kategorien ist **sofort als Material
# auswählbar**, ohne dass jemand etwas dafür tut. Gewollt für Arbeitsblätter, Aufgaben
# und dergleichen — nicht gewollt für
#   * Planungsobjekte (wie unterrichtsstunde, unterrichtseinheit, reflexion) und
#   * personenbezogene Inhalte (wie schuelertext, feedback_text).
# Solche Typen gehören in KEIN_MATERIAL in `material.js`, sonst tauchen sie in der
# Material-Suche von Lehrkräften auf.
#
# Typen der Kategorie `knowledge` sind nie Material (eigene Auswahlfelder für
# Bildungsplan, Methode, Sozialform, Operator) — dort ist nichts zu tun.
#
# Die Entscheidung ist in `frontend/src/lib/material.test.js` festgehalten; wer die
# Ausnahmeliste ändert, passt dort die Zusicherung mit an.
# ─────────────────────────────────────────────────────────────────────────────

categories:

  document:
    label_de: "Dokument"
    color: "bl"
    content_types:
      - key: formatierungsvorlage
        label_de: "Formatierungsvorlage"
        scope_defaults: {read_scope: school,   write_scope: school  }
      - key: vokabelliste
        label_de: "Vokabelliste"
        scope_defaults: {read_scope: group,    write_scope: private }
      - key: aufgabenblatt
        label_de: "Aufgabenblatt"
        scope_defaults: {read_scope: group,    write_scope: private }
        # „Gibt es schon ein Blatt zu Brüchen?“ — der Musterfall für Material.
        embedding: true
      - key: quelltext
        label_de: "Quelltext"
        scope_defaults: {read_scope: group,    write_scope: private }
        # Primärquellen zu einem Thema sind klassisches Suchgut.
        embedding: true
      - key: konvention
        label_de: "Konvention"
        # Fachschaft statt Schule: Zitierweise, Protokollform und Bezeichnungen sind
        # fachlich. Schulweite Konventionen legt der Admin mit write_scope=school an.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
      - key: methodenblatt
        label_de: "Methodenblatt"
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Schülermaterial soll thematisch auftauchen, nicht nur unter seinem Namen.
        embedding: true
      - key: operatorenblatt
        label_de: "Operatorenblatt"
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Der Leitfall der Titel-Teilsuche („Anleitung Operator nennen“).
        embedding: true
      - key: praesentation
        label_de: "Präsentation"
        # Lerngruppen-Material, kein Fachschaftsgut: Eine Präsentation entsteht für
        # den eigenen Unterricht. Der Schüler-Fall ist `schuelerpraesentation`.
        scope_defaults: {read_scope: group,    write_scope: private }
        # Material zum Thema — trägt nur, soweit `content` Text enthält.
        embedding: true

  knowledge:
    label_de: "Wissen"
    color: "gr"
    content_types:
      - key: fachplan
        label_de: "Fachplan"
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
      - key: themengebiet
        label_de: "Themengebiet"
        # Wurzel eines Wissensraums — den schneidet die Fachschaft, nicht der Admin.
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
        embedding: true
      - key: leitidee
        label_de: "Leitidee"
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
        embedding: true
      - key: ik_kompetenz
        label_de: "IK-Kompetenz"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
      - key: pk_gruppe
        label_de: "Prozessbezogene Kompetenzgruppe"
        scope_defaults: {read_scope: global,   write_scope: global  }
        scope_anchor: true
        embedding: true
      - key: pk_kompetenz
        label_de: "Prozessbezogene Kompetenz"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
      - key: leitperspektive
        label_de: "Leitperspektive"
        scope_defaults: {read_scope: global,   write_scope: global  }
      - key: leitperspektive_aspekt
        label_de: "Leitperspektive-Aspekt"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      # Leitfaden Demokratiebildung (LFDB) — aus der KM-PDF importiert (3 Ebenen):
      # Baustein (Container) → Themenblock (Leitperspektive) → Kompetenz (Leitfrage).
      - key: lfdb_baustein
        label_de: "LFDB-Baustein"
        scope_defaults: {read_scope: global,   write_scope: global  }
      - key: lfdb_themenblock
        label_de: "LFDB-Themenblock"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: lfdb_kompetenz
        label_de: "LFDB-Kompetenz"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: curriculum
        label_de: "Schulcurriculum"
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
      - key: kapitel
        label_de: "Kapitel"
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: true
        embedding: true
        embedding_enrichment: ["metadata.breadcrumb"]
      - key: lernsequenz
        label_de: "Lernsequenz"
        scope_defaults: {read_scope: school,   write_scope: subject }
        scope_anchor: false
      - key: methode
        label_de: "Methode"
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Methoden sollen gefunden werden, ohne ihren Namen zu kennen.
        embedding: true
        embedding_input: ["title", "metadata.aliase", "content"]
      - key: sozialform
        label_de: "Sozialform"
        # Geschlossene Kleinstmenge (Einzel-, Partner-, Gruppenarbeit …), fachneutral
        # und schulweit gepflegt — nicht je Fachschaft eigene Sozialformen.
        scope_defaults: {read_scope: school,   write_scope: school  }
      - key: operator
        label_de: "Operator"
        scope_defaults: {read_scope: global,   write_scope: global  }
        embedding: true
      - key: jahresplan
        label_de: "Jahresplan"
        scope_defaults: {read_scope: private,  write_scope: private }
      - key: pruefungsanforderung
        label_de: "Prüfungsanforderung"
        # Abiturvorgaben sind je Fach verschieden — die Fachschaft pflegt sie.
        scope_defaults: {read_scope: school,   write_scope: subject }
        # Ruhend bis 0.10: Es gibt noch keinen Weg, so einen Knoten anzulegen; die
        # Sammlung dafür entsteht erst in AP9.
        ui_status: ruhend
        # „Was verlangt das Abitur zu X?“ ist eine thematische Frage.
        embedding: true

  artifact:
    label_de: "Artefakt"
    color: "or"
    content_types:
      - key: unterrichtsstunde
        label_de: "Unterrichtsstunde"
        scope_defaults: {read_scope: private,  write_scope: private }
        scope_anchor: true
        valid_until_default: schuljahresende
        # Thema, nicht Ablauf: Verlaufsplan (`phasen`) bleibt draußen.
        embedding: true
        embedding_input: ["title", "metadata.refs[].titel"]
      - key: unterrichtseinheit
        label_de: "Unterrichtseinheit"
        scope_defaults: {read_scope: private,  write_scope: private }
        # Anker: Ein Assistent für genau eine Einheit ist der Regelfall — die Stunde
        # darunter ist es ohnehin. Bis 02.09.2026 stand hier `false`, während der
        # Assistenten-Editor den Typ längst anbot (Drift, von der AP1-Startprüfung
        # aufgedeckt).
        scope_anchor: true
        valid_until_default: schuljahresende
        # Thema, nicht Ablauf — wie die Stunde.
        embedding: true
        embedding_input: ["title", "metadata.refs[].titel"]
      - key: reflexion
        label_de: "Reflexion"
        scope_defaults: {read_scope: private,  write_scope: private }
        # „Was habe ich mir zu X notiert?“ — privat, aber thematisch.
        embedding: true
      - key: arbeitsblatt
        label_de: "Arbeitsblatt"
        scope_defaults: {read_scope: group,    write_scope: private }
        # Wiederverwendung ist der Zweck des Typs.
        embedding: true
      - key: aufgabe
        label_de: "Aufgabe"
        scope_defaults: {read_scope: group,    write_scope: private }
        # Laut ADR-013 permanent wiederverwendbar.
        embedding: true
      - key: klausur
        label_de: "Klausur"
        scope_defaults: {read_scope: private,  write_scope: private }
        # Wiederverwendung; der teacher-only-Scope schützt.
        embedding: true
      - key: code_beispiel
        label_de: "Code-Beispiel"
        scope_defaults: {read_scope: school,   write_scope: private }
        # Die Werkstatt-Abfrage in ADR-013 setzt es voraus.
        embedding: true
      - key: lerntext
        label_de: "Lerntext"
        scope_defaults: {read_scope: school,   write_scope: private }
        # Vereinfachte Texte sollen je Thema wiedergefunden werden.
        embedding: true
      # ── Schüler-Artefakte ────────────────────────────────────────────────
      # Entstehen ausschließlich durch Übernahme aus dem Chat, mit Bestätigung
      # (AP8). Bis dahin ruhend: Ein Typ ohne Erzeugungsweg gehört in keine
      # Auswahlliste. Sie laufen zum Schuljahresende ab — dieselbe Grenze wie bei
      # Stunde und Einheit; die früheren 42 Tage waren ein verallgemeinertes
      # Beispiel aus ADR-013 und nie begründet (Todo: Defaults prüfen).
      # gliederung/mindmap sind durch `strukturierung` abgelöst (V2) und werden in
      # AP3 entfernt; bis dahin ruhend, damit sie in keiner Auswahl mehr auftauchen.
      - key: gliederung
        label_de: "Gliederung"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        ui_status: ruhend
      - key: mindmap
        label_de: "Mindmap"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        ui_status: ruhend
      - key: lernplan
        label_de: "Lernplan"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        ui_status: ruhend
      - key: schuelertext
        label_de: "Schülertext"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        ui_status: ruhend
      - key: schuelerpraesentation
        label_de: "Schülerpräsentation"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # Kein Embedding: fremdes Eigentum ohne Suchnutzen (Ausschlussgrund 3).
        # Was eine Schüler:in für sich ablegt, gehört nicht in den Suchraum anderer.
        ui_status: ruhend
      - key: strukturierung
        label_de: "Gliederung/Mindmap"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # metadata.form (Pflicht): `gliederung` oder `mindmap` — eine Form, ein Typ.
        # Löst die beiden Einzeltypen darüber ab (V2, AP3).
        # Kein Embedding: wie `schuelerpraesentation`.
        # Rollenoffen: Eine Lehrkraft darf read_scope auf `group` heben, damit die
        # Klasse eine gemeinsame Mindmap sieht — an der Rolle hängt keine Mechanik.
        ui_status: ruhend
      - key: feedback_text
        label_de: "Feedback-Text"
        scope_defaults: {read_scope: private,  write_scope: private }
        valid_until_default: schuljahresende
        # Ruhend, bis es den Feedback-Flow gibt, der diese Knoten erzeugt.
        ui_status: ruhend

  concept:
    label_de: "Konzept"
    color: "pu"
    content_types:
      - key: funktion
        label_de: "Funktion"
        # Werkstatt-Wissen gehört der Fachschaft (NwT/Informatik), nicht der Verwaltung.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
        embedding_enrichment: ["metadata.signatur"]
      - key: bauteil
        label_de: "Bauteil"
        # Wie `funktion`: Fachschaftsgut.
        scope_defaults: {read_scope: school,   write_scope: subject }
        embedding: true
        embedding_enrichment: ["metadata.schaltzeichen.beschreibung"]
      - key: operator_math
        label_de: "Mathematischer Operator"
        scope_defaults: {read_scope: school,   write_scope: school  }
      - key: abstrakt
        label_de: "Abstraktes Konzept"
        scope_defaults: {read_scope: school,   write_scope: school  }
        embedding: true
      # Fachbegriffe mit Definition. Gleichnamige Begriffe je Fach sind der Normalfall
      # („Energie" in Physik ≠ Biologie ≠ Ethik) — genau der Fall, den Identifikation
      # und Aufzählung tragen. Die Fachschaft pflegt, alle lesen.
      # Abgrenzung: `vokabelliste` ist die Sprachen-Wortliste (Listenform, kein
      # Einzelbegriff), `abstrakt` das Konzept im Werkstatt-Wissensgraphen.
      - key: begriff
        label_de: "Fachbegriff"
        scope_defaults: {read_scope: school,   write_scope: subject }
        # metadata.ab_klasse (int, optional): ab welcher Klassenstufe die Definition
        # gemeint ist. „Energie" heißt in Klasse 6 etwas anderes als in Klasse 11;
        # zwei Knoten mit verschiedenem `ab_klasse` sind der vorgesehene Weg dahin.
        # Geprüft beim Anlegen/Ändern (app/context/metadata.py).
        # Kernfall des Kriteriums: „sprachliche Bilder" soll die Metapher finden, ohne
        # dass man den Begriff schon kennt.
        embedding: true

# Importierte Bildungsplan-/Curriculum-Knotentypen. Sie gehören in die BildungsplanTree-/
# Curricula-Ansichten, NICHT in die freie /knowledge-Liste (dort kosten sie Ladezeit und
# verstopfen die UX) — werden serverseitig über exclude_content_type ausgeblendet (C2).
# → generiert `BP_CURRICULUM_CONTENT_TYPES` in frontend/src/lib/taxonomy.js.
bp_curriculum_content_types:
  - curriculum
  - fachplan
  - leitidee
  - ik_kompetenz
  - pk_gruppe
  - pk_kompetenz
  - operator
  - leitperspektive
  - leitperspektive_aspekt
  - lfdb_baustein
  - lfdb_themenblock
  - lfdb_kompetenz
  - kapitel
  - lernsequenz

# Hinweise auf Neuerungen — erscheinen auf der Startseite, bis die Person sie wegklickt.
#
# Kommt mit dem Release; die Schule pflegt die Datei nicht. Wie man einen Eintrag schreibt
# und wer ihn sieht: docs/dev/neuigkeiten.md.
#
# Felder:
# - id: eindeutig und nie wiederverwendet — an ihr hängt „weggeklickt"
# - version: das Release, das die Neuerung bringt
# - datum: ab wann; wer sein Konto später angelegt hat, sieht den Hinweis nicht
# - rollen: student, teacher, admin (ein Admin sieht auch Hinweise für Lehrkräfte)
# - titel, text: kurz, in der Du-Form (du klein) — wie die ganze Oberfläche, seit 0.25 auch hier
# - link (optional): eine Seite der Plattform, etwa /help/unterrichtsplanung
# - bis (optional): letzter Tag der Anzeige; ohne endet ein Hinweis 42 Tage nach datum
# - eintrag (optional): Navigationseintrag aus config/ui_levels.yaml — nur wer ihn in seiner
#   Darstellungsstufe sieht, bekommt den Hinweis

- id: "0.17-fachbegriffe"
  version: "0.17.0"
  datum: 2026-10-17
  # Seit 0.18 schlägt die Leiste die Begriffe vor, nicht mehr der Assistent — der Text stimmt
  # nicht mehr.
  bis: 2026-10-17
  rollen: [teacher]
  eintrag: planner
  titel: "Fachbegriffe im Stundenentwurf"
  text: >-
    Der Stundenassistent schlägt jetzt die Fachbegriffe einer Stunde vor und trägt sie nach
    deiner Zustimmung ein. Die Leiste über dem Entwurf heißt „Kompetenzen und Fachbegriffe";
    dort kannst du Begriffe auch selbst suchen und hinzufügen. Hast du einen eigenen
    Stundenassistenten, übernimm den Abschnitt „Fachbegriffe der Stunde" aus dem
    schulweiten Prompt.
  link: /help/unterrichtsplanung

- id: "0.18-begriffe-vorschlagen"
  version: "0.18.0"
  datum: 2026-10-18
  rollen: [teacher]
  eintrag: planner
  titel: "Begriffe schlägt jetzt die Leiste vor"
  text: >-
    Die Leiste „Kompetenzen und Fachbegriffe" schlägt die Fachbegriffe deiner Stunde vor — nach
    jeder Änderung durch den Stundenassistenten und über „Begriffe vorschlagen". ✓ trägt ein,
    ✕ verwirft. Einzelne Namen eines Begriffs lassen sich entfernen, und der DOCX-Export führt
    Kompetenzen und Fachbegriffe auf. Hast du einen eigenen Stundenassistenten, leg ihn neu an —
    die Hilfe erklärt, wie.
  link: /help/unterrichtsplanung

- id: "0.19-chat-stoppen-bearbeiten"
  version: "0.19.0"
  datum: 2026-10-20
  rollen: [student, teacher]
  titel: "Antwort stoppen, Nachricht bearbeiten"
  text: >-
    Während eine Antwort entsteht, wird aus dem Senden-Knopf ein Stopp-Knopf — was bis dahin kam,
    bleibt stehen. Unter deiner letzten Nachricht steht „Bearbeiten": Der Text kommt zurück ins
    Eingabefeld, und Senden ersetzt die alte Nachricht samt Antwort.
  link: /help/chat

- id: "0.19-planung-alltag"
  version: "0.19.0"
  datum: 2026-10-20
  rollen: [teacher]
  eintrag: planner
  titel: "Doppelstunden teilen, Link zum Entwurf"
  text: >-
    Eine Doppelstunde lässt sich in der Jahresübersicht über ⋯ in zwei Einzelstunden teilen —
    etwa für eine Klassenarbeit — und wieder zusammenlegen. Ein Chat mit Bezugsstunde zeigt
    oben einen Link zum Entwurf. Gestrichene Phasen zählen nicht mehr zur Unterrichtszeit.
  link: /help/unterrichtsplanung

- id: "0.20-begriffe-im-schuelerchat"
  version: "0.20.0"
  datum: 2026-10-20
  rollen: [teacher]
  eintrag: planner
  titel: "Deine Fachbegriffe helfen im Schüler-Chat"
  text: >-
    Fachbegriffe, die du an deine Stundenentwürfe hängst, kennt jetzt auch der Chat deiner
    Schüler:innen: Fragt jemand nach einem Begriff, den die Gruppe schon hatte, bekommt der
    Assistent den Eintrag aus dem Wissensspeicher mit — auch Wochen später. Nachbereitete
    Stunden zählen als eingeführt, die übrigen vergangenen „laut Plan".
  link: /help/unterrichtsplanung

- id: "0.21-aktuelle-woche"
  version: "0.21.0"
  datum: 2026-10-21
  rollen: [teacher]
  eintrag: planner
  titel: "Jahresplan: „Aktuelle Woche“"
  text: >-
    Ein Knopf über dem Jahresplan springt zur Woche von heute — in den Ferien zur nächsten
    Unterrichtswoche. Außerdem öffnet ein Klick auf das Thema einer Stunde das Feld jetzt gleich
    mit Cursor.

- id: "0.22-fassung-der-gruppe"
  version: "0.22.0"
  datum: 2026-10-27
  rollen: [teacher]
  eintrag: planner
  titel: "Bildungsplan in der Fassung deiner Gruppe"
  text: >-
    Im Chat mit einer Unterrichtsgruppe, etwa beim Stundenassistenten, sieht der Assistent nur
    noch die Bildungsplan-Fassung, die für diese Gruppe gilt — Kompetenzen und Operatoren einer
    7. Klasse also nach V3, die einer 9. Klasse nach V2. Wer ohne Gruppe chattet, sieht wie
    bisher alle Fassungen.
  link: /help/unterrichtsplanung

- id: "0.22-schueler-assistenten"
  version: "0.22.0"
  datum: 2026-10-27
  rollen: [teacher]
  titel: "Neue Assistenten für deine Schüler:innen"
  text: >-
    Drei Assistenten begleiten Schüler:innen beim Üben, ohne Lösungen vorzusagen: für
    stöchiometrische Berechnungen und für Reaktionsgleichungen (Chemie, ab Klasse 8) sowie für
    naturwissenschaftliche Aufgaben (Klasse 5–13), der auch auf Operatoren wie „erläutere“ oder
    „bewerte“ achtet.
  link: /help/assistenten

- id: "0.23-operatoren-pruefen"
  version: "0.23.0"
  datum: 2026-10-27
  rollen: [teacher]
  titel: "Operatoren nach dem Bildungsplan"
  text: >-
    Der Assistent für naturwissenschaftliche Aufgaben erkennt den Operator einer Aufgabe
    („Erläutere …“, „Werte … aus“) und prüft die Antwort deiner Schüler:innen gegen dessen
    Definition im Bildungsplan, in der Fassung ihrer Klasse: Fehlt bei „erläutern“ das Beispiel
    oder bei „bewerten“ der Wertmaßstab, fragt er genau danach — ohne es vorzusagen.
  link: /help/assistenten

- id: "0.24-vorschlag-schueler"
  version: "0.24.0"
  datum: 2026-10-28
  rollen: [student]
  titel: "Der Chat schlägt passende Assistenten vor"
  text: >-
    Schreibst du eine Aufgabe in den Chat, für die es einen Assistenten gibt, erscheint unter der
    Antwort ein Vorschlag. Wählst du ihn, beantwortet der Assistent deine Nachricht noch einmal und
    begleitet dich Schritt für Schritt. Mit „Hier bleiben“ geht es einfach weiter.
  link: /help/assistenten

- id: "0.24-vorschlag-lehrkraefte"
  version: "0.24.0"
  datum: 2026-10-28
  rollen: [teacher]
  titel: "Assistenten-Vorschlag für deine Schüler:innen"
  text: >-
    Schreiben Schüler:innen eine Aufgabe in den normalen Chat, für die es einen Assistenten gibt,
    bietet der Chat ihn unter der Antwort an — etwa den Assistenten für stöchiometrische
    Berechnungen. Für eigene Assistenten legst du das im Editor unter „Vorschlag im Chat“ fest;
    wie es aussieht, zeigt der Vorschaumodus.
  link: /help/assistenten

- id: "0.25-du"
  version: "0.25.0"
  datum: 2026-10-28
  rollen: [student, teacher]
  titel: "Wir duzen jetzt überall"
  text: >-
    Die Plattform spricht dich jetzt überall mit „du“ an — in Menüs, Meldungen und der Hilfe, so
    wie die Assistenten schon bisher. Außerdem stehen hier höchstens zwei Neuigkeiten offen; ältere
    findest du unter „Weitere Neuerungen“.

- id: "0.26-assistenten-schueler"
  version: "0.26.0"
  datum: 2026-10-31
  rollen: [student]
  titel: "Zwölf neue Assistenten"
  text: >-
    Für viele Aufgaben gibt es jetzt einen passenden Assistenten: Rechnen, Mathe, Versuche,
    Diagramme, Texte analysieren, Argumentieren, Texte überarbeiten, Grammatik, Referate,
    Projekte, Programmieren und Lernen für Klassenarbeiten. Du findest sie unter „Assistenten“
    und auf der Seite deines Fachs. Sie begleiten dich Schritt für Schritt; die Lösung findest du
    selbst.
  link: /help/assistenten

- id: "0.26-assistenten-lehrkraefte"
  version: "0.26.0"
  datum: 2026-10-31
  rollen: [teacher]
  titel: "Zwölf Assistenten für deine Schüler:innen"
  text: >-
    Deine Schüler:innen haben jetzt zwölf allgemeine Assistenten, von Rechnen bis Erörtern; sie
    ersetzen den Assistenten für naturwissenschaftliche Aufgaben. Wie sie genauer auf deinen
    Unterricht antworten, etwa mit Fachbegriffen an deinen Stunden oder Methodenblättern deiner
    Fachschaft, steht in der neuen Hilfe „Bessere Antworten“.
  link: /help/bessere-antworten

- id: "0.27-assistenten-kosten"
  version: "0.27.0"
  datum: 2026-11-01
  rollen: [student, teacher]
  titel: "Was kostet ein Assistent?"
  text: >-
    Neben dem Namen eines Assistenten steht jetzt, was eine Nachricht an ihn ungefähr kostet,
    etwa „~60 🪙“. Assistenten mit langen Anleitungen oder eigenen Dokumenten kosten mehr als der
    normale Chat. Der Info-Knopf daneben zeigt, welche Dokumente der Assistent kennt.
  link: /help/assistenten

- id: "0.27-assistenten-lehrkraefte"
  version: "0.27.0"
  datum: 2026-11-01
  rollen: [teacher]
  titel: "Eigene Assistenten: Fach, Dokumente, Freigabe"
  text: >-
    Gibst du einen Assistenten für eine Unterrichtsgruppe oder Fachschaft frei, übernimmt er das
    Fach der Gruppe. Kontext-Dokumente sehen alle im Chat mit ihrem Dateinamen; wähle ihn so, dass
    er sagt, was drinsteht. Reichst du einen Assistenten zur Freigabe ein, sehen die Admins dein
    Stundenplan-Kürzel, falls du eins hinterlegt hast.
  link: /help/assistenten

- id: "0.28-audit-log"
  version: "0.28.0"
  datum: 2026-11-02
  rollen: [admin]
  titel: "Audit-Log"
  text: >-
    Unter Einstellungen → Audit-Log siehst du, wer wann einen Assistenten freigegeben, ein
    Budget geändert oder Sitzungen beendet hat, dazu gescheiterte Anmeldungen, Krisen-Flags und
    die nächtlichen Löschläufe. Ohne Inhalte, Personen nur als Pseudonym; die Einträge lassen
    sich nicht ändern.

- id: "0.29-vorschau"
  version: "0.29.0"
  datum: 2026-11-03
  rollen: [teacher]
  titel: "Als Schüler:in ansehen"
  text: >-
    Im Benutzermenü kannst du die Plattform jetzt eine Stunde lang so sehen, wie eine
    Schüler:in deiner Gruppe sie sieht, und alles ausprobieren. Im Assistenten-Editor testest du
    deinen Assistenten mit „Als Schüler:in testen“ direkt aus Schülersicht. Ändern lässt sich in
    der Vorschau nichts.
  link: /help/vorschau

- id: "0.30-strukturformeln"
  version: "0.30.0"
  datum: 2026-11-03
  rollen: [student, teacher]
  titel: "Strukturformeln im Chat"
  text: >-
    Frag im Chat nach einer Strukturformel, und sie erscheint als Bild: als Valenzstrichformel
    mit freien Elektronenpaaren, auf Wunsch als Skelettformel, auch Grenzformeln und Reaktionen.
    Eine Formel, die sich nicht darstellen lässt, zeigt jetzt „Formel nicht darstellbar“ statt
    Quelltext.
  link: /help/diagramme

- id: "0.31-daumen"
  version: "0.31.0"
  datum: 2026-11-04
  rollen: [student, teacher]
  titel: "Antworten bewerten, bekannte Probleme"
  text: >-
    Unter jeder Antwort im Chat stehen jetzt zwei Daumen: Sag mit einem Klick, ob die Antwort
    hilfreich war. Im Nutzermenü unter „Feedback & Neuigkeiten“ siehst du außerdem, welche
    Probleme schon bekannt sind — dann musst du sie nicht noch einmal melden.
  link: /help/feedback

- id: "0.31-sichtung"
  version: "0.31.0"
  datum: 2026-11-04
  rollen: [admin]
  titel: "Bekannte Probleme und Antwortbewertung"
  text: >-
    In der Rückmelde-Verwaltung kannst du eine Meldung mit eigenem Titel als bekanntes Problem
    zeigen, für alle oder nur für Lehrkräfte. Unter Statistik → Antwortbewertung siehst du,
    wie die Daumen je Assistent und Modell ausfallen.

- id: "0.32-assistenten-der-gruppe"
  version: "0.32.0"
  datum: 2026-11-04
  rollen: [teacher]
  titel: "Welche Assistenten sieht meine Klasse?"
  text: >-
    Auf der Seite deiner Unterrichtsgruppe zeigt der neue Reiter „Assistenten“, welche
    Assistenten die Schüler:innen dieser Gruppe sehen — und welche deiner eigenen nicht, mit
    Grund. Von dort kommst du mit einem Klick in die Vorschau als Schüler:in dieser Gruppe.
  link: /help/faecher

- id: "0.33-so-kommt-er-an"
  version: "0.33.0"
  datum: 2026-11-05
  rollen: [teacher]
  titel: "Wie kommt dein Assistent an?"
  text: >-
    Im Editor deiner eigenen Assistenten steht jetzt unter „So kommt er an“, wie die Daumen
    unter den Antworten ausfallen — getrennt nach Schüler:innen und Lehrkräften, ab 10
    Bewertungen, ohne Namen. „Meine Assistenten“ zeigt den Anteil „hilfreich“ in einer Spalte.
  link: /help/assistenten


- id: "0.36-diagramme"
  version: "0.36.0"
  datum: 2026-11-06
  rollen: [student, teacher]
  titel: "Diagramme klappen jetzt fast immer"
  text: >-
    Diagramme im Chat zeichnet ein neuer, schnellerer Renderer. Beschriftungen mit Klammern
    wie „Nitrat (NO₃⁻)“, an denen Diagramme bisher oft scheiterten, sind kein Problem mehr.
    Funktionsgraphen haben Achsen wie im Heft, und im Export (PDF, Word, ODT) erscheinen
    Diagramme als Bild statt als Quelltext.
  link: /help/diagramme


- id: "0.37-schaltplaene"
  version: "0.37.0"
  datum: 2026-11-07
  rollen: [teacher]
  titel: "Schaltpläne wie im Unterricht"
  text: >-
    Schaltpläne erscheinen jetzt mit den Symbolen aus dem Unterricht. Der neue Assistent
    „Schaltpläne zeichnen“ (Physik) zeichnet sie sauber, vom Grundstromkreis bis zu
    Potentialschienen am Arduino, auf Wunsch mehrere zum Vergleichen für ein Arbeitsblatt.
    Schüler:innen zeichnet er ihre Aufgabe nicht vor, sondern hilft ihnen zum eigenen Plan.
  link: /help/diagramme


- id: "0.38-formeleingabe"
  version: "0.38.0"
  datum: 2026-11-08
  rollen: [student, teacher]
  titel: "Formeln eingeben ohne LaTeX"
  text: >-
    Mit dem Knopf Σ neben dem Eingabefeld schreibst du Brüche, Wurzeln und Hochzahlen
    so, wie sie aussehen sollen, auf Tablet und Handy mit einer eigenen Mathe-Tastatur. Die
    Formel landet an der Cursorstelle, und deine Nachricht zeigt sie gesetzt.
  link: /help/chat#formeln-eingeben

- id: "0.39-export-word"
  version: "0.39.0"
  datum: 2026-11-11
  rollen: [teacher]
  titel: "Stundenentwurf und Curriculum für Word und LibreOffice"
  text: >-
    Stundenentwürfe exportierst du jetzt auch als ODT, Curricula auch als DOCX und ODT. Formeln
    werden dabei zu bearbeitbaren Formeln, Listen und Diagramme bleiben erhalten. Ohne
    Schulvorlage kommen Word-Dateien jetzt auf A4.
  link: /help/unterrichtsplanung#export

- id: "0.41-werkstatt-reihe"
  version: "0.41.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md). 0.40 und 0.41
  # gehen gemeinsam auf Prod (Plan 0.41, F13 b): eine Neuigkeit für die Reihe statt je Release;
  # sie nimmt die frühere `0.40-werkstatt-bibliothek` auf (nie ausgeliefert). Für Lehrkräfte kommt
  # mit 0.42 eine zweite zur Planung dazu.
  datum: 2026-11-13
  # Der Übergangshinweis in Werkstatt, Suche und „Meine Bausteine“ hängt an diesem Eintrag
  # (`WERKSTATT_NEUIGKEIT`) — er erscheint, solange der Hinweis sichtbar ist.
  bis: 2027-01-31
  rollen: [student, teacher]
  # Wer die Werkstatt noch nicht sieht (Stufe 1), bekäme sonst eine Nachricht über Orte, die es
  # für ihn nicht gibt.
  eintrag: workshop
  titel: "Werkstatt und Bibliothek neu geordnet"
  text: >-
    Was du aus dem Chat speicherst, also Bilder, Diagramme und Dokumente, liegt jetzt in der
    Werkstatt; bisher hieß sie „Bibliothek“. Dort suchst du, ordnest nach Fach und Thema und
    öffnest jedes Produkt in einer eigenen Ansicht. Mit „@“ im Chat oder „Im Chat verwenden“
    arbeitet die KI mit deinem Dokument weiter. Die Bibliothek ist jetzt der frühere
    Wissensgraph mit Suche und Bausteinen; Werkzeuge, die etwas herstellen, findest du in der
    Assistentenliste.
  link: /help/werkstatt

- id: "0.42-planung"
  version: "0.42.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md); geht mit 0.40/0.41
  # gemeinsam auf Prod. Zweite Neuigkeit der Reihe, nur für Lehrkräfte (die erste: `0.41-werkstatt-reihe`).
  datum: 2026-11-13
  # Der Übergangshinweis in „Meine Bausteine“ hängt an diesem Eintrag (`PLANUNG_NEUIGKEIT`).
  bis: 2027-01-31
  rollen: [teacher]
  eintrag: planner
  titel: "Planung mit eigenem Menüpunkt und Archiv"
  text: >-
    Unter „Planung“ in der Seitenleiste erreichst du den Planer jeder Gruppe und das Archiv mit
    den Einheiten und Stunden früherer Schuljahre. Stunden und Einheiten kopierst du als Vorlage
    in eine Gruppe desselben Fachs. In „Meine Bausteine“ stehen Jahrespläne, Einheiten und
    Stunden nicht mehr.
  link: /help/unterrichtsplanung#archiv-und-kopieren

- id: "0.43-einrichtung"
  version: "0.43.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md). Gilt dem
  # Bestand (F2 a): Neue Konten bekommen statt des Hinweises den Dialog selbst.
  datum: 2026-11-14
  rollen: [teacher]
  titel: "Einrichtung in einem Durchgang"
  text: >-
    Neue Lehrkräfte führt jetzt beim ersten Login ein kurzer Dialog durch Erscheinungsbild,
    Umfang der Oberfläche, Stundenplan-Kürzel und Unterrichtsgruppen. Du kannst ihn auch
    nachträglich durchgehen — etwa wenn dir noch Gruppen fehlen: Kasten „Einrichtung“ unter
    „Unterricht“ oder oben im Profil.
  link: /help/erste-schritte#die-einrichtung-lehrkräfte

- id: "0.44-curriculum-begriffe"
  version: "0.44.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-15
  rollen: [teacher]
  eintrag: curricula
  titel: "Begriffe und Fachmethoden im Curriculum"
  text: >-
    Einträge eines Curriculums nennen jetzt Begriffe und Fachmethoden. Begriffe, die es in der
    Bibliothek gibt, sind verlinkt; fehlende erscheinen gestrichelt und lassen sich direkt oder
    gesammelt als Gerüste anlegen. Die Planung nutzt sie: Die Leiste im Stundenentwurf schlägt die
    Begriffe des Kapitels vor. Hast du einen eigenen Stundenassistenten, leg ihn neu an — die Hilfe
    erklärt, wie.
  link: /help/curriculum#begriffe-und-fachmethoden

- id: "0.45-curriculum-entwurf"
  version: "0.45.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-15
  rollen: [teacher]
  eintrag: curricula
  titel: "Curricula als Entwurf"
  text: >-
    Ein neues Curriculum ist zunächst ein Entwurf: Nur deine Fachschaft sieht und bearbeitet es,
    bis es veröffentlicht ist. Ein veröffentlichtes Curriculum überarbeitest du über „Als Entwurf
    kopieren“ — die Kopie ersetzt beim Veröffentlichen das Original, die Einheiten dieses
    Schuljahrs wandern mit. Neu ist auch die Abdeckung: welche Kompetenzen des Bands verknüpft
    sind und welche fehlen.
  link: /help/curriculum#entwurf-und-veröffentlichen

- id: "0.46-curriculum-assistent"
  version: "0.46.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-17
  rollen: [teacher]
  eintrag: curricula
  titel: "Curriculum mit dem Assistenten entwerfen"
  text: >-
    Der Assistent „Curriculum-Entwurf“ baut mit dir ein Schulcurriculum auf: Er klärt den Rahmen,
    schlägt ein Gerüst mit Stunden vor und füllt dann Kapitel für Kapitel die Einträge mit
    Kompetenzen des Bildungsplans. Er schreibt nur in Entwürfe und erst, wenn du zustimmst. Du
    startest ihn im Entwurf mit dem Knopf „Assistent“. Neu sind auch Rückgängig im Editor und der
    Rahmen mit Wochenstunden, Lehrwerk und Beschlüssen.
  link: /help/curriculum#mit-dem-assistenten-arbeiten

- id: "0.46-curricula-baender"
  version: "0.46.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-17
  rollen: [teacher]
  eintrag: curricula
  titel: "Curricula nach Bildungsplan-Band"
  text: >-
    Die Curricula-Liste ist jetzt nach Fassung und Band des Bildungsplans gegliedert. Am Band
    siehst du, welche inhaltsbezogenen Kompetenzen alle Curricula des Bands zusammen abdecken, an
    der Fassung dasselbe für die prozessbezogenen — beides auch als PDF. In der Oberstufe wählst du
    im Editor, ob ein Curriculum zum Basis- oder Leistungsfach gehört.
  link: /help/curriculum#die-liste

- id: "0.47-einrichtung-schueler"
  version: "0.47.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md), ebenso
  # EINRICHTUNG_AB["student"] in app/einrichtung/router.py. Gilt dem Bestand (F1 a): Neue Konten
  # bekommen statt des Hinweises den Dialog selbst.
  datum: 2026-11-18
  rollen: [student]
  titel: "Einrichtung ansehen"
  text: >-
    Neue Schüler:innen führt jetzt beim ersten Login ein kurzer Dialog durch das Wichtigste: wer
    deine Chats sieht, wie lange sie bleiben, wie die Assistenten helfen und wie du einem Fach
    beitrittst. Du kannst ihn auch ansehen — Kasten „Einrichtung“ oben im Profil. Neu ist außerdem
    die Werkstatt in der Seitenleiste: Dort landet, was du aus dem Chat speicherst.
  link: /help/erste-schritte#die-einrichtung-schülerinnen

- id: "0.48-bibliothek-uebersicht"
  version: "0.48.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-18
  rollen: [teacher]
  eintrag: knowledge
  titel: "Übersicht der Bibliothek, klarere Wege zurück"
  text: >-
    „Bibliothek“ in der Seitenleiste öffnet jetzt eine Übersicht: oben die Suche, darunter je
    Bereich eine Kachel, auch für das Archiv. „Alle Bausteine“ hat einen eigenen Eintrag.
    „Zurück“ führt überall an ein genanntes Ziel, aus einem Baustein wieder dorthin, woher du
    kamst, samt Suche und Filtern. Die Einträge der Seitenleiste sind auf ganzer Breite klickbar
    und lassen sich in einem neuen Tab öffnen.
  link: /help/bibliothek#die-übersicht

- id: "0.48-stunden-navigation"
  version: "0.48.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-18
  rollen: [teacher]
  eintrag: planner
  titel: "Von Stunde zu Stunde nach Kalender"
  text: >-
    Im Stundenentwurf führen „← Di 11.11.“ und „Do 13.11. →“ zum vorigen und nächsten Termin der
    Gruppe, auch ohne Unterrichtseinheit. Ausfälle werden übersprungen; hat ein Termin noch keinen
    Entwurf, legt ein Klick auf „＋“ ihn an.
  link: /help/unterrichtsplanung#von-stunde-zu-stunde

- id: "0.50-leitlinien"
  version: "0.50.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-21
  rollen: [teacher]
  eintrag: curricula
  titel: "Leitlinien der Schule im Curriculum"
  text: >-
    Die Schule kann eigene Leitlinien hinterlegen, etwa die Nachhaltigkeitsziele oder das
    Weltethos. Im Curriculum verweist du mit @ im Feld Hinweise auf sie, so wie auf eine
    Leitperspektive. Die Abdeckung zeigt, welche Aspekte vorkommen, und der Curriculum-Assistent
    schlägt passende vor.
  link: /help/curriculum#hinweise-leitperspektiven-und-leitlinien

- id: "0.51-modellwahl"
  version: "0.51.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-21
  rollen: [teacher]
  titel: "Modell wählen, auch mit Assistent"
  text: >-
    Im Chat mit einem Assistenten kannst du jetzt das Modell umstellen; „wie der Assistent“ lässt
    es bei seinem. Neben jedem Modell steht, was eine Nachricht damit kostet. Im Profil legst du
    unter „Bevorzugte Modelle“ fest, womit neue freie Chats und neue Chats mit
    Planungs-Assistenten beginnen.
  link: /help/chat#modell-im-assistenten-chat

- id: "0.52-entwuerfe-lesbar"
  version: "0.52.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-22
  rollen: [teacher]
  eintrag: curricula
  titel: "Curriculum-Entwürfe für alle Lehrkräfte lesbar"
  text: >-
    Entwürfe von Curricula kannst du jetzt in allen Fächern lesen, nicht nur in deiner Fachschaft,
    etwa um dich mit anderen Fächern abzustimmen. Das gilt auch umgekehrt: Die Entwürfe deiner
    Fachschaft lesen alle Lehrkräfte. Bearbeiten und veröffentlichen kann weiter nur die
    Fachschaft, und in Suche, Chat und Planung erscheint ein Entwurf erst nach dem Veröffentlichen.
  link: /help/curriculum#entwurf-und-veröffentlichen

- id: "0.53-leitlinien-uebersicht"
  version: "0.53.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-22
  rollen: [teacher]
  eintrag: curricula
  titel: "Wo kommen die Leitperspektiven im Unterricht vor?"
  text: >-
    Auf der Seite Leitperspektiven zeigt dir das Raster-Symbol an jeder Leitperspektive und jeder
    Leitlinie der Schule eine Übersicht: in welchem Fach welcher Aspekt in den Curricula vorkommt
    und welcher noch nirgends. Du kannst auf eine Klasse eingrenzen, alle Fächer zeigen und
    Entwürfe ausblenden; ein Klick auf eine Fundstelle öffnet das Curriculum am Kapitel.
  link: /help/bibliothek#wo-kommt-eine-leitperspektive-im-unterricht-vor

- id: "0.53-lfdb-verweise"
  version: "0.53.1"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-22
  rollen: [teacher]
  eintrag: curricula
  titel: "Verweise auf den Leitfaden Demokratiebildung"
  text: >-
    Im Curriculum kannst du jetzt auf den Leitfaden Demokratiebildung verweisen: im Feld Hinweise
    nach @, auf einen Baustein, einen Themenblock oder eine Kompetenz. Die Übersicht der
    Leitperspektiven zeigt dazu, wo seine Themenblöcke im Unterricht vorkommen.
  link: /help/curriculum#hinweise-leitperspektiven-und-leitlinien

- id: "0.56-curriculum-yaml-import"
  version: "0.56.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-23
  rollen: [teacher]
  eintrag: curricula
  titel: "Curriculum aus YAML importieren"
  text: >-
    In der Liste der Curricula eines Fachs kann deine Fachschaft ein Curriculum jetzt aus einer
    YAML-Datei importieren, etwa aus dem Export einer anderen Plattform. Eine Vorschau zeigt vorher
    Gliederung und Unstimmigkeiten; es entsteht immer ein Entwurf.
  link: /help/curriculum#aus-einer-yaml-datei-importieren

- id: "0.57-aufgaben-weiterleitung"
  version: "0.57.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-24
  rollen: [teacher]
  titel: "Freier Chat: weniger fertige Lösungen für Schüler:innen"
  text: >-
    Arbeiten Schüler:innen im freien Chat an einer Aufgabe, antwortet jetzt ein stärkeres Modell,
    das beim Begleiten bleibt — auch wenn sie mehrmals nach der Lösung fragen. Wissensfragen
    werden weiter beantwortet. Was du davon erwarten kannst, steht in der Hilfe.
  link: /help/assistenten#was-du-vom-freien-chat-bei-schülerinnen-erwarten-kannst

- id: "0.58-querverweise"
  version: "0.58.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-25
  rollen: [teacher]
  eintrag: curricula
  titel: "Querverweise in andere Fächer im Curriculum"
  text: >-
    Wo der Bildungsplan an einer Kompetenz auf ein anderes Fach verweist, steht jetzt eine
    kleine Marke mit dem Fach. Ein Klick zeigt, was gemeint ist und wo die andere Fachschaft es in
    ihrem Curriculum behandelt — ein guter Anlass für Absprachen. Auch im PDF und Word-Export.
  link: /help/curriculum#querverweise-in-andere-fächer

- id: "0.59-jahresverlaufsplaene"
  version: "0.59.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-26
  rollen: [teacher]
  eintrag: curricula
  titel: "Jahresverlaufspläne der Fachschaften"
  text: >-
    In der Bibliothek gibt es jetzt Jahresverlaufspläne: Deine Fachschaft legt je Klassenstufe die
    Sequenzen oder Kapitel ihres Curriculums in Unterrichtswochen auf das Schuljahr — die Ferien
    rechnet die Plattform selbst ein. Mit Ablaufleiste, Puffer, Stundenbilanz je Kapitel und
    Beschluss; im nächsten Schuljahr übernimmst du den Plan als Entwurf.
  link: /help/jahresverlaufsplan

- id: "0.60-verlaufsplan-im-planer"
  version: "0.60.0"
  # ⚠️ Beim Ausrollen auf den Tag des Ausrollens setzen (docs/dev/neuigkeiten.md).
  datum: 2026-11-26
  rollen: [teacher]
  eintrag: planner
  titel: "Der Jahresverlaufsplan in deinem Planer"
  text: >-
    Über der Jahresübersicht deiner Gruppe steht jetzt der Jahresverlaufsplan der Fachschaft, im
    Kopf jeder Woche ihr Thema. Mit „Einheiten anlegen …“ legst du die Einheiten nach dem Plan an
    und belegst ihre freien Stunden — mit Vorschau und Rückgängig. Den Plan selbst kannst du als PDF,
    DOCX oder ODT exportieren.
  link: /help/unterrichtsplanung#der-jahresverlaufsplan-der-fachschaft

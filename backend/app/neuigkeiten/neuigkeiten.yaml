# Hinweise auf Neuerungen — erscheinen auf der Startseite, bis die Person sie wegklickt.
#
# Kommt mit dem Release; die Schule pflegt die Datei nicht. Wie man einen Eintrag schreibt
# und wer ihn sieht: docs/dev/neuigkeiten.md.
#
# Felder:
# - id: eindeutig und nie wiederverwendet — an ihr hängt „weggeklickt"
# - version: das Release, das die Neuerung bringt
# - datum: ab wann; wer sein Konto später angelegt hat, sieht den Hinweis nicht
# - rollen: student, teacher, admin (ein Admin sieht auch Hinweise für Lehrkräfte)
# - titel, text: kurz, in der Du-Form (du klein) — wie die ganze Oberfläche, seit 0.25 auch hier
# - link (optional): eine Seite der Plattform, etwa /help/unterrichtsplanung
# - bis (optional): letzter Tag der Anzeige; ohne endet ein Hinweis 42 Tage nach datum
# - eintrag (optional): Navigationseintrag aus config/ui_levels.yaml — nur wer ihn in seiner
#   Darstellungsstufe sieht, bekommt den Hinweis

- id: "0.17-fachbegriffe"
  version: "0.17.0"
  datum: 2026-10-17
  # Seit 0.18 schlägt die Leiste die Begriffe vor, nicht mehr der Assistent — der Text stimmt
  # nicht mehr.
  bis: 2026-10-17
  rollen: [teacher]
  eintrag: planner
  titel: "Fachbegriffe im Stundenentwurf"
  text: >-
    Der Stundenassistent schlägt jetzt die Fachbegriffe einer Stunde vor und trägt sie nach
    deiner Zustimmung ein. Die Leiste über dem Entwurf heißt „Kompetenzen und Fachbegriffe";
    dort kannst du Begriffe auch selbst suchen und hinzufügen. Hast du einen eigenen
    Stundenassistenten, übernimm den Abschnitt „Fachbegriffe der Stunde" aus dem
    schulweiten Prompt.
  link: /help/unterrichtsplanung

- id: "0.18-begriffe-vorschlagen"
  version: "0.18.0"
  datum: 2026-10-18
  rollen: [teacher]
  eintrag: planner
  titel: "Begriffe schlägt jetzt die Leiste vor"
  text: >-
    Die Leiste „Kompetenzen und Fachbegriffe" schlägt die Fachbegriffe deiner Stunde vor — nach
    jeder Änderung durch den Stundenassistenten und über „Begriffe vorschlagen". ✓ trägt ein,
    ✕ verwirft. Einzelne Namen eines Begriffs lassen sich entfernen, und der DOCX-Export führt
    Kompetenzen und Fachbegriffe auf. Hast du einen eigenen Stundenassistenten, leg ihn neu an —
    die Hilfe erklärt, wie.
  link: /help/unterrichtsplanung

- id: "0.19-chat-stoppen-bearbeiten"
  version: "0.19.0"
  datum: 2026-10-20
  rollen: [student, teacher]
  titel: "Antwort stoppen, Nachricht bearbeiten"
  text: >-
    Während eine Antwort entsteht, wird aus dem Senden-Knopf ein Stopp-Knopf — was bis dahin kam,
    bleibt stehen. Unter deiner letzten Nachricht steht „Bearbeiten": Der Text kommt zurück ins
    Eingabefeld, und Senden ersetzt die alte Nachricht samt Antwort.
  link: /help/chat

- id: "0.19-planung-alltag"
  version: "0.19.0"
  datum: 2026-10-20
  rollen: [teacher]
  eintrag: planner
  titel: "Doppelstunden teilen, Link zum Entwurf"
  text: >-
    Eine Doppelstunde lässt sich in der Jahresübersicht über ⋯ in zwei Einzelstunden teilen —
    etwa für eine Klassenarbeit — und wieder zusammenlegen. Ein Chat mit Bezugsstunde zeigt
    oben einen Link zum Entwurf. Gestrichene Phasen zählen nicht mehr zur Unterrichtszeit.
  link: /help/unterrichtsplanung

- id: "0.20-begriffe-im-schuelerchat"
  version: "0.20.0"
  datum: 2026-10-20
  rollen: [teacher]
  eintrag: planner
  titel: "Deine Fachbegriffe helfen im Schüler-Chat"
  text: >-
    Fachbegriffe, die du an deine Stundenentwürfe hängst, kennt jetzt auch der Chat deiner
    Schüler:innen: Fragt jemand nach einem Begriff, den die Gruppe schon hatte, bekommt der
    Assistent den Eintrag aus dem Wissensspeicher mit — auch Wochen später. Nachbereitete
    Stunden zählen als eingeführt, die übrigen vergangenen „laut Plan".
  link: /help/unterrichtsplanung

- id: "0.21-aktuelle-woche"
  version: "0.21.0"
  datum: 2026-10-21
  rollen: [teacher]
  eintrag: planner
  titel: "Jahresplan: „Aktuelle Woche“"
  text: >-
    Ein Knopf über dem Jahresplan springt zur Woche von heute — in den Ferien zur nächsten
    Unterrichtswoche. Außerdem öffnet ein Klick auf das Thema einer Stunde das Feld jetzt gleich
    mit Cursor.

- id: "0.22-fassung-der-gruppe"
  version: "0.22.0"
  datum: 2026-10-27
  rollen: [teacher]
  eintrag: planner
  titel: "Bildungsplan in der Fassung deiner Gruppe"
  text: >-
    Im Chat mit einer Unterrichtsgruppe, etwa beim Stundenassistenten, sieht der Assistent nur
    noch die Bildungsplan-Fassung, die für diese Gruppe gilt — Kompetenzen und Operatoren einer
    7. Klasse also nach V3, die einer 9. Klasse nach V2. Wer ohne Gruppe chattet, sieht wie
    bisher alle Fassungen.
  link: /help/unterrichtsplanung

- id: "0.22-schueler-assistenten"
  version: "0.22.0"
  datum: 2026-10-27
  rollen: [teacher]
  titel: "Neue Assistenten für deine Schüler:innen"
  text: >-
    Drei Assistenten begleiten Schüler:innen beim Üben, ohne Lösungen vorzusagen: für
    stöchiometrische Berechnungen und für Reaktionsgleichungen (Chemie, ab Klasse 8) sowie für
    naturwissenschaftliche Aufgaben (Klasse 5–13), der auch auf Operatoren wie „erläutere“ oder
    „bewerte“ achtet.
  link: /help/assistenten

- id: "0.23-operatoren-pruefen"
  version: "0.23.0"
  datum: 2026-10-27
  rollen: [teacher]
  titel: "Operatoren nach dem Bildungsplan"
  text: >-
    Der Assistent für naturwissenschaftliche Aufgaben erkennt den Operator einer Aufgabe
    („Erläutere …“, „Werte … aus“) und prüft die Antwort deiner Schüler:innen gegen dessen
    Definition im Bildungsplan, in der Fassung ihrer Klasse: Fehlt bei „erläutern“ das Beispiel
    oder bei „bewerten“ der Wertmaßstab, fragt er genau danach — ohne es vorzusagen.
  link: /help/assistenten

- id: "0.24-vorschlag-schueler"
  version: "0.24.0"
  datum: 2026-10-28
  rollen: [student]
  titel: "Der Chat schlägt passende Assistenten vor"
  text: >-
    Schreibst du eine Aufgabe in den Chat, für die es einen Assistenten gibt, erscheint unter der
    Antwort ein Vorschlag. Wählst du ihn, beantwortet der Assistent deine Nachricht noch einmal und
    begleitet dich Schritt für Schritt. Mit „Hier bleiben“ geht es einfach weiter.
  link: /help/assistenten

- id: "0.24-vorschlag-lehrkraefte"
  version: "0.24.0"
  datum: 2026-10-28
  rollen: [teacher]
  titel: "Assistenten-Vorschlag für deine Schüler:innen"
  text: >-
    Schreiben Schüler:innen eine Aufgabe in den normalen Chat, für die es einen Assistenten gibt,
    bietet der Chat ihn unter der Antwort an — etwa den Assistenten für stöchiometrische
    Berechnungen. Für eigene Assistenten legst du das im Editor unter „Vorschlag im Chat“ fest;
    wie es aussieht, zeigt der Vorschaumodus.
  link: /help/assistenten

- id: "0.25-du"
  version: "0.25.0"
  datum: 2026-10-28
  rollen: [student, teacher]
  titel: "Wir duzen jetzt überall"
  text: >-
    Die Plattform spricht dich jetzt überall mit „du“ an — in Menüs, Meldungen und der Hilfe, so
    wie die Assistenten schon bisher. Außerdem stehen hier höchstens zwei Neuigkeiten offen; ältere
    findest du unter „Weitere Neuerungen“.

- id: "0.26-assistenten-schueler"
  version: "0.26.0"
  datum: 2026-10-31
  rollen: [student]
  titel: "Zwölf neue Assistenten"
  text: >-
    Für viele Aufgaben gibt es jetzt einen passenden Assistenten: Rechnen, Mathe, Versuche,
    Diagramme, Texte analysieren, Argumentieren, Texte überarbeiten, Grammatik, Referate,
    Projekte, Programmieren und Lernen für Klassenarbeiten. Du findest sie unter „Assistenten“
    und auf der Seite deines Fachs. Sie begleiten dich Schritt für Schritt; die Lösung findest du
    selbst.
  link: /help/assistenten

- id: "0.26-assistenten-lehrkraefte"
  version: "0.26.0"
  datum: 2026-10-31
  rollen: [teacher]
  titel: "Zwölf Assistenten für deine Schüler:innen"
  text: >-
    Deine Schüler:innen haben jetzt zwölf allgemeine Assistenten, von Rechnen bis Erörtern; sie
    ersetzen den Assistenten für naturwissenschaftliche Aufgaben. Wie sie genauer auf deinen
    Unterricht antworten, etwa mit Fachbegriffen an deinen Stunden oder Methodenblättern deiner
    Fachschaft, steht in der neuen Hilfe „Bessere Antworten“.
  link: /help/bessere-antworten

- id: "0.27-assistenten-kosten"
  version: "0.27.0"
  datum: 2026-11-01
  rollen: [student, teacher]
  titel: "Was kostet ein Assistent?"
  text: >-
    Neben dem Namen eines Assistenten steht jetzt, was eine Nachricht an ihn ungefähr kostet,
    etwa „~60 🪙“. Assistenten mit langen Anleitungen oder eigenen Dokumenten kosten mehr als der
    normale Chat. Der Info-Knopf daneben zeigt, welche Dokumente der Assistent kennt.
  link: /help/assistenten

- id: "0.27-assistenten-lehrkraefte"
  version: "0.27.0"
  datum: 2026-11-01
  rollen: [teacher]
  titel: "Eigene Assistenten: Fach, Dokumente, Freigabe"
  text: >-
    Gibst du einen Assistenten für eine Unterrichtsgruppe oder Fachschaft frei, übernimmt er das
    Fach der Gruppe. Kontext-Dokumente sehen alle im Chat mit ihrem Dateinamen; wähle ihn so, dass
    er sagt, was drinsteht. Reichst du einen Assistenten zur Freigabe ein, sehen die Admins dein
    Stundenplan-Kürzel, falls du eins hinterlegt hast.
  link: /help/assistenten

- id: "0.28-audit-log"
  version: "0.28.0"
  datum: 2026-11-02
  rollen: [admin]
  titel: "Audit-Log"
  text: >-
    Unter Einstellungen → Audit-Log siehst du, wer wann einen Assistenten freigegeben, ein
    Budget geändert oder Sitzungen beendet hat, dazu gescheiterte Anmeldungen, Krisen-Flags und
    die nächtlichen Löschläufe. Ohne Inhalte, Personen nur als Pseudonym; die Einträge lassen
    sich nicht ändern.

- id: "0.29-vorschau"
  version: "0.29.0"
  datum: 2026-11-03
  rollen: [teacher]
  titel: "Als Schüler:in ansehen"
  text: >-
    Im Benutzermenü kannst du die Plattform jetzt eine Stunde lang so sehen, wie eine
    Schüler:in deiner Gruppe sie sieht, und alles ausprobieren. Im Assistenten-Editor testest du
    deinen Assistenten mit „Als Schüler:in testen“ direkt aus Schülersicht. Ändern lässt sich in
    der Vorschau nichts.
  link: /help/vorschau

- id: "0.30-strukturformeln"
  version: "0.30.0"
  datum: 2026-11-03
  rollen: [student, teacher]
  titel: "Strukturformeln im Chat"
  text: >-
    Frag im Chat nach einer Strukturformel, und sie erscheint als Bild: als Valenzstrichformel
    mit freien Elektronenpaaren, auf Wunsch als Skelettformel, auch Grenzformeln und Reaktionen.
    Eine Formel, die sich nicht darstellen lässt, zeigt jetzt „Formel nicht darstellbar“ statt
    Quelltext.
  link: /help/diagramme

- id: "0.31-daumen"
  version: "0.31.0"
  datum: 2026-11-04
  rollen: [student, teacher]
  titel: "Antworten bewerten, bekannte Probleme"
  text: >-
    Unter jeder Antwort im Chat stehen jetzt zwei Daumen: Sag mit einem Klick, ob die Antwort
    hilfreich war. Im Nutzermenü unter „Feedback & Neuigkeiten“ siehst du außerdem, welche
    Probleme schon bekannt sind — dann musst du sie nicht noch einmal melden.
  link: /help/feedback

- id: "0.31-sichtung"
  version: "0.31.0"
  datum: 2026-11-04
  rollen: [admin]
  titel: "Bekannte Probleme und Antwortbewertung"
  text: >-
    In der Rückmelde-Verwaltung kannst du eine Meldung mit eigenem Titel als bekanntes Problem
    zeigen, für alle oder nur für Lehrkräfte. Unter Statistik → Antwortbewertung siehst du,
    wie die Daumen je Assistent und Modell ausfallen.

- id: "0.32-assistenten-der-gruppe"
  version: "0.32.0"
  datum: 2026-11-04
  rollen: [teacher]
  titel: "Welche Assistenten sieht meine Klasse?"
  text: >-
    Auf der Seite deiner Unterrichtsgruppe zeigt der neue Reiter „Assistenten“, welche
    Assistenten die Schüler:innen dieser Gruppe sehen — und welche deiner eigenen nicht, mit
    Grund. Von dort kommst du mit einem Klick in die Vorschau als Schüler:in dieser Gruppe.
  link: /help/faecher

- id: "0.33-so-kommt-er-an"
  version: "0.33.0"
  datum: 2026-11-05
  rollen: [teacher]
  titel: "Wie kommt dein Assistent an?"
  text: >-
    Im Editor deiner eigenen Assistenten steht jetzt unter „So kommt er an“, wie die Daumen
    unter den Antworten ausfallen — getrennt nach Schüler:innen und Lehrkräften, ab 10
    Bewertungen, ohne Namen. „Meine Assistenten“ zeigt den Anteil „hilfreich“ in einer Spalte.
  link: /help/assistenten


- id: "0.36-diagramme"
  version: "0.36.0"
  datum: 2026-11-06
  rollen: [student, teacher]
  titel: "Diagramme klappen jetzt fast immer"
  text: >-
    Diagramme im Chat zeichnet ein neuer, schnellerer Renderer. Beschriftungen mit Klammern
    wie „Nitrat (NO₃⁻)“, an denen Diagramme bisher oft scheiterten, sind kein Problem mehr.
    Funktionsgraphen haben Achsen wie im Heft, und im Export (PDF, Word, ODT) erscheinen
    Diagramme als Bild statt als Quelltext.
  link: /help/diagramme

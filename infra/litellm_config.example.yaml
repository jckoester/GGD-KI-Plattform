# litellm_config.example.yaml — Beispiel-Konfiguration für den LiteLLM-Proxy
#
# Dies ist eine VORLAGE. Vor dem Produktivbetrieb anpassen und — besonders die
# Guardrails — mit Schulleitung, Schulsozialarbeit und Fachschaften kuratieren.
# Änderungen erfordern einen Neustart des LiteLLM-Containers (Deployment-Gate +
# Git-Audit-Trail, ADR-008 Teil 1A).
#
# Hinweis zur Syntax: Die genaue Guardrail-Konfiguration hängt von der eingesetzten
# LiteLLM-Version ab. Die hier gezeigte Form orientiert sich an ADR-008 Teil 1A;
# beim Deployment gegen die LiteLLM-Doku der verwendeten Version abgleichen.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# MODELLNAMEN SIND AUFGABENNAMEN, KEINE PRODUKTNAMEN
#
# Die `model_name`-Werte unten (`chat-standard`, `system-titel`, `bild-standard` …) sind
# die Namen, die die Anwendung kennt: Sie stehen in der `.env`, in Assistenten-Datensätzen
# und in den Team-Allowlists. Welches Produkt dahinter liegt, sagt allein
# `litellm_params.model` — ein Anbieterwechsel ist deshalb eine Zeile HIER und sonst
# nirgends.
#
# ⚠️ Rohe Produktnamen als `model_name` (`gpt-4o-mini`, `gpt-image-1`) funktionieren zwar,
# haben aber drei Folgen: Der Modellwähler-Filter `MODEL_PICKER_HIDDEN_PREFIXES` greift
# nicht mehr (das Titelmodell steht dann sichtbar im Dropdown jeder Schüler:in), jeder
# Anbieterwechsel fasst `.env` und Datenbank an, und im Gesprächsverlauf stehen dauerhaft
# Produktnamen, die es in zwei Jahren nicht mehr gibt.
#
# Fertige `model_list`-Blöcke für IONOS, Mistral, OpenAI, Anthropic und den Mischbetrieb:
# docs/admin/modell-szenarien.md. Die unten gezeigten Modelle sind ein BEISPIEL (OpenAI,
# gemessen am 28.08.2026) — die Struktur ist der eigentliche Inhalt dieser Vorlage.
# ─────────────────────────────────────────────────────────────────────────────────────

model_list:
  # Kurze Fragen, Vokabeln, Textvereinfachung. Für alle Teams.
  - model_name: chat-schnell
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Arbeitspferd: Erklärungen, Hausaufgabenhilfe, Feedback. Für alle Teams.
  - model_name: chat-standard
    litellm_params:
      model: gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  # Analyse, lange Texte, Unterrichtsplanung. Deutlich teurer — nur Lehrkräfte.
  - model_name: chat-komplex
    litellm_params:
      model: gpt-5
      api_key: os.environ/OPENAI_API_KEY

  # Gesprächstitel. Läuft bei jedem neuen Chat, klein und günstig genügt.
  # ⚠️ NICHT blind das billigste Modell nehmen: Der Prompt gibt „maximal 6 Wörter" vor,
  # und manche günstigen Modelle halten das nicht ein (bei IONOS und Mistral gemessen).
  # Ein zu langer Titel wird in der Historie mitten im Wort abgeschnitten.
  # Das `system-`-Präfix hält es aus dem Chat-Modellwähler heraus — freigeschaltet muss
  # es trotzdem in JEDEM Team sein, weil der Aufruf über den Virtual Key der Nutzer:innen
  # läuft, nicht über den Master-Key.
  - model_name: system-titel
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Klassifikator des Jugendschutz-Guardrails (siehe unten). Läuft bei JEDER Antwort.
  - model_name: system-moderation
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Kontextspeicher / semantische Suche.
  # ⚠️ Die Vektorbreite muss zu EMBEDDING_DIMENSIONS UND zur Datenbankspalte passen.
  # Ein Wechsel verlangt Schemaänderung + vollständiges Re-Embedding aller Knoten
  # (docs/runbooks/modellwechsel.md). Vor dem ersten Import entscheiden.
  - model_name: embedding-standard
    litellm_params:
      model: text-embedding-3-small     # 1536 Dimensionen
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding

  # Self-hosted Fallback (Pflicht laut Projektvorgabe — Ollama im lokalen Netz):
  - model_name: ollama-fallback
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_BASE_URL

  # ── Bildgenerierung (Phase 16) ──────────────────────────────────────────────
  # Bild-Modelle werden über `model_info.mode: image_generation` als solche markiert
  # — für Health-Checks und um sie in der Bild-Freigabe-Matrix von Chat-Modellen zu
  # trennen (Team-Allowlist bleibt gemeinsam).
  # Datenschutz: Der Client fordert `response_format: b64_json` an bzw. nutzt Modelle,
  # die ohnehin nur Base64 liefern (gpt-image-1). Es werden KEINE extern gehosteten
  # Bild-URLs verarbeitet — die Bytes bleiben im Schulnetz.
  #
  # Welches Bildmodell wofür genutzt wird, entscheidet die **Bildart**
  # (config/image_models.yaml) — dieser Eintrag stellt es nur bereit.
  - model_name: bild-standard
    litellm_params:
      model: gpt-image-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: image_generation
      # ⚠️ Für BILDER ignoriert LiteLLM den Preis aus `model_info` — er ist hier reine
      # Dokumentation. Wirksam wird er ausschließlich über IMAGE_PRICES (.env) plus den
      # Callback `guardrails.bildpreise.registrierung` weiter unten. Ohne den kostet
      # jedes Bild 0,00 $ und läuft am EUR-Budget vorbei, ohne dass etwas fehlschlägt.
      # `check_litellm_config.py` gleicht beide Stellen gegeneinander ab.
  # Self-hosted Bild-Fallback (sensibler Pfad, analog Ollama) — OpenAI-kompatibler
  # lokaler Server (z. B. vLLM-Omni), api_base im lokalen Netz. Auskommentiert lassen,
  # bis der lokale Bild-Server steht (end-to-end testen, vgl. Plan §7).
  # - model_name: local-image
  #   litellm_params:
  #     model: openai/<vom-server-bedientes-modell>
  #     api_base: os.environ/LOCAL_IMAGE_BASE_URL
  #     api_key: "sk-local-placeholder"
  #   model_info:
  #     mode: image_generation

# ── Jugendschutz-Guardrails (proxy-global, ADR-008 Teil 1A) ───────────────────
# Gelten für ALLE Modellanfragen, unabhängig von Assistent, Zielgruppe und Modell.
# Sie greifen am Output (post_call) und blockieren harte Verstöße. Lernverhalten-
# Leitplanken (Schüler:innen) sind hier BEWUSST NICHT konfiguriert — die liegen
# audience-abhängig im Backend (pedagogy.yaml), damit Lehrkräfte volle Antworten
# behalten.
#
# ⚠️ Dieser Block gehört auf die OBERSTE Ebene, NICHT unter `litellm_settings`. Dort
# erwartet LiteLLM das alte Guardrail-Format und quittiert diese Schreibweise beim Start
# mit „GuardrailItem() argument after ** must be a mapping, not str" — der Proxy startet
# dann gar nicht erst.
#
# ── Warum EIN Klassifikator statt vier Einzel-Guardrails ─────────────────────
# Früher standen hier drei `openai_moderation`-Einträge plus ein `regex`-Eintrag für
# Drogen-Anleitungen. Beides trägt nicht mehr:
#
#   * `openai_moderation` setzt ein OpenAI-Konto voraus. Bei EU-Anbietern (IONOS, Mistral)
#     gibt es die Moderation-API nicht — der Jugendschutz fiele ersatzlos aus.
#   * Den Typ `regex` gibt es seit LiteLLM 1.83.7 nicht mehr; der Proxy startet damit
#     nicht („ValueError: Unsupported guardrail: regex").
#   * Die damals konfigurierten Kategorien und Schwellen standen unter
#     `guardrail_info.params` — die liest `openai_moderation` gar nicht. Sie waren also
#     nie wirksam.
#
# Der Klassifikator bewertet stattdessen alle vier Kategorien in EINEM Aufruf, mit einem
# beliebigen Chat-Modell des eigenen Anbieters. Seine Schwellen greifen tatsächlich.
# ── Bildpreise ────────────────────────────────────────────────────────────────
# Nur nötig, wenn Bildmodelle eingesetzt werden, die LiteLLM nicht aus seiner eingebauten
# Preistabelle kennt (alles selbst Eingetragene). Für Bilder ignoriert LiteLLM den Preis
# aus `model_info` — ohne diesen Callback kosten sie 0,00 $ und laufen am EUR-Budget
# vorbei. Preise stehen in IMAGE_PRICES (siehe .env.example).
litellm_settings:
  callbacks: ["guardrails.bildpreise.registrierung"]

guardrails:
  - guardrail_name: "jugendschutz"
    litellm_params:
      guardrail: guardrails.llm_moderation.LlmModerationGuardrail
      mode: post_call
      default_on: true
      # Vollqualifiziert (Provider + ggf. api_base), NICHT der `model_name` aus der
      # model_list: Der Guardrail ruft litellm direkt auf, nicht den Proxy. Deshalb steht
      # hier `openai/gpt-4o-mini` und nicht `system-moderation` — der Alias oben ist für
      # die Anwendung da, nicht für diesen Aufruf.
      # Ein kleines, günstiges Modell genügt — es läuft bei JEDER Antwort.
      classifier_model: openai/gpt-4o-mini
      # Bei eigenem Endpunkt zusätzlich setzen:
      # classifier_api_base: os.environ/IONOS_API_BASE
      classifier_api_key: os.environ/OPENAI_API_KEY
      timeout: 8.0
      # Ein zweiter Anlauf deckt die häufigste Störung ab — die kurze.
      classifier_retries: 1
      # Optionaler zweiter Klassifikator (Entscheidung der Schule): dasselbe Modell bei
      # einem anderen Anbieter gibt Ausfallsicherheit ohne erneute Prüfung der
      # Abgrenzung; ein anderes Modell braucht sie.
      # fallback_classifier_model: openai/mistralai/Mistral-Small-24B-Instruct
      # fallback_classifier_api_base: os.environ/IONOS_API_BASE
      # fallback_classifier_api_key: os.environ/IONOS_API_KEY
      # Liefert auch der Rückfall nichts: Diese Teams arbeiten weiter, alle anderen
      # bekommen die Antwort zurückgehalten (Jugendschutz vor Verfügbarkeit).
      fail_open_teams: ["lehrkraefte"]
      # Zählerstand für /admin/guardrail/health.
      # ⚠️ Der Proxy läuft in einem EIGENEN Compose-Stack — `./data` des Anwendungs-Stacks
      # ist für ihn nicht sichtbar. Beide müssen dasselbe HOST-Verzeichnis einbinden
      # (Beispiel in infra/litellm_config.ionos.example.yaml). Auf getrennten Hosts ist
      # eine gemeinsame Datei unmöglich: dann weglassen und über das Proxy-Log überwachen.
      health_file: "/app/data/guardrail_health.json"   # lokal: ../data/guardrail_health.json
      # Optional — ohne Angabe gelten die Defaults aus moderation_core.py.
      # violence_graphic liegt höher: Historische und literarische Gewaltdarstellung
      # gehört zum Unterricht.
      thresholds:
        sexual: 0.5
        violence_graphic: 0.7
        self_harm_instructions: 0.5
        drug_instructions: 0.5

  # ── Bild-Prompt-Filter (Phase 16, Bildgenerierung, pre_call) ────────────────
  # Defense-in-Depth für /images/generations: Der Backend-Handler moderiert den
  # Bild-Prompt bereits lokal (Krisen-Scan + config/image_blocklist.yaml). Dieser
  # Guardrail prüft ihn zusätzlich am Proxy — `pre_call`, BEVOR der Anbieter ihn sieht.
  # Der Klassifikator oben greift hier NICHT: Er läuft `post_call` auf Chat-Antworten,
  # und bei Bildern gibt es keine Textantwort zu bewerten.
  # `litellm_content_filter` gibt es weiterhin (anders als `regex`).
  # Blockwörter kuratieren! Erst nach Test aktivieren.
  # - guardrail_name: "image_prompt_filter"
  #   litellm_params:
  #     guardrail: litellm_content_filter
  #     mode: pre_call
  #     blocked_words:
  #       - keyword: "..."
  #         action: "BLOCK"

# ⚠️ Deployment: `guardrails/llm_moderation.py` und `guardrails/moderation_core.py` müssen
# dort liegen, wo der Proxy läuft, und von seinem Arbeitsverzeichnis aus importierbar sein
# (PYTHONPATH auf das guardrails-Verzeichnis). Der Modulname wird als DATEIPFAD relativ zum
# Arbeitsverzeichnis aufgelöst — läuft der Proxy in `infra/`, heißt er
# `guardrails.llm_moderation.…`.
#
# Verhalten bei Störungen: gestaffelt (siehe docs/admin/content-moderation.md).
# Wiederholung → optionaler Rückfall-Klassifikator → publikumsabhängige Entscheidung:
# Teams aus `fail_open_teams` arbeiten weiter, alle anderen bekommen die Antwort
# zurückgehalten. Reines fail-open wäre zu riskant (dieser Guardrail ist die einzige
# Ausgabeprüfung), reines fail-closed legte bei einer Anbieterstörung die ganze Schule
# lahm — konsistent mit dem PII-Gate (Phase 14) und ADR-008 Teil 3.
#
# Die Regex-Musterdateien unter guardrails/ bleiben als Ausgangspunkt liegen, falls später
# eine deterministische zweite Schicht gewünscht ist (der Klassifikator kann ausfallen).
# Sie brauchen dafür das Format von `litellm_content_filter` und — wichtiger — Kuratierung:
# Ein Muster wie `(anleitung|rezept).{0,40}synthese` trifft den Chemieunterricht mit.


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # ⚠️ LITELLM_DATABASE_URL, NICHT DATABASE_URL: Der Proxy legt sein eigenes Prisma-Schema
  # an (Virtual Keys, Teams, Budgets, SpendLogs) und braucht dafür eine EIGENE Datenbank —
  # sonst kollidiert es mit dem Alembic-Schema der Anwendung. Außerdem erwartet LiteLLM
  # einen reinen `postgresql://`-DSN; der asyncpg-DSN aus DATABASE_URL funktioniert nicht.
  database_url: os.environ/LITELLM_DATABASE_URL
  # Über die Proxy-UI angelegte Modelle und Credentials überleben einen Neustart nur
  # hiermit. Verschlüsselt werden sie mit LITELLM_SALT_KEY (siehe .env.example).
  store_model_in_db: true

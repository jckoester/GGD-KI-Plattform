# litellm_config.ionos.example.yaml — LiteLLM-Proxy für den Betrieb mit EU-Anbietern
#
# Vorlage für den IONOS-Betriebspfad (ADR-015). Modell-IDs, Fähigkeiten und Preise sind am
# 26.08.2026 gegen den laufenden AI Model Hub gemessen bzw. der Preisliste entnommen
# (cloud.ionos.com/managed/ai-model-hub, **USD** — LiteLLM rechnet in USD, die EUR-Budgets
# werden vom monatlichen Cron über den EZB-Kurs umgerechnet).
#
# Nachmessen, wenn IONOS den Katalog ändert:
#
#     python scripts/ionos_probe.py                     # Katalog
#     python scripts/ionos_probe.py --chat <id>         # Function-Calling + Reasoning
#     cd backend && python scripts/check_litellm_config.py   # Config gegen den Proxy
#
# ⚠️ Preise ändern sich ohne Ankündigung an dieser Datei. Sie sind der einzige Weg, auf dem
# Kosten in die SpendLogs kommen — stimmen sie nicht, stimmen Budgets und Statistik nicht,
# ohne dass irgendetwas fehlschlägt.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# ZWEI NAMENSEBENEN (Plan §5)
#
# Ebene 1 — **Aufgaben-Aliase** (`chat-standard`, `system-titel`, …). Das ist der
#   Standardweg. Der Name beschreibt den Einsatzzweck, nicht das Produkt. Ein
#   Anbieterwechsel ändert dann nur `litellm_params.model` in DIESER Datei; `.env`,
#   Assistenten-Datensätze und Team-Allowlists bleiben unberührt.
#
# Ebene 2 — **explizite Modelle** unter Anbieter-Präfix (`ionos-…`). Für Lehrkräfte, die
#   einen Assistenten bewusst an ein bestimmtes Modell binden wollen. Nur für das Team
#   `lehrkraefte` freischalten — sonst stünden Alias und expliziter Name desselben
#   Modells nebeneinander im Schüler-Dropdown.
#
# Das `system-`-Präfix blendet Modelle aus dem Chat-Modellwähler aus
# (`MODEL_PICKER_HIDDEN_PREFIXES`). Rein kosmetisch: `system-titel` muss trotzdem in
# JEDER Team-Allowlist stehen, weil die Titelgenerierung über den persönlichen Virtual
# Key der Nutzer:innen läuft — nicht über den Master-Key.
# ─────────────────────────────────────────────────────────────────────────────────────
#
# PFLICHTFELDER unter `model_info` — ohne sie bricht Funktionalität STILL:
#
#   input_cost_per_token / output_cost_per_token
#       LiteLLM kennt für `openai/<id>` mit eigener `api_base` KEINE Preise. Ohne diese
#       Werte melden die SpendLogs 0 → EUR-Budgets, das 429-Enforcement, /budget und
#       /statistics/costs laufen ins Leere. Umrechnung: Preis pro Mio ÷ 1_000_000,
#       also 0,17 $/M → 0.00000017. (Ein Pro-Million-Feld gibt es nicht.)
#
#   supports_function_calling: true
#       Das Backend liest die Tool-Fähigkeit aus /model/info. Fehlt der Wert, ist er
#       unbestimmt — dann verschwinden Wissensgraph-, Planungs- und Bild-Werkzeuge
#       entweder stumm, oder sie gehen an ein Modell, das sie nicht kann.
#
#   mode: image_generation | embedding
#       Trennt die Modalitäten. Ohne `image_generation` taucht ein Bildmodell in der
#       Bild-Freigabe-Matrix nicht auf.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# REASONING — der Kostenhebel (gemessen 26.08.2026)
#
# Die Qwen3.5-Modelle denken per Vorgabe, auch bei Trivialem: „Wiederhole ein Wort" kostete
# 273–438 Ausgabe-Tokens Denkspur. Bei einer unglücklich formulierten Anweisung lief
# Qwen3.5-9B in 4096 Tokens, ohne je zu antworten — `content: null`, alles steckte im Feld
# `reasoning`, das die Oberfläche nicht anzeigt. Ein solches Modell wirkt im Chat stumm und
# kostet trotzdem.
#
# Abschaltbar ist das genau auf einem Weg:
#
#   reasoning_effort: none      ✅ 438 → 4 Tokens
#   chat_template_kwargs: {enable_thinking: false}   ❌ wirkungslos, denkt weiter
#   "/no_think" im Prompt       ❌ macht es schlimmer (2018 Zeichen Denkspur)
#
# ⚠️ Die gültigen Werte sind modellabhängig. Qwen versteht `none`; gpt-oss-120b lehnt es mit
# HTTP 400 ab („Harmony does not support reasoning_effort='none'") und kennt nur
# `low`/`medium`/`high`. Beim Modellwechsel also nicht bloß die `model:`-Zeile tauschen,
# sondern mit scripts/ionos_probe.py nachmessen, was das neue Modell akzeptiert.
#
# ⚠️ `reasoning_effort` allein genügt NICHT. LiteLLM prüft den Parameter gegen seine
# Fähigkeitstabelle, kennt die IONOS-IDs dort nicht und bricht die Anfrage mit
# `UnsupportedParamsError` ab — der Eintrag wäre komplett unbenutzbar. Deshalb steht
# überall zusätzlich `allowed_openai_params: ["reasoning_effort"]`.
# NICHT `drop_params: true` verwenden: Das entfernt den Parameter stillschweigend, das
# Reasoning bliebe an, und man merkt es nur an der Rechnung.
#
# Deshalb steht `reasoning_effort: none` überall dort, wo NICHT gedacht werden soll — und
# fehlt bewusst bei `chat-reasoning` und `chat-komplex`.
# ─────────────────────────────────────────────────────────────────────────────────────

model_list:
  # ══ Ebene 1: Aufgaben-Aliase ════════════════════════════════════════════════════════

  # Kurze Fragen, Vokabeln, Textvereinfachung. Für alle Teams.
  # Mistral Small 24B ist hier bewusst gesetzt: Es ist das günstigste Modell, das Werkzeuge
  # zuverlässig aufruft UND ohne Denkspur sofort antwortet — Schüler:innen sitzen sonst vor
  # einem stillen Fenster. (Mistral NeMo 12B wäre billiger, zerlegt Werkzeugaufrufe aber in
  # unbrauchbaren Text — gemessen, siehe scripts/ionos_probe.py.)
  - model_name: chat-schnell
    litellm_params:
      model: openai/mistralai/Mistral-Small-24B-Instruct
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true         # gemessen
      input_cost_per_token: 0.00000011        # 0,11 $/M
      output_cost_per_token: 0.00000033       # 0,33 $/M

  # Arbeitspferd: Erklärungen, Hausaufgabenhilfe, Feedback. Für alle Teams.
  # Reasoning ausgeschaltet — wer eine denkende Antwort will, wählt `chat-reasoning`.
  - model_name: chat-standard
    litellm_params:
      model: openai/openai/gpt-oss-120b       # doppeltes `openai/`: Provider + IONOS-ID
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
      # `low`, NICHT `none`: gpt-oss-120b lehnt `none` ab („Harmony does not support
      # reasoning_effort='none'", HTTP 400) — es denkt immer, nur unterschiedlich lang.
      # low = 28 Tokens, ohne Angabe 56, high 179 (gemessen).
      reasoning_effort: low
      allowed_openai_params: ["reasoning_effort"]   # sonst UnsupportedParamsError, s. o.
    model_info:
      supports_function_calling: true         # gemessen
      input_cost_per_token: 0.00000017        # 0,17 $/M
      output_cost_per_token: 0.00000071       # 0,71 $/M

  # Programmieraufgaben. IONOS führt seit 2026 ein dediziertes Code-Modell — die Annahme des
  # Plans (§5.2: „kein Code-Modell, zeigt vorerst auf chat-standard") ist überholt.
  - model_name: chat-code
    litellm_params:
      model: openai/Qwen/Qwen3-Coder-Next
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true         # gemessen
      input_cost_per_token: 0.00000017        # 0,17 $/M
      output_cost_per_token: 0.00000089       # 0,89 $/M

  # Denkt vor der Antwort — für mehrschrittige Aufgaben, Herleitungen, Begründungen.
  # Dasselbe Backend wie `chat-standard`, nur mit aktivem Reasoning: didaktisch als „derselbe
  # Assistent, aber er denkt erst nach" erklärbar, und die Denkspur kostet nur Ausgabe-Tokens
  # desselben günstigen Modells. Freigabe nach Jahrgang (höhere Klassen), nicht schulweit.
  # Wechsel auf ein stärkeres Modell (z. B. Qwen3.5-397B) = eine Zeile `model:` hier.
  - model_name: chat-reasoning
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
      # Der Unterschied zu chat-standard ist allein diese Zeile: high statt low —
      # 179 statt 28 Ausgabe-Tokens, 800 statt 22 Zeichen Denkspur (gemessen).
      reasoning_effort: high
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000017
      output_cost_per_token: 0.00000071

  # Analyse, lange Texte, Unterrichtsplanung. Mit Abstand am teuersten (4,00 $/M Ausgabe bei
  # starkem Reasoning) → NUR für `lehrkraefte` freischalten.
  - model_name: chat-komplex
    litellm_params:
      model: openai/Qwen/Qwen3.5-397B-A17B
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true         # gemessen
      input_cost_per_token: 0.00000067        # 0,67 $/M
      output_cost_per_token: 0.00000400       # 4,00 $/M

  # ══ System-Modelle: nie im Modellwähler (MODEL_PICKER_HIDDEN_PREFIXES) ══════════════

  # Gesprächstitel. Läuft bei JEDER neuen Konversation.
  #
  # NICHT das billigste Modell: Der Titel-Prompt verlangt „maximal 6 Wörter", und daran
  # scheitert Qwen3.5-9B reproduzierbar — es antwortet mit erklärenden Sätzen (gemessen:
  # 15, 16 und 22 Wörter), die die Oberfläche dann mitten im Wort abschneidet. Mistral
  # Small 24B schwankt (4 bis 13 Wörter). gpt-oss-120b hielt sich in 4 von 4 Proben daran.
  # Der Aufpreis ist bei ~30 Ausgabe-Tokens je Titel bedeutungslos (0,000028 $ statt
  # 0,000007 $); ein unbrauchbarer Titel steht dagegen dauerhaft in der Historie.
  # ⚠️ Muss in jeder Team-Allowlist stehen (Aufruf über den Virtual Key der Nutzer:innen).
  - model_name: system-titel
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
      reasoning_effort: low
      allowed_openai_params: ["reasoning_effort"]   # sonst UnsupportedParamsError, s. o.
    model_info:
      supports_function_calling: false        # Titel brauchen keine Werkzeuge
      input_cost_per_token: 0.00000017        # 0,17 $/M
      output_cost_per_token: 0.00000071       # 0,71 $/M

  # Klassifikator für die Jugendschutz-Guardrails (ersetzt `openai_moderation`, das es bei
  # IONOS nicht gibt). Angebunden unten unter `litellm_settings.guardrails`.
  # Mistral Small 24B statt des noch günstigeren Qwen3.5-9B: Der Klassifikator muss die
  # fürsorgliche Krisenantwort von der Anleitung zur Selbstverletzung unterscheiden — der
  # Prüfstein aus ADR-008. Vor dem Produktivgang mit den Testfällen aus
  # backend/tests/unit/test_moderation_core.py gegenprüfen.
  - model_name: system-moderation
    litellm_params:
      model: openai/mistralai/Mistral-Small-24B-Instruct
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: false
      input_cost_per_token: 0.00000011
      output_cost_per_token: 0.00000033

  # ══ Weitere Modalitäten ═════════════════════════════════════════════════════════════

  # Embeddings des Kontextspeichers. BGE-M3 ist mehrsprachig und für Deutsch geeignet.
  # ⚠️ Liefert **1024** Dimensionen (gemessen) — die heutige Spalte hat 1536. Umstellung
  # heißt: EMBEDDING_DIMENSIONS=1024, Spalte umstellen UND alles neu einbetten.
  # Ablauf: docs/runbooks/modellwechsel.md. Kein Schritt davon ist optional.
  - model_name: embedding-standard
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
      # PFLICHT: LiteLLM schickt sonst `encoding_format: base64`, und daran scheitert IONOS
      # (upstream 500 → als 422 durchgereicht). Ohne diese Zeile funktioniert der gesamte
      # Kontextspeicher nicht — semantische Suche, Import, Backfill.
      encoding_format: float
    model_info:
      mode: embedding
      input_cost_per_token: 0.00000002        # 0,02 $/M

  # ── Bildgenerierung ─────────────────────────────────────────────────────────────────
  # Beide Modelle liefern Base64 **ohne** `response_format`-Parameter (gemessen)
  # → in der Bildart `response_format: ""` lassen.
  #
  # ⚠️ Bildpreise wirken NUR über `IMAGE_PRICES` (.env) + den Callback `bildpreise`
  # (siehe litellm_settings unten), der beim Start `litellm.register_model()` aufruft.
  # Gemessen am 28.08.2026 mit `scripts/bildpreis_probe.py` — alle drei anderen Wege
  # buchen 0,00 $, ohne dass etwas fehlschlägt:
  #     model_info.input_cost_per_image        ❌
  #     litellm_params.input_cost_per_image    ❌
  #     litellm_params.input_cost_per_pixel    ❌
  # Der Wert unter `model_info` steht trotzdem hier: `check_litellm_config.py` gleicht ihn
  # gegen IMAGE_PRICES ab und meldet ein Auseinanderlaufen. **Beide Stellen gleich halten.**
  #
  # Preise sind USD, die IONOS-Preisliste ist in EUR — umgerechnet mit ~1,111.
  #
  # Welches Modell wofür genutzt wird, entscheidet die **Bildart**
  # (config/image_models.yaml). Ein Modell ohne Bildart lässt sich zwar freischalten, aber
  # kein Assistent kann es nutzen; `/settings/models` weist darauf hin.
  - model_name: bild-standard
    litellm_params:
      model: openai/black-forest-labs/FLUX.1-schnell
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      mode: image_generation
      # Kann NUR 1024x1024. Jede andere Größe → HTTP 400 `invalid-image-size` (gemessen);
      # es stutzt nicht still zurecht. Schlanke Dateien: ~70–165 KB.
      input_cost_per_image: 0.032             # 0,032 $/Bild (= 0,0288 €)

  # Optional, für Hoch- und Querformat. Beherrscht 512² bis 1536² pixelgenau, liefert aber
  # **rund vierzigmal größere Dateien** als FLUX.1 (1024²: 3,0 MB statt 73 KB) — das
  # schlägt bei vielen Nutzer:innen auf den Speicherplatz durch. Nicht als Standard-Bildart
  # setzen.
  #
  # Der IONOS-Tarif ist megapixelbasiert (0,013 € erstes MP, 0,001 € je weiteres), in der
  # Wirkung aber fast flach: 0,0144 $ bei 0,26 MP gegen 0,0160 $ bei 2,36 MP. Ein fester
  # Preis je Bild trifft die ganze Spanne auf ±5 %; `input_cost_per_pixel` wird nicht
  # gebraucht (und von LiteLLM für Bilder ohnehin nicht aus dieser Config gelesen).
  - model_name: bild-flux2
    litellm_params:
      model: openai/black-forest-labs/FLUX.2-klein-4B
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      mode: image_generation
      input_cost_per_image: 0.0152            # Mittelwert über 0,26–2,36 MP

  # Pflicht-Fallback laut Projektvorgabe (CLAUDE.md): greift bei erschöpftem Budget und
  # für sensible Fälle. Läuft lokal — keine Kosten, daher keine Preisangaben nötig.
  - model_name: ollama-fallback
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      supports_function_calling: false

  # ══ Ebene 2: explizite Modelle — Allowlist NUR `lehrkraefte` ════════════════════════
  # Zeigen auf dieselben Backends wie die Aliase; der Unterschied ist allein die Bindung.
  # Ein Assistent auf einem expliziten Namen folgt einem schulweiten Modellwechsel NICHT
  # und bricht, wenn der Eintrag hier entfällt — `/admin/assistants/model-check` meldet das.
  #
  # ⚠️ NICHT aufgenommen: Llama 3.1 405B und Llama 3.1 8B. Beide stehen im Katalog, sind aber
  # abgekündigt (15.09.2026 bzw. 01.10.2026) und in keiner Preisliste geführt — ein Assistent
  # darauf wäre binnen Wochen kaputt und würde bis dahin mit Spend 0 laufen.

  - model_name: ionos-mistral-small-24b
    litellm_params:
      model: openai/mistralai/Mistral-Small-24B-Instruct
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000011
      output_cost_per_token: 0.00000033

  - model_name: ionos-gpt-oss-120b
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000017
      output_cost_per_token: 0.00000071

  - model_name: ionos-qwen3-coder-next
    litellm_params:
      model: openai/Qwen/Qwen3-Coder-Next
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000017
      output_cost_per_token: 0.00000089

  - model_name: ionos-llama-3.3-70b
    litellm_params:
      model: openai/meta-llama/Llama-3.3-70B-Instruct
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000071        # 0,71 $/M
      output_cost_per_token: 0.00000071       # 0,71 $/M

  - model_name: ionos-qwen3.5-397b
    litellm_params:
      model: openai/Qwen/Qwen3.5-397B-A17B
      api_base: os.environ/IONOS_API_BASE
      api_key: os.environ/IONOS_API_KEY
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.00000067
      output_cost_per_token: 0.00000400

# ── Jugendschutz-Guardrails ───────────────────────────────────────────────────────────
# Die drei `openai_moderation`-Guardrails aus infra/litellm_config.example.yaml funktionieren
# mit IONOS NICHT — die Moderation-API gibt es dort nicht. Sie sind hier durch **einen**
# LLM-Klassifikator ersetzt, der alle drei Kategorien in einem Aufruf bewertet
# (`infra/guardrails/llm_moderation.py`, Kategorien und Schwellen in `moderation_core.py`).
#
# ⚠️ Deployment: `llm_moderation.py` und `moderation_core.py` müssen dort liegen, wo der
# Proxy läuft, und von seinem Arbeitsverzeichnis aus importierbar sein.
#
# Verhalten bei Störungen: **fail-open**. Timeout, Netzfehler oder eine unlesbare Antwort
# lassen den Text durch und schreiben eine Warnung. Ein fail-closed Guardrail würde bei einer
# Anbieterstörung die ganze Schule blockieren — unverhältnismäßig, und konsistent mit dem
# PII-Gate (Phase 14) und ADR-008 Teil 3.
#
# ⚠️ Der Klassifikator läuft bei `default_on: true` bei JEDER Antwort. Sein Spend läuft NICHT
# über den Virtual Key der Nutzer:innen, taucht also nicht im Nutzerbudget auf.
#
# ⚠️ Dieser Block gehört auf die OBERSTE Ebene, nicht unter `litellm_settings`. Dort erwartet
# LiteLLM das alte Guardrail-Format und quittiert diese Schreibweise beim Start mit
# „GuardrailItem() argument after ** must be a mapping, not str" — der Proxy startet dann gar
# nicht erst.
# ── Bildpreise: der Umweg, den LiteLLM erzwingt ───────────────────────────────────────
# Für Bilder ignoriert LiteLLM den Preis aus `model_info` und rechnet nur über seine
# eingebaute Tabelle — selbst eingetragene Bildmodelle kosten damit 0,00 $ und laufen am
# EUR-Budget vorbei. Dieser Callback trägt die Preise beim Start in ebendiese Tabelle ein.
# Danach rechnet LiteLLM wieder selbst: Header, SpendLog, Budget und Statistik stimmen
# ohne Sonderweg im Backend.
#
# Preise stehen in der Umgebung, nicht hier — Modell-ID (ohne Provider-Präfix) → $/Bild:
#     IMAGE_PRICES='{"black-forest-labs/FLUX.1-schnell":0.032,"black-forest-labs/FLUX.2-klein-4B":0.0152}'
# ⚠️ In einfachen Anführungszeichen! Das Startskript `source`t die .env, und die Shell
# entfernt sonst die inneren Anführungszeichen — aus dem JSON würde Unsinn.
litellm_settings:
  callbacks: ["guardrails.bildpreise.registrierung"]

guardrails:
  - guardrail_name: "jugendschutz"
    litellm_params:
      guardrail: guardrails.llm_moderation.LlmModerationGuardrail
      mode: post_call
      default_on: true
      # Vollqualifiziert (Provider + api_base), NICHT der `model_name` aus der model_list:
      # Der Guardrail ruft litellm direkt auf, nicht den Proxy.
      classifier_model: openai/mistralai/Mistral-Small-24B-Instruct
      classifier_api_base: os.environ/IONOS_API_BASE
      classifier_api_key: os.environ/IONOS_API_KEY
      timeout: 8.0
      # Ein zweiter Anlauf deckt die häufigste Störung ab — die kurze. Gelingt er, steht
      # das als WARNING im Log: Häufige Wiederholungen haben andere Ursachen (Latenz,
      # Überlast, zu knappes Timeout) als vollständige Ausfälle.
      classifier_retries: 1

      # Optionaler zweiter Klassifikator — Entscheidung der Schule.
      #   · GLEICHES Modell bei einem ANDEREN Anbieter: echte Ausfallsicherheit, ohne dass
      #     die Abgrenzung gegen Unterrichtstexte neu geprüft werden muss. Lohnt sich,
      #     sobald ohnehin ein zweiter Anbieterzugang besteht.
      #   · ANDERES Modell: braucht dieselbe Prüfung wie das primäre — sonst tauscht man
      #     im Störfall eine bekannte Größe gegen eine unbekannte. Nur sinnvoll, wenn es
      #     tatsächlich häufiger zu Störungen kommt (siehe Zähler unten).
      # fallback_classifier_model: openai/gpt-4o-mini
      # fallback_classifier_api_key: os.environ/OPENAI_API_KEY

      # Verhalten, wenn auch der Rückfall nichts liefert. Diese Teams arbeiten weiter,
      # alle anderen bekommen die Antwort zurückgehalten. Ein unbekanntes Team gilt als
      # schutzbedürftig — ein kaputter Team-Bezug darf nicht alle zu Lehrkräften machen.
      fail_open_teams: ["lehrkraefte"]

      # Zählerstand für /admin/guardrail/health. Fail-open ist nur zu verantworten, wenn
      # man weiß, wie oft es eintritt — eine Warnung im Log liest niemand.
      #
      # ⚠️ DIESE DATEI MUSS DER ANWENDUNGS-STACK LESEN KÖNNEN. Der Proxy läuft in einem
      # EIGENEN Compose-Stack, oft in einem anderen Verzeichnis — `./data` des
      # Anwendungs-Stacks ist für ihn nicht sichtbar. Beide Seiten müssen dasselbe
      # HOST-Verzeichnis einbinden:
      #
      #   LiteLLM-Stack:      - /srv/ggd-ki/data:/app/data
      #   Anwendungs-Stack:   - ./data:/app/data          (bereits vorhanden)
      #   Backend-.env:       GUARDRAIL_HEALTH_FILE=data/guardrail_health.json
      #
      # Laufen Proxy und Anwendung auf VERSCHIEDENEN Hosts, ist eine gemeinsame Datei
      # nicht möglich — dann `health_file` weglassen und die Überwachung über das
      # Proxy-Log führen (siehe docs/admin/content-moderation.md). Der Endpunkt meldet
      # dann `available: false`, also ausdrücklich NICHT „alles in Ordnung".
      #
      # Ein liegengebliebener Bericht (Proxy gestoppt) gilt nach
      # GUARDRAIL_HEALTH_MAX_AGE_H als veraltet und nicht mehr als gesund.
      health_file: "/app/data/guardrail_health.json"   # lokal: ../data/guardrail_health.json
      # Optional — ohne Angabe gelten die Defaults aus moderation_core.py
      # (sexual 0.5, violence_graphic 0.7, self_harm_instructions 0.5).
      thresholds:
        sexual: 0.5
        violence_graphic: 0.7
        self_harm_instructions: 0.5

  # Kein zweiter Guardrail-Eintrag für Drogen-Anleitungen: Die Kategorie
  # `drug_instructions` steckt im Klassifikator oben und kostet dort keinen zweiten Aufruf.
  #
  # Der frühere `regex`-Eintrag auf guardrails/drugs_how_to.txt ist entfallen — den Typ
  # `regex` gibt es seit LiteLLM 1.83.7 nicht mehr, der Proxy startet damit nicht einmal
  # („ValueError: Unsupported guardrail: regex"). Sein Nachfolger `litellm_content_filter`
  # wäre kein Drop-in und hätte dasselbe Grundproblem: Ein Muster wie
  # `(anleitung|rezept).{0,40}synthese` trifft den Chemieunterricht mit.
  # Die Musterdatei bleibt als Ausgangspunkt liegen, falls später doch eine deterministische
  # zweite Schicht gewünscht ist (der Klassifikator ist fail-open).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: true

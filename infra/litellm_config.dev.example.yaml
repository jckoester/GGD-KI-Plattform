# litellm_config.dev.example.yaml — LiteLLM-Proxy für die LOKALE Entwicklung
#
# Diese Datei ersetzt im Dev-Betrieb den im Homelab gehosteten Proxy
# (früher LITELLM_PROXY_URL=https://alan-dev.jckoester.de). Sie startet einen
# lokalen, DB-gestützten LiteLLM-Proxy auf http://localhost:4000.
#
# Anders als infra/litellm_config.example.yaml (Produktion) sind hier die
# Jugendschutz-Guardrails BEWUSST weggelassen, damit lokal ohne kuratierte
# Pattern-Sets/Moderation-Setup entwickelt werden kann. Für Guardrail-Arbeit
# die Blöcke aus der Produktions-Vorlage übernehmen.
#
# Kopieren und anpassen:
#   cp infra/litellm_config.dev.example.yaml infra/litellm_config.dev.yaml
#
# Start (aus dem Repo-Root, backend-venv aktiviert):
#   set -a && source .env && set +a
#   litellm --config infra/litellm_config.dev.yaml --port 4000
#
# Siehe docs/dev/dev-setup.md → "LiteLLM lokal starten".

model_list:
  # Aufgaben-Aliase wie in den Betriebsvorlagen (litellm_config.ionos.example.yaml): Die `.env`
  # fragt genau diese Namen an (CHAT_DEFAULT_MODEL, TITLE_MODEL, VORSCHLAG_MODEL,
  # BEGRIFFE_MODEL, EMBEDDING_MODEL, IMAGE_DEFAULT_MODEL). Hier liegt im Dev der günstige
  # OpenAI-Weg dahinter — ein OPENAI_API_KEY genügt. Für die OpenAI-Modelle kennt LiteLLM die
  # Preise selbst (USD, passend zu LITELLM_PRICE_CURRENCY=USD in .env.example); erst mit eigener
  # `api_base` müssten sie unter `model_info` stehen.
  #
  # Bis 0.34 standen hier noch Produktnamen (`gpt-4`, `text-embedding-3-small`, `gpt-image-1.5`)
  # aus der Zeit vor dem Namensschema (ADR-015) — die `.env.example` fragte sie nicht mehr an.

  # ── Chat ────────────────────────────────────────────────────────────────────
  - model_name: chat-standard
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Schüler-Assistenten laufen auf `chat-komplex` (config/assistants.example.yaml).
  - model_name: chat-komplex
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # ── Hintergrundaufgaben (`system-` blendet sie im Modellwähler aus) ─────────
  - model_name: system-titel
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: system-vorschlag
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: system-begriffe
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Embeddings ──────────────────────────────────────────────────────────────
  # 1536 Dimensionen = EMBEDDING_DIMENSIONS in .env.example. Beim Tausch die Spaltenbreite
  # beachten — Migration + Re-Embedding: docs/runbooks/modellwechsel.md.
  - model_name: embedding-standard
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding

  # ── Bildgenerierung (optional) ──────────────────────────────────────────────
  # Nur nötig, wenn Bildfunktionen lokal getestet werden. `mode: image_generation` ist Pflicht,
  # sonst erscheint das Modell nicht als Bildmodell.
  - model_name: bild-standard
    litellm_params:
      model: openai/gpt-image-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: image_generation

general_settings:
  # Voller Zugriff auf die Management-API (User/Teams/Keys/Budgets). Muss mit
  # LITELLM_MASTER_KEY in .env übereinstimmen — das Backend authentifiziert sich
  # damit gegen den Proxy. Lokal darf ein schwacher Dev-Key stehen (z. B. sk-dev).
  master_key: os.environ/LITELLM_MASTER_KEY

  # Eigene Postgres-DB für den Proxy (Virtual Keys, Teams, Budgets, SpendLogs).
  # WICHTIG: plain postgresql:// (NICHT der asyncpg-DSN des Backends) und eine
  # SEPARATE Datenbank, damit LiteLLMs Prisma-Schema nicht mit dem Alembic-Schema
  # der App kollidiert. Siehe LITELLM_DATABASE_URL in .env.example.
  database_url: os.environ/LITELLM_DATABASE_URL

  # Über die Admin-UI angelegte Modelle/Credentials in die DB schreiben und beim
  # Start neu laden. Ohne dies (Default False) leben sie nur im Speicher und sind
  # nach einem Neustart WEG. Die model_list oben bleibt die statische Basis; die
  # UI-Einträge kommen additiv aus der DB dazu.
  store_model_in_db: true

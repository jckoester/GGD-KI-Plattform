      - Berechne die Dichte von Kupfer aus Masse und Volumen
      - Was ist eine Funktion?
      - Wie werte ich die Tabelle zur Arbeitslosigkeit aus?
      - Mein Python-Programm rechnet die Summe falsch
      - Was kommt in der Mathearbeit am Freitag dran?
      - Wer hat den Satz des Pythagoras erfunden?
      - Wie viele Sekunden hat ein Tag?

  - name: Versuchsplanung und -auswertung

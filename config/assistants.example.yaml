    bausteine: [begleiten_statt_loesen, grundton]
    tags: [mathematik]
    operator_faecher: [mathematik]
    suggest: fallback
    suggestion_text: >-
      Für Mathe-Aufgaben gibt es einen Assistenten, der dich Schritt für Schritt begleitet – den
      Rechenweg findest du selbst.
    trigger_examples:
      - Ein Rechteck ist 12 cm lang und 5 cm breit, wie groß sind Umfang und Fläche?
      - ich versteh nicht wie man brüche mit verschiedenen nennern addiert
      - Berechne 18 % von 250
      - 'Textaufgabe: Ein Handyvertrag kostet 10 € Grundgebühr und 0,09 € pro Minute. Ab wann ist er teurer als eine Flatrate für 25 €?'
      - wie berechnet man die nullstellen von f(x) = x² - 4x + 3
      - Vereinfache den Term 3(a + 2b) - 2(a - b)
      - wie geht schriftliches dividieren nochmal
      - Zeige, dass die Winkelsumme im Dreieck 180° beträgt
      - Bestimme die Steigung der Geraden durch die Punkte (1|2) und (3|8)
      - ich muss die ableitung von x³ - 2x bilden, wie geht das
      - Wie groß ist die Wahrscheinlichkeit, mit zwei Würfeln eine 7 zu werfen?
      - wie löst man ein gleichungssystem mit zwei unbekannten
      - Berechne den Flächeninhalt eines Kreises mit Radius 4 cm

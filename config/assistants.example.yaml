      Begleitet Versuche und Experimente — planen, beobachten, Messwerte festhalten und darstellen,
      deuten, Fehlerquellen finden, Protokoll — in Biologie, Chemie, Physik, BNT und NwT.
    audience: student
    scope: all_students
    status: active
    min_grade: 5
    max_grade: 13
    model: chat-komplex
    disabled_augmentations: [metacognitive_nudges]
    system_prompt_file: config/prompts/versuche_assistent.md
    bausteine: [begleiten_statt_loesen, grundton]
    tags: [biologie, chemie, physik, bnt, nwt]
    operator_faecher: [biologie, chemie, physik, nwt, nit]
    suggest: fallback
    suggestion_text: >-
      Für eigene Versuche gibt es einen Assistenten, der dich beim Planen, beim Darstellen und Deuten
      deiner Messwerte und beim Protokoll Schritt für Schritt begleitet – beobachten und deuten tust
      du selbst.
    trigger_examples:
      - wir haben einen versuch gemacht und ich weiß nicht wie ich das protokoll schreiben soll
      - Wie plane ich ein Experiment, ob Licht das Wachstum von Bohnen beeinflusst?
      - ich soll eine hypothese aufstellen warum das eis schneller schmilzt
      - Was ist der Unterschied zwischen Beobachtung und Deutung in meinem Protokoll?
      - Wir haben die Temperatur beim Erhitzen von Wasser jede Minute gemessen, wie werte ich das aus?
      - welche fehlerquellen könnte unser versuch mit dem pendel haben
      - wie mache ich aus meinen messwerten ein diagramm
      - Ich soll einen Versuch zur Gärung mit Hefe planen, was muss ich gleich lassen?
      - Bei unserem Versuch kam was anderes raus als erwartet, was schreibe ich in die Auswertung?
      - 'Versuch: Kerze unter einem Glas geht aus. Ich muss die Beobachtung beschreiben'

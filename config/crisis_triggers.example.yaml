# Krisen-Trigger für die lokale Backend-Erkennung (ADR-008 Teil 3).
#
# Jede eingehende Nutzer-Nachricht wird regex-basiert, case-insensitive und
# Unicode-normalisiert (NFKC + casefold) gegen die patterns geprüft. Bei Treffer:
# dezentes Hilfe-Ressourcen-Banner (help_topic → help_resources.yaml), ein
# pseudonymes Flag, ein Log-Eintrag und — seit 0.12 — eine **Anweisung an das Modell**,
# wie es antworten soll. KEINE Blockierung des Chats (ADR-008 Teil 3).
#
#   severity:        info | warning | alert
#   help_topic:      muss einen Eintrag in help_resources.yaml (topics) referenzieren
#   coreviewer_role: empfohlene Zweit-Rolle für die spätere 4-Augen-Einsicht (stets "review")
#   anweisung:       optional — eigener Text statt des mitgelieferten Standards
#
# **Zur `anweisung`.** Ohne Angabe gilt ein Standardtext aus dem Code
# (`app/crisis/anweisung.py`): keine Mengen/Mittel/Methoden nennen, die Person ruhig und
# ohne Vorwurf ansprechen, keine Diagnose, auf Hilfe hinweisen — und keine
# Telefonnummern erfinden. Er wird mit dem Update aktiv, ohne dass Sie etwas tun; wer
# ihn anders will, setzt `anweisung:` an der Kategorie. Er verweist bewusst **nicht**
# auf das Hilfe-Banner: Das erscheint nur beim ersten Treffer einer Kategorie je
# Konversation.
#
# ⚠ Startkuratierung — MUSS mit der Schulsozialarbeit final abgestimmt werden
#   (Sprachsensibilität, Jugendsprache, regionale Ausdrücke, Fehlalarme).

triggers:
  - category: suizidalitaet
    severity: alert
    help_topic: crisis
    coreviewer_role: review
    patterns:
      - "(will|möchte|würde gern|würde gerne) (mich |ich |einfach |gerade )?(umbringen|sterben|nicht mehr leben)"
      - "nicht mehr leben wollen"
      - "keinen sinn mehr( im leben)?"
      - "niemand würde mich vermissen"

  - category: selbstverletzung
    severity: alert
    help_topic: crisis
    coreviewer_role: review
    patterns:
      - "(ritze|ritz|schneide|schneid) mich"
      - "mich selbst (verletzen|verletzt)"
      - "mich selber (verletzen|verletzt)"

  - category: haeusliche_gewalt
    severity: alert
    help_topic: crisis
    coreviewer_role: review
    patterns:
      - "(vater|mutter|papa|mama|stiefvater|stiefmutter) (schlägt|haut|prügelt) mich"
      - "werde zuhause geschlagen"
      - "angst vor zuhause"

  - category: essverhalten
    severity: warning
    help_topic: eating
    coreviewer_role: review
    patterns:
      - "nichts mehr essen"
      - "ich bin zu dick"
      - "(gebrochen|erbrechen|erbreche) nach dem essen"

  - category: mobbing
    severity: warning
    help_topic: school_social
    coreviewer_role: review
    patterns:
      - "alle lachen über mich"
      - "niemand mag mich in der klasse"
      - "(ärgern|fertigmachen|mobben) mich (in der schule|in der klasse)"

  # ───────────────────────────────────────────────────────────────────────────
  # ⚠️ UNABGESTIMMTER FORMULIERUNGSVORSCHLAG (0.12). Vor der Übernahme in die eigene
  # `crisis_triggers.yaml` mit der Schulsozialarbeit abstimmen — diese Muster sind
  # nicht geprüft, sondern ein Ausgangspunkt.
  #
  # Abgrenzung zum Sicherheitsauslöser N12 (`home_experiment_triggers.yaml`): Die
  # **Sachfrage** nach Giftigkeit („Was bedeutet LD50?", „Wie viel Koffein ist
  # tödlich?") ist Unterrichtsstoff und löst hier **nicht** aus; sie bekommt dort eine
  # Anweisung, keine Menge zu nennen. Hier geht es um die beiden Fälle, die als
  # Warnzeichen gelten: Letalität zusammen mit einem **Medikament** oder mit einem
  # **Personenbezug**.
  #
  # ⚠️ Deshalb **kein** Muster auf „tödlich", „überdosis" oder „ld50" allein — das
  # träfe den Chemieunterricht. Jedes Muster verlangt beide Hälften.
  #
  # ⚠️ Einfache Anführungszeichen, wo ein Backslash vorkommt: In doppelten ist `\d`
  # in YAML eine ungültige Escape-Sequenz und die Datei lädt nicht mehr.
  - category: letalitaet
    severity: alert
    help_topic: crisis
    coreviewer_role: review
    patterns:
      # Medikament + Letalität, beide Richtungen
      - "(tabletten|pillen|medikament|schlaftablett|paracetamol|ibuprofen|aspirin|insulin).{0,40}(tödlich|sterben|umbringen|überdosis|letal)"
      - "(tödlich|sterben|umbringen|überdosis|letal).{0,40}(tabletten|pillen|medikament|schlaftablett|paracetamol|ibuprofen|aspirin|insulin)"
      # Letalität + Personenbezug, beide Richtungen
      - "(tödlich|sterbe|sterben|stirbt man|überdosis|letal).{0,40}(bei mir|für mich|ich wiege|meinem gewicht)"
      - "(bei mir|für mich|ich wiege|mein gewicht).{0,40}(tödlich|sterbe|sterben|stirbt man|überdosis|letal)"
      - '\d+ ?kg.{0,40}(tödlich|sterben|stirbt|gefährlich)'
      - '(tödlich|sterben|stirbt).{0,40}\d+ ?kg'
      - "nicht mehr aufwachen"

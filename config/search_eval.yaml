# Prüfsatz für die semantische Suche
#
# Feste Liste „Frage → erwarteter Treffer". Ohne sie ist jede Änderung an der Suche ein
# Blindflug: Ob eine Umstellung die Treffer verbessert oder verschlechtert, lässt sich am
# Einzelfall nicht beurteilen — die Unterschiede liegen oft im Hundertstelbereich.
#
# Ausgeführt von `backend/scripts/search_eval.py`. Kein pytest-Test: Die Frage ergibt nur
# gegen den echten Wissensgraph und ein echtes Embedding-Modell Sinn.
#
# Die Stellschrauben der Suche und das Vorgehen beim Ändern: `docs/dev/kontextsuche.md`.
#
# Felder je Fall:
#   frage    Der Suchtext, so wie ihn jemand eingeben würde.
#   fach     Das Fach, aus dem der beste Treffer kommen sollte. Wird gegen den Treffer
#            auf Platz 1 geprüft.
#   knoten   Optional. Kompetenznummer (`3.3.2(1)`) oder ein Stück des Titels. Gemeldet
#            wird der Rang des ersten passenden Treffers — so sieht man auch, wenn der
#            erwartete Knoten zwar gefunden wird, aber auf Platz 9.
#   chat_fach Optional. Das Fach der Konversation, in der gefragt wird — nicht zu
#            verwechseln mit `fach` (dem Fach des erwarteten Treffers). Treffer aus
#            `chat_fach` werden vorgezogen. Ohne Angabe wird ohne Fachbezug gesucht;
#            das ist der Normalfall vieler Chats und muss mitgemessen werden.
#            Fälle, in denen sich beide **unterscheiden**, sind die Wächter gegen einen
#            zu starken Vorzug: Wer im Physik-Chat nach Pythagoras fragt, soll die
#            Mathematik-Kompetenz bekommen.
#   notiz    Optional. Wofür dieser Fall steht.
#
# ⚠️ Die Erwartungen sind am Bestand der Entwicklungsinstanz geprüft (Stand 30.08.2026,
# Bildungsplan BW, 14.244 Vektoren). Wer einen anderen Bestand hat — andere Fächer,
# andere Editionen —, muss sie anpassen; ein Fall, dessen erwarteter Knoten gar nicht
# importiert ist, misst nichts.

top_k: 10

faelle:
  # ── Fälle, die den Anlass gaben ───────────────────────────────────────────────
  - frage: Wie berechnet man den Flächeninhalt eines Kreises?
    fach: Mathematik
    knoten: 3.3.2(1)
    notiz: >-
      Der Ausgangsfall. Lieferte bis 30.08.2026 ausschließlich Geographie-Knoten
      (Wasserkreislauf, Kreislauf der Gesteine), obwohl der Mathematik-Knoten mit 0.581
      gegen 0.495 deutlich ähnlicher ist.

  - frage: Gedichte interpretieren und sprachliche Bilder deuten
    fach: Deutsch
    knoten: 3.4.1.1
    notiz: >-
      Operatorfalle. Die Frage enthält das Operatorverb „interpretieren"; die kurzen
      Operator-Knoten schlagen die längeren Kompetenztexte. Erwartet wird die Leitidee
      „Literarische Texte".

  - frage: Raum und Zeit in der bildenden Kunst
    fach: Bildende Kunst
    knoten: 3.1.4
    notiz: >-
      Zeigte scheinbar, dass die Ähnlichkeitswerte kaum trennen (vier Treffer im Band
      0.601–0.603). Exakt gesucht steht die Leitidee „Zeit" mit 0.775 klar oben.

  # ── Fälle, die schon funktionierten (Kontrollen) ──────────────────────────────
  - frage: Fotosynthese
    fach: Biologie
    knoten: 3.2.3(1)
    notiz: Kontrolle. Kurze, eindeutige Fachfrage ohne Operatorverb.

  - frage: Elektronen abgeben und aufnehmen bei der Redoxreaktion
    fach: Chemie
    knoten: 3.4.7
    notiz: Kontrolle. Umschreibung ohne Fachwort im Titel; funktionierte bereits.

  - frage: Was ist ein kategorischer Imperativ?
    fach: Ethik
    knoten: 3.3.3.3(3)
    notiz: Kontrolle. Benannter Fachbegriff.

  - frage: Ursachen des Ersten Weltkriegs
    fach: Geschichte
    knoten: 3.2.6(2)
    notiz: Kontrolle. Die Kompetenz trägt die Frage fast wörtlich im Titel.

  # ── Weitere Fächer, Operatorverben, Umschreibungen ────────────────────────────
  - frage: Satz des Pythagoras am rechtwinkligen Dreieck
    fach: Mathematik
    knoten: Pythagoras
    notiz: >-
      Prüft, ob ein Schulcurriculum-Kapitel („Beziehungen am rechtwinkligen Dreieck")
      und die Bildungsplan-Kompetenz beide gefunden werden.

  - frage: Textaufgaben zu linearen Gleichungssystemen
    fach: Mathematik
    knoten: 3.2.1(23)
    notiz: >-
      Knapp. Direkt hinter dem richtigen Treffer folgen eine Deutsch-Leitidee, der
      Operator „lösen" und eine Latein-Leitidee — ein Fachbezug entscheidet hier.

  - frage: unregelmäßige Verben im Simple Past
    fach: Englisch
    knoten: 3.2.3.8(4)
    notiz: >-
      Härtester Operatorfall: liefert viermal den Operator „nennen", kein Englisch.
      Kein Operatorverb in der Frage — die Ähnlichkeit entsteht allein aus der Kürze
      der Operator-Knoten.

  - frage: Wetter und Klima im Vergleich
    fach: Geographie
    knoten: 3.1.2.1(3)
    notiz: >-
      Operatorfalle über die Wortform „Vergleich" → Operator „vergleichen" (0.629)
      schlägt die passgenaue Kompetenz (0.612).

  - frage: Passé composé und Imparfait unterscheiden
    fach: Französisch
    knoten: 3.2.3.8(4)
    notiz: Fremdsprache mit Akzenten; prüft die Tokenisierung nicht-deutscher Begriffe.

  - frage: Aufbau und Funktion des menschlichen Auges
    fach: Biologie
    knoten: 3.3.1(2)
    notiz: Trifft, aber ein Operator („wahrnehmen") drängt sich auf Platz 3.

  - frage: Wie funktioniert ein Transistor?
    fach: NwT
    knoten: 3.2.4.4(1)
    notiz: >-
      Das erwartete Fach ist NwT, nicht Physik — im Bildungsplan stehen elektronische
      Schaltungen dort. Der Fall hält fest, dass die Erwartung aus dem Bestand kommt
      und nicht aus dem Bauchgefühl.

  - frage: Programmschleifen und Verzweigungen
    fach: Informatik
    knoten: 3.1.2(1)
    notiz: >-
      Liefert zwei Leitperspektiven-Aspekte ohne Fachbezug vor der Informatik-Kompetenz.
      Prüft, ob fachlose Knoten die Liste verstopfen.

  # ── Fachbezug: Gleichlauf (Chat-Fach = erwartetes Fach) ───────────────────────
  #
  # Diese Fälle prüfen, ob der Fachvorzug greift, wo er greifen soll. Alle drei sind
  # ohne Fachbezug Fehlschläge — Operatoren aus anderen Fächern gewinnen.

  - frage: Gedichte interpretieren und sprachliche Bilder deuten
    fach: Deutsch
    chat_fach: Deutsch
    knoten: 3.4.1.1
    notiz: Ohne Fachbezug dreimal der Operator „interpretieren" aus Physik/Biologie/Kunst.

  - frage: unregelmäßige Verben im Simple Past
    fach: Englisch
    chat_fach: Englisch
    knoten: 3.2.3.8(4)
    notiz: Ohne Fachbezug viermal der Operator „nennen", kein Englisch-Knoten.

  - frage: Wetter und Klima im Vergleich
    fach: Geographie
    chat_fach: Geographie
    knoten: 3.1.2.1(3)
    notiz: Ohne Fachbezug viermal der Operator „vergleichen".

  # ── Fachbezug: Gegenfälle (Chat-Fach ≠ erwartetes Fach) ───────────────────────
  #
  # Sie begrenzen den Bonus nach oben. Fallen sie, ist aus dem Vorzug ein Filter
  # geworden — dann ist der Wert in `_FACHBONUS` zu hoch.

  - frage: Wie berechnet man den Flächeninhalt eines Kreises?
    fach: Mathematik
    chat_fach: Geographie
    knoten: 3.3.2(1)
    notiz: >-
      Der schärfste Gegenfall: Im Geographie-Chat gefragt, und Geographie führt mit
      „Wasserkreislauf" und „Kreislauf der Gesteine" ausgerechnet die Knoten, die sich
      aufdrängen. Trotzdem muss Mathematik oben stehen.

  - frage: Satz des Pythagoras am rechtwinkligen Dreieck
    fach: Mathematik
    chat_fach: Physik
    knoten: Pythagoras
    notiz: Fachfremde Frage im Physik-Chat — ein alltäglicher Fall, kein konstruierter.

  - frage: Fotosynthese
    fach: Biologie
    chat_fach: Chemie
    knoten: 3.2.3(1)
    notiz: Chemie ist inhaltlich benachbart und damit ein realistischer Störfall.

  # ── Nachschlagen: benannte Knoten ─────────────────────────────────────────────
  #
  # Die semantische Suche findet Bedeutung, aber keine Namen: „Operator nennen" lieferte
  # *erkennen*, *korrigieren*, *berichten*. Diese Fälle prüfen den lexikalischen Weg.
  # `fach` bleibt bewusst leer — denselben Operator führen zwei Dutzend Fächer, welches
  # oben steht, ist ohne Fachbezug beliebig und darf nicht geprüft werden.

  - frage: Operator nennen
    knoten: nennen
    notiz: >-
      Die Anfrage, die das Modell im Chat tatsächlich stellt. Rein semantisch nicht
      auffindbar — „Operator" beherrscht den Vektor, das Verb geht darin unter.

  - frage: Was bedeutet der Operator nennen?
    knoten: nennen
    notiz: Ausformulierte Frageform; die Füllwörter dürfen nichts ändern.

  - frage: >-
      Erstelle eine Übersicht über die Operatorendefinitionen für "nennen" in den
      verschiedenen Fächern. Nutze dazu die Operatorendefinitionen aus dem Kontextspeicher.
    knoten: nennen
    notiz: >-
      Der Original-Prompt aus dem Praxistest vom 30.08.2026. Er scheiterte zusätzlich an
      der Zusammensetzung „Operatorendefinitionen" — deshalb steht er als eigener Fall.

  - frage: Definition des Operators analysieren
    knoten: analysieren

  - frage: Bedeutung von beurteilen als Operator
    knoten: beurteilen
    notiz: Semantisch lieferte diese Form *einschätzen* statt *beurteilen*.

  - frage: Was ist die Leitidee Messen?
    knoten: Leitidee Messen
    notiz: >-
      Mehrwortiger Name, und der Titel trägt eine Gliederungsnummer („3.3.2 Leitidee
      Messen"). Prüft beides: die Wortfolge-Form und die Nummern-Normalisierung.

  - frage: Elektrochemie
    knoten: Elektrochemie
    notiz: Einzelwort ohne Rahmen — die einfachste Form des Nachschlagens.

  # ── S2: Teilsuche in beschreibenden Titeln ──────────────────────────────────
  #
  # Diese Fälle brauchen die Testknoten aus `backend/scripts/seed_search_eval_nodes.py`
  # — sie gibt es im Bildungsplan nicht. Ohne sie messen die Fälle nichts; der Runner
  # meldet dann den erwarteten Knoten als „nicht in der Trefferliste".

  - frage: Anleitung Operator nennen
    knoten: Anleitung zur Verwendung
    notiz: >-
      Der S2-Leitfall: kurze Anfrage, langer beschreibender Titel. Scheitert an der
      Wortlisten-Reduktion, wenn die Teilsuche den reduzierten Begriff statt der
      Rohanfrage bekommt — „Operator" ist ein generisches Wort und fällt weg.

  - frage: Verwendung des Operators nennen
    knoten: Anleitung zur Verwendung
    notiz: Zusammenhängender Ausschnitt des Titels, ohne das erste Wort.

  - frage: Merkblatt Gedichtanalyse
    knoten: Merkblatt zur Gedicht
    notiz: >-
      Zweiter Typ (methodenblatt) und zugleich Wächter: Der Knoten liegt thematisch
      neben dem Bestandsfall zur Gedichtinterpretation und darf ihn dort nicht
      verdrängen.

# ── Aufzählungen ──────────────────────────────────────────────────────────────
#
# Eine andere Frageklasse und deshalb ein eigener Abschnitt: „alle, die …" verlangt
# **Vollständigkeit**, nicht Ähnlichkeit. Geprüft wird die deterministische
# Filterabfrage der Suchschicht (`app.context.search.aufzaehlung`) — kein Embedding,
# kein Rang, sondern eine Zahl.
#
# Felder je Fall:
#   titel         Exakter Name (normalisiert, ohne Gliederungsnummer). Optional.
#   content_type  Knotenart. Optional.
#   fach          Fachname zum Einschränken. Optional; ohne Angabe über alle Fächer.
#   gesamt        Erwartete Gesamtzahl nach Fassungs-Zusammenfassung.
#   faecher       Erwartete Zahl verschiedener Fächer.
#   notiz         Optional. Wofür dieser Fall steht.
#
# ⚠️ Die Erwartungen stammen aus dem **Bildungsplan**, nicht aus zufälligem Dev-Bestand:
# Der BP ist in jeder Instanz identisch importiert, die Zahlen sind also übertragbar.
# Wer eine Instanz ohne vollständigen BP-Import prüft, bekommt hier Abweichungen.

aufzaehlungen:
  - titel: nennen
    content_type: operator
    gesamt: 24
    faecher: 18
    notiz: >-
      Der Musterfall aus Befund 1. Bis 08/2026 beantwortete die Plattform ihn über die
      Ähnlichkeitssuche mit einem Limit: Sie nannte 14 der 24 Vorkommen und wirkte dabei
      erschöpfend. Die Aufzählung zählt vor dem Limit und sagt „x von y".

  - titel: beurteilen
    content_type: operator
    gesamt: 25
    faecher: 16
    notiz: Gegenprobe mit einem zweiten Operator — stellt sicher, dass 24/18 kein Zufall ist.

    untis_codes: [M]
    icon: square-radical
    color: "#3b82f6"
    min_grade: 5
    max_grade: 13
    sort_order: 10
    fach_code: M
    # bildungsplan_suffix: ".V2"   # optional: dieses Fach fest auf EINE Edition pinnen.
    #   Ohne Angabe greift der globale `editionen`-Fahrplan (oben) schuljahres-/stufenabhängig.


# Fächer-Konfiguration
# Felder: slug (eindeutig, Kleinbuchstaben), name (Anzeigename), icon (Lucide-Name),
#         color (CSS-Farbe, z.B. #3b82f6), min_grade, max_grade, sort_order,
#         fach_code (optional, Bildungsplan-Fachkürzel wie M/CH; wird in die
#         subjects-Tabelle geseedet und löst #-Cross-Fach-Bezüge auf),
#         untis_codes (optional, Liste der Fachkürzel des Stundenplans — ein DRITTES
#         Vokabular neben slug und fach_code: der Bildungsplan kennt ETH und INFWFO,
#         der Stundenplan ET und INF. Angehängte Ziffern für Parallelkurse (M1, bio2)
#         müssen NICHT eingetragen werden, sie werden beim Abgleich abgeschnitten.
#         GROSS- und Kleinschreibung sind bedeutungstragend: klein = Basiskurs der
#         Kursstufe, groß = Leistungskurs bzw. regulärer Unterricht in Sek I.),
#         sso_aliases (optional, Liste alternativer SSO-Gruppennamen für den
#         Gruppenimport, z.B. [bildende.kunst] für die Gruppe fs.bildende.kunst)
#
schulart: GYM # Bildungsplan-Schulart (GYM, RS, GMS, GS, BSO)

# Stundenplan-Kürzel, die KEIN Unterricht sind (UP-8). Sie erzeugen weder Wochenmuster
# noch Gruppenvorschläge und werden auch nicht als „Fach fehlt" gemeldet — sie werden
# nie eines. Ohne diese Liste behelligt der Import jede Lehrkraft dauerhaft mit
# Dienstterminen, die aussehen wie ein Konfigurationsmangel.
#
# Unterschied zu einem unbekannten Kürzel: Dort steht eine Ergänzung an; hier nicht.
# Die Kürzel sind schulspezifisch — die Beispiele unten sind zu ersetzen.
untis_kein_unterricht:
  - PRÄS # Präsenzstunde / Vertretungsbereitschaft
  - ÖPR # Örtlicher Personalrat
  - SL # Erweiterte Schulleitung
# aktuelles Schuljahr: Single Source of Truth ist config/school_year.yaml
# (hier bewusst NICHT mehr gepflegt, um Doppelkonfig/Divergenz zu vermeiden).

bildungsplan_default: # gilt für alle Fächer ohne eigene Fach-Edition (bildungsplan_suffix)
  bp_basis: BP2016BW # Prefix; zukunftsoffen für BP2030
  suffix: "" # leer = Basisfassung; ".V2" = überarbeitete Fassung (Scraper/Import; wird vom Fahrplan abgelöst)
  # Editions-Fahrplan (Versionierung): pro Edition, ab welchem Schuljahr sie gilt
  # und für welche Stufen. Die Stufen-Zuordnung wird daraus + dem aktuellen
  # Schuljahr BERECHNET (keine jährliche subjects.yaml-Pflege). Die Frontier
  # wandert jahrgangsweise nach oben; ein Fach ohne veröffentlichten BP fällt
  # automatisch auf die vorige Edition zurück.
  # bp_version (= Wert in context_nodes) = <Jahr aus bp_basis> + suffix, z. B. "2016.V2".
  editionen:
    - suffix: "" # Basis/V1 — immer als Fallback gültig
    - suffix: ".V2" # überarbeitete Fassung, bereits vollständig in Kraft
      ab_schuljahr: "2016/17"
      einstieg_stufen: [5, 13]
    - suffix: ".V3" # ab August 2026; startet in 5–7 und wächst jährlich nach oben
      ab_schuljahr: "2026/27"
      einstieg_stufen: [5, 7]
      wachstum: nach_oben
      # Neue Seitengeneration: ein Dokument je Fach statt Übersichtsseite + Unterseiten.
      # Adresse: …/DE_BW_BILDUNGSPLAENE_GEN2X_BPBW_ALLG_<Schulart>_<Fach>(<quell_version>)
      # `quell_version` steht ausdrücklich hier und wird nicht aus dem Suffix geraten —
      # eine Folgefassung (V3.1) trüge weiterhin das Suffix `.V3`.
      seitengeneration: gen2x
      quell_version: "V3.0"

subjects:

schuljahr: "2026/27"
beginn: 2026-09-14
ende: 2027-07-28
halbjahreswechsel: 2027-02-08      # erster Tag des 2. Halbjahrs

# Wie 14-tägige Termine (A-/B-Wochen) gezählt werden:
#   unterrichtswoche  Ferienwochen zählen nicht mit, der Takt läuft über sie hinweg
#                     weiter — vor einwöchigen Ferien B, danach A. (Vorgabe)
#   kalenderwoche     jede Kalenderwoche zählt, auch eine Ferienwoche — vor einwöchigen
#                     Ferien B, danach wieder B.
#
# Der Unterschied zeigt sich nur bei UNGERADER Ferienlänge, dort aber deutlich: Die
# falsche Zählweise legt jede 14-tägige Stunde bis zu den nächsten Ferien in die falsche
# Woche. Einmal am Stundenplan ablesen — eine bekannte 14-tägige Stunde vor und nach den
# Herbstferien genügt.
ab_zaehlung: unterrichtswoche

ferien:
  - { name: "Herbstferien",    von: 2026-10-26, bis: 2026-10-30 }
  - { name: "Weihnachtsferien", von: 2026-12-23, bis: 2027-01-08 }
  - { name: "Osterferien",     von: 2027-04-01, bis: 2027-04-16 }
  - { name: "Pfingstferien",   von: 2027-05-26, bis: 2027-06-05 }

# Feiertage und unterrichtsfreie Tage akzeptieren beide Schreibweisen:
#   - 2026-10-03                                                 (nur Datum)
#   - { name: "Tag der Deutschen Einheit", datum: 2026-10-03 }   (mit Namen, analog zu den Ferien)
feiertage:
  - { name: "Tag der Deutschen Einheit", datum: 2026-10-03 }

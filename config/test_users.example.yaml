# Passwörter mit bcrypt gehasht:
# python -c "from passlib.hash import bcrypt; print(bcrypt.hash('geheim'))"

users:
  - username: lehrer01
    password_hash: <bcrypt-hash>
    role: teacher
    grade: null
    # optional; folgt den Mustern aus auth.yaml sso.groups. Seit 0.46 laufen sso_groups und
    # sso_roles auch durch group_role_map (zusätzlich zu role/roles) — etwa ki-fachvorsitz →
    # fachvorsitz. Vorsicht: ki-admins macht den Testnutzer zum Admin.
    sso_groups:
      - FS.Mathematik
      - Klasse.8a
      - unterricht.8a.Mathematik

  - username: schueler01
    password_hash: <bcrypt-hash>
    role: student
    grade: "10"
    sso_groups:
      - Klasse.10
      - unterricht.10.Mathematik

  - username: admin
    password_hash: <bcrypt-hash>
    role: admin
    grade: null
    sso_groups: []

  # Schulsozialarbeit/Krisen-Einsicht: Rolle review darf eigenständig vorkommen.
  - username: sozial01
    password_hash: <bcrypt-hash>
    roles: [review]
    grade: null
    sso_groups:
      - ki-reviewer
